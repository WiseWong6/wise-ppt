<!doctype html>
<html lang="{{LANG}}" data-runtime="wise-ppt-deck" data-geometry-contract-version="1" data-typography-mode="all-sans" data-deck-title="{{DECK_TITLE}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<link rel="stylesheet" href="{{STYLESHEET_HREF}}">
<script src="{{RUNTIME_SCRIPT_SRC}}"></script>
</head>
<body class="mode-board">
<main id="board"><header class="board-head"><h1 id="deck-title"></h1><p id="deck-subtitle"></p></header><div id="board-sections"></div></main>
<section id="deck" aria-label="横向放映"><div id="deck-stage"><div id="track">
<!-- WISE_PPT_SLIDES_START -->
{{SLIDES}}
<!-- WISE_PPT_SLIDES_END -->
</div></div><div id="presentation-controls" aria-label="放映控制"><button id="board-toggle" class="deck-control" type="button" data-icon="gallery" aria-label="返回画册"><span class="visually-hidden">返回画册</span></button><output id="pager" aria-live="polite"></output></div></section>
</body>
</html>
