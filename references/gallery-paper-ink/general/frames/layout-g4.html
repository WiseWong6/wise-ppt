<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-g4" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.radial.hub-satellites" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-g4 · 中心枢纽 + 环绕卫星</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.radial.hub-satellites.capabilities" data-content-ref="example.g4">
  <div class="doc tl">运营 · 规划 — G4<br>全域增长运营中枢</div>
  <div class="folio">G4 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">全域增长中枢连接六类运营能力，让内容、活动、社群与会员围绕同一目标协同推进。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -33.7)'});
var CX = 960, CY = 540, R = 320;
var HUB_R = 134;        /* 中心墨核外圈 */
var SAT_R = 62, SAT_RI = 54;  /* 卫星外/内圈：内圈容纳最长 mono 码（CAMPAIGN）+ 8px 内边距 */


/* ---------- 构造基准：十字虚线（在墨核与水平卫星处断开，不穿文字） ---------- */
el('line', {x1:CX-R+SAT_R, y1:CY, x2:CX-HUB_R, y2:CY, stroke:INK, 'stroke-width':.5, opacity:.16, 'stroke-dasharray':'2 6'});
el('line', {x1:CX+HUB_R, y1:CY, x2:CX+R-SAT_R, y2:CY, stroke:INK, 'stroke-width':.5, opacity:.16, 'stroke-dasharray':'2 6'});
el('line', {x1:CX, y1:200, x2:CX, y2:CY-HUB_R, stroke:INK, 'stroke-width':.5, opacity:.16, 'stroke-dasharray':'2 6'});
el('line', {x1:CX, y1:CY+HUB_R, x2:CX, y2:880, stroke:INK, 'stroke-width':.5, opacity:.16, 'stroke-dasharray':'2 6'});

/* ---------- 轨道虚线圆 ---------- */
el('circle', {cx:CX, cy:CY, r:R, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.4, 'stroke-dasharray':'4 7'});

/* ---------- 中心实心墨核（核心词纸色刻字） ---------- */
el('circle', {cx:CX, cy:CY, r:HUB_R, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.45});
el('circle', {cx:CX, cy:CY, r:120, fill:INK, stroke:'none'});
txt(CX, CY-6, '增长中枢', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', 'letter-spacing':4, 'text-anchor':'middle', fill:'#DFE0D9'});
txt(CX, CY+34, 'GROWTH CORE', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(223,224,217,.75)'});

/* ---------- 六颗卫星：双圈节点 + mono 码 ---------- */
/* 角度：左 150/180/210，右 30/0/330（顶底留空，呼吸） */
var SAT = [
  {a:150, code:'CONTENT'},
  {a:180, code:'CAMPAIGN'},
  {a:210, code:'SOCIAL'},
  {a:30,  code:'MEMBER'},
  {a:0,   code:'DATA'},
  {a:330, code:'REVIEW'}
];
SAT.forEach(function(s){
  var rad = s.a * Math.PI / 180;
  s.x = CX + R * Math.cos(rad);
  s.y = CY - R * Math.sin(rad);
  el('circle', {cx:s.x, cy:s.y, r:SAT_R, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:s.x, cy:s.y, r:SAT_RI, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(s.x, s.y+4, s.code, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':1.5, 'text-anchor':'middle', fill:INK});
});

/* ---------- 注释块 + 肘形引线 ---------- */
/* 左列右对齐止于 x=520、右列左对齐起于 x=1400——与中心严格镜像（960±440） */
function block(side, y, code, cn, d1, d2) {
  var isL = side === 'L';
  var x = isL ? 520 : 1400;
  var rx = isL ? 534 : 1386;
  var ta = isL ? 'end' : 'start';
  el('line', {x1:rx, y1:y-58, x2:rx, y2:y+62, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(x, y-45, code, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':ta, fill:INK45});
  txt(x, y-8, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':ta, fill:INK});
  txt(x, y+26, d1, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':ta, fill:INK70});
  txt(x, y+52, d2, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':ta, fill:INK70});
}
function elbow(pts, endX, endY) {
  var d = 'M ' + pts[0][0] + ' ' + pts[0][1];
  for (var i = 1; i < pts.length; i++) d += ' L ' + pts[i][0] + ' ' + pts[i][1];
  el('path', {d:d, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  el('circle', {cx:endX, cy:endY, r:2.2, fill:INK, opacity:.6});
}

/* 左列：内容、活动、社群三类运营能力 */
var L = SAT[0], M = SAT[1], B = SAT[2];
elbow([[L.x-SAT_R, L.y],[570, L.y],[570, 300],[540, 300]], 540, 300);
elbow([[M.x-SAT_R, M.y],[540, 540]], 540, 540);
elbow([[B.x-SAT_R, B.y],[570, B.y],[570, 780],[540, 780]], 540, 780);
block('L', 300, 'MOD 01 · CONTENT',  '内容策划', '主题日历与素材复用', '稳定覆盖重点渠道');
block('L', 540, 'MOD 02 · CAMPAIGN', '活动运营', '节点策划与现场联动', '目标进度实时同步');
block('L', 780, 'MOD 03 · SOCIAL',   '社群运营', '分层触达与话题互动', '核心成员持续活跃');

/* 右列：会员、数据、复盘三类运营能力 */
var RT = SAT[3], RM = SAT[4], RB = SAT[5];
elbow([[RT.x+SAT_R, RT.y],[1350, RT.y],[1350, 300],[1380, 300]], 1380, 300);
elbow([[RM.x+SAT_R, RM.y],[1380, 540]], 1380, 540);
elbow([[RB.x+SAT_R, RB.y],[1350, RB.y],[1350, 780],[1380, 780]], 1380, 780);
block('R', 300, 'MOD 04 · MEMBER', '会员运营', '权益分层与生命周期', '提升留存与持续回访');
block('R', 540, 'MOD 05 · DATA',   '数据分析', '漏斗拆解与人群洞察', '关键变化及时提示');
block('R', 780, 'MOD 06 · REVIEW', '复盘沉淀', '案例留档与方法复用', '下一轮行动可追踪');

stageFit();
</script>
</body>
</html>
