<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-n1" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.convergence.multi-source" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-n1 · 汇聚流</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.convergence.multi-source.sources" data-content-ref="example.n1">
  <div class="doc tl">品牌 · 策划 — N1<br>需求与洞察汇聚成传播策划</div>
  <div class="folio">N1 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#191917" stroke-width="1.4"/>
      </marker>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">需求与洞察在合并点汇聚，形成含主张、内容、渠道、节奏、指标和分工的传播策划。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -75.7)'});


/* ============ 左侧两张源卡 ============ */
var LW = 470, LX = 220;
var HEADER = 104, ROW = 42;

var sources = [
  {
    no:'01', en:'REQUEST STREAM', t:'需求输入', y:280, h:300,
    items:[
      ['业务目标', 'GOAL'],
      ['核心人群', 'AUDIENCE'],
      ['传播场景', 'SCENE'],
      ['约束条件', 'LIMIT']
    ]
  },
  {
    no:'02', en:'INSIGHT POOL', t:'洞察池', y:610, h:300,
    items:[
      ['用户反馈', 'VOICE'],
      ['行业趋势', 'TREND'],
      ['内容表现', 'CONTENT'],
      ['竞品观察', 'BENCH']
    ]
  }
];

sources.forEach(function(c){
  var x = LX, Y = c.y, W = LW, H = c.h;

  /* 序号（构造小字） */
  txt(x, Y-16, c.no, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'rgba(25,25,23,.45)'});
  el('line', {x1:x+26, y1:Y-20, x2:x+90, y2:Y-20, stroke:INK, 'stroke-width':.6, opacity:.3});

  /* 卡体：双线框 */
  el('rect', {x:x, y:Y, width:W, height:H, fill:'none', stroke:INK80, 'stroke-width':1.4});
  el('rect', {x:x+5, y:Y+5, width:W-10, height:H-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});

  /* 卡头 */
  txt(x+32, Y+44, c.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:'rgba(25,25,23,.5)'});
  txt(x+32, Y+88, c.t, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
  el('line', {x1:x+32, y1:Y+HEADER, x2:x+W-32, y2:Y+HEADER, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('line', {x1:x+32, y1:Y+HEADER+4, x2:x+120, y2:Y+HEADER+4, stroke:INK, 'stroke-width':.6, opacity:.25});

  /* 条目：圆点 + 中文 + 右侧 mono 字段码 */
  c.items.forEach(function(it, j){
    var y = Y + HEADER + 42 + j * ROW;
    el('circle', {cx:x+38, cy:y-7, r:3.4, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.8});
    el('circle', {cx:x+38, cy:y-7, r:1.1, fill:INK});
    txt(x+58, y, it[0], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
    txt(x+W-32, y-1, it[1], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
    if (j < c.items.length-1)
      el('line', {x1:x+32, y1:y+16, x2:x+W-32, y2:y+16, stroke:INK, 'stroke-width':.6, opacity:.22});
  });

  /* 卡底刻度脚 */
  for (var t = 0; t <= 8; t++) {
    var tx = x + 32 + t * (W - 64) / 8;
    el('line', {x1:tx, y1:Y+H-20, x2:tx, y2:Y+H-20+(t%4===0?8:5), stroke:INK, 'stroke-width':.6, opacity:.3});
  }
});

/* ============ 汇聚流 ============ */
var MX = 1020, MY = 555;   /* 合并点 */
var RX0 = 1200;            /* 右卡左缘 */

/* 两条贝塞尔细流弯入合并点 */
el('path', {d:'M '+(LX+LW+12)+' 430 C 860 430, 890 '+MY+', '+(MX-14)+' '+MY,
  fill:'none', stroke:INK80, 'stroke-width':1.2});
el('path', {d:'M '+(LX+LW+12)+' 760 C 860 760, 890 '+MY+', '+(MX-14)+' '+MY,
  fill:'none', stroke:INK80, 'stroke-width':1.2});

/* 流标签 */
txt(830, 402, 'REQUESTS', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});
txt(830, 800, 'INSIGHTS', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});

/* 合并点竖向构造虚线 */
el('line', {x1:MX, y1:MY-70, x2:MX, y2:MY+70, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'3 5'});

/* 合并符号：双圈 + 实心核 */
el('circle', {cx:MX, cy:MY, r:11, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('circle', {cx:MX, cy:MY, r:15.5, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
el('circle', {cx:MX, cy:MY, r:2.6, fill:INK});
txt(MX, MY+34, 'MERGE', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});

/* 合并后的粗干线（全页唯一强调线 2.6px） */
el('line', {x1:MX+16, y1:MY, x2:RX0-8, y2:MY, stroke:INK, 'stroke-width':2.6, 'marker-end':'url(#arrow)'});
el('line', {x1:MX+16, y1:MY-6, x2:MX+16, y2:MY+6, stroke:INK, 'stroke-width':.8, opacity:.5});

/* ============ 右侧结果大卡：传播策划 ============ */
var RY = 330, RW = 500, RH = 450;
var RHEADER = 118, RROW = 44;

el('rect', {x:RX0, y:RY, width:RW, height:RH, fill:'none', stroke:INK80, 'stroke-width':1.4});
el('rect', {x:RX0+5, y:RY+5, width:RW-10, height:RH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});

txt(RX0+32, RY+44, 'CAMPAIGN PLAN', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:'rgba(25,25,23,.5)'});
txt(RX0+32, RY+88, '传播策划', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
el('line', {x1:RX0+32, y1:RY+RHEADER, x2:RX0+RW-32, y2:RY+RHEADER, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:RX0+32, y1:RY+RHEADER+4, x2:RX0+120, y2:RY+RHEADER+4, stroke:INK, 'stroke-width':.6, opacity:.25});

var msgs = [
  ['核心主张', 'MESSAGE'],
  ['内容支柱', 'PILLAR'],
  ['渠道组合', 'CHANNEL'],
  ['节奏编排', 'SEQUENCE'],
  ['衡量指标', 'METRIC'],
  ['执行分工', 'OWNER']
];
msgs.forEach(function(it, j){
  var y = RY + RHEADER + 40 + j * RROW;
  el('circle', {cx:RX0+38, cy:y-6, r:3.4, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.8});
  el('circle', {cx:RX0+38, cy:y-6, r:1.1, fill:INK});
  txt(RX0+58, y, it[0], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  txt(RX0+RW-32, y-1, it[1], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'end', fill:'rgba(25,25,23,.5)'});
  if (j < msgs.length-1)
    el('line', {x1:RX0+32, y1:y+15, x2:RX0+RW-32, y2:y+15, stroke:INK, 'stroke-width':.6, opacity:.22});
});

/* 卡底刻度脚 */
for (var t = 0; t <= 8; t++) {
  var tx2 = RX0 + 32 + t * (RW - 64) / 8;
  el('line', {x1:tx2, y1:RY+RH-20, x2:tx2, y2:RY+RH-20+(t%4===0?8:5), stroke:INK, 'stroke-width':.6, opacity:.3});
}

/* 输出箭头：交给执行团队 */
var OY = RY + RH/2;
el('line', {x1:RX0+RW+12, y1:OY, x2:RX0+RW+72, y2:OY, stroke:INK80, 'stroke-width':1.2, 'marker-end':'url(#arrow)'});
el('line', {x1:RX0+RW+12, y1:OY-10, x2:RX0+RW+12, y2:OY+10, stroke:INK, 'stroke-width':.8, opacity:.5});
txt(RX0+RW+44, OY-20, 'TO TEAM', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.45)'});

stageFit();
</script>
</body>
</html>
