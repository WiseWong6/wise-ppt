<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-b5" data-page-role="sequence" data-theme="paper-ink" data-layout="paper-ink.temporal.step-rise" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-b5 · 阶梯爬升路径</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.temporal.step-rise.stages" data-content-ref="example.b5">
  <div class="doc tl">运营 · 培训 — B5<br>运营能力五级进阶</div>
  <div class="folio">B5 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">从明确目标到独立策划，训练营把运营能力拆成五个可练习、可复盘的阶段。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -9.2)'});


/* ---------- 主角：左下→右上的楼梯折线（五级，1.4px） ---------- */
el('path', {d:'M 220 820 H 560 V 690 H 900 V 560 H 1240 V 430 H 1580 V 300 H 1760',
  fill:'none', stroke:INK80, 'stroke-width':1.4});

/* ---------- 平行上升箭头（全页唯一强调线 2.2px，含开放式箭头） ---------- */
el('path', {d:'M 200 862 H 560 V 732 H 900 V 602 H 1240 V 472 H 1580 V 342 H 1740 L 1720 331 M 1740 342 L 1720 353',
  fill:'none', stroke:INK, 'stroke-width':2.2, opacity:.85});

/* ---------- 起点与终点套准 ---------- */
el('circle', {cx:220, cy:820, r:8, fill:'none', stroke:INK80, 'stroke-width':1.1});
el('circle', {cx:220, cy:820, r:2.4, fill:INK});
el('line', {x1:1768, y1:300, x2:1784, y2:300, stroke:INK, 'stroke-width':.8, opacity:.45});
el('line', {x1:1776, y1:292, x2:1776, y2:308, stroke:INK, 'stroke-width':.8, opacity:.45});

/* ---------- 踏步节点块（级别 + 事件 + 一行注，挂台阶侧边） ---------- */
var steps = [
  {x:250,  lx:286,  tread:820, ty:700, level:'LEVEL 01', ev:'明确目标', note:'知道为谁服务、要解决什么'},
  {x:590,  lx:626,  tread:690, ty:570, level:'LEVEL 02', ev:'拆解任务', note:'把目标拆成内容、渠道与节奏'},
  {x:930,  lx:966,  tread:560, ty:440, level:'LEVEL 03', ev:'执行活动', note:'按清单推进，及时同步进度'},
  {x:1270, lx:1306, tread:430, ty:310, level:'LEVEL 04', ev:'复盘数据', note:'找到有效动作与下次改进'},
  {x:1540, lx:1644, tread:300, ty:186, level:'LEVEL 05', ev:'独立策划', note:'独立完成一份运营方案'}
];
steps.forEach(function(s, i){
  var top = (i === steps.length - 1);
  /* 踏步落点 + 短引线 */
  el('circle', {cx:s.lx, cy:s.tread, r:5, fill:'#DFE0D9', stroke: top && ACCENT ? RED : INK80, 'stroke-width':1});
  el('circle', {cx:s.lx, cy:s.tread, r:1.8, fill: top && ACCENT ? RED : INK});
  el('line', {x1:s.lx, y1:s.tread-6, x2:s.lx, y2:s.ty+92, stroke:INK, 'stroke-width':.7, opacity:.45});
  /* 文字块 */
  txt(s.x, s.ty, s.level, {'font-family':MONO, 'font-size':'var(--type-body)', 'letter-spacing':2, fill: top && ACCENT ? RED : INK});
  el('line', {x1:s.x, y1:s.ty+12, x2:s.x+92, y2:s.ty+12, stroke:INK, 'stroke-width':.6, opacity:.3});
  txt(s.x, s.ty+44, s.ev, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill: top && ACCENT ? RED : INK});
  txt(s.x, s.ty+72, s.note, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill: top && ACCENT ? RED : INK70});
});

/* ---------- 右下空白区：竖向高度标注（构造件） ---------- */
el('line', {x1:1830, y1:340, x2:1830, y2:820, stroke:INK, 'stroke-width':.5, opacity:.3, 'stroke-dasharray':'2 6'});
el('line', {x1:1822, y1:340, x2:1838, y2:340, stroke:INK, 'stroke-width':.7, opacity:.4});
el('line', {x1:1822, y1:820, x2:1838, y2:820, stroke:INK, 'stroke-width':.7, opacity:.4});
el('text', {x:1807, y:586, 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45,
  transform:'rotate(90 1807 586)'}).textContent = 'ABILITY · LEVEL × 5';

stageFit();
</script>
</body>
</html>
