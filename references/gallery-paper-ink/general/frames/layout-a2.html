<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-a2" data-page-role="hook" data-theme="paper-ink" data-layout="paper-ink.evidence.scenario-illustration" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-a2 · 场景画</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }

  .say { position: absolute; z-index: 3; }
  .say .who {
    font-family: var(--mono); font-size: var(--type-meta); letter-spacing: .25em;
    color: var(--ink-45); margin-bottom: var(--space-3);
  }
  .say .bubble {
    border: 1px solid rgba(25,25,23,.38);
    background: rgba(255,255,255,.22);
    padding: var(--space-5) 28px;
    box-shadow: var(--shadow-soft);
    font-family: var(--sans); font-weight: 300;
    font-size: var(--type-subheading); line-height: 1.6;
  }
  .say .bubble b { font-weight: 400; }

  .caption {
    position: absolute; left: 0; right: 0; bottom: 108px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.evidence.scenario-illustration.scene" data-content-ref="example.a2">
  <div class="doc tl">运营 · 活动 — A2<br>快闪店现场动线</div>
  <div class="folio">A2 / 63 — BY @歪斯WISE</div>

  <div class="say" style="left:170px; top: 157.8px; width:520px;">
    <div class="who">活动运营 · 现场提问</div>
    <div class="bubble">开场高峰，两组顾客在窄通道交汇，<br><b>会不会堵住</b>？</div>
  </div>

  <div class="say" style="right:142px; top: 157.8px; width:470px;">
    <div class="who">现场动线方案 · 应答</div>
    <div class="bubble">该段已设<b>单行时窗</b><br>——A 区让行 40 秒，B 区先行。</div>
  </div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#191917" stroke-width="0.8" opacity="0.45"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">快闪店从排队、入场到打卡连续承接，高峰集中在开场前三分钟。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'rgba(25,25,23,.82)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -10.2)'});
var GY = 740, LW = 1.3;

/* ============ 地面 ============ */
el('line', {x1:150, y1:GY, x2:1770, y2:GY, stroke:INK, 'stroke-width':1.5});
for (var gx = 180; gx < 1760; gx += 42) {
  el('line', {x1:gx, y1:GY, x2:gx-13, y2:GY+11, stroke:INK, 'stroke-width':1, opacity:.3});
}

/* ============ 快闪店入口（左端） ============ */
(function(){
  var x = 200, y = GY, w = 240, h = 210;
  el('rect', {x:x, y:y-h, width:w, height:h, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':LW});
  /* 雨棚（剖面线斜挑） */
  el('path', {d:'M '+(x-18)+' '+(y-h)+' L '+(x+w+18)+' '+(y-h)+' L '+(x+w+40)+' '+(y-h-46)+' L '+(x+4)+' '+(y-h-46)+' Z',
    fill:'url(#hatch)', stroke:INK, 'stroke-width':LW, 'stroke-linejoin':'round'});
  /* 月台门（双竖线 + 横档） */
  el('rect', {x:x+30, y:y-150, width:96, height:150, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('line', {x1:x+78, y1:y-150, x2:x+78, y2:y, stroke:INK, 'stroke-width':1.1, opacity:.7});
  el('line', {x1:x+30, y1:y-100, x2:x+126, y2:y-100, stroke:INK, 'stroke-width':1, opacity:.5});
  /* 门店招牌 */
  txt(x+178, y-96, '快闪店', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', 'letter-spacing':4, 'text-anchor':'middle', fill:INK});
  el('line', {x1:x+140, y1:y-80, x2:x+216, y2:y-80, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(x+w/2, y-h-62, 'POP-UP 07', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':4, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
  /* 底部剖面影 */
  el('path', {d:'M '+x+' '+(y+8)+' L '+(x+w)+' '+(y+8)+' L '+(x+w-14)+' '+(y+18)+' L '+(x-14)+' '+(y+18)+' Z', fill:'url(#hatch)'});
})();

/* ============ 场控人员（手持终端） ============ */
(function(){
  var x = 640, y = GY;
  el('circle', {cx:x, cy:y-118, r:15, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.4});
  el('path', {d:'M '+x+' '+(y-102)+' Q '+(x+4)+' '+(y-70)+' '+(x+2)+' '+(y-44), fill:'none', stroke:INK, 'stroke-width':1.6, 'stroke-linecap':'round'});
  /* 手臂前伸持终端 */
  el('path', {d:'M '+(x+2)+' '+(y-88)+' Q '+(x+26)+' '+(y-80)+' '+(x+34)+' '+(y-72), fill:'none', stroke:INK, 'stroke-width':1.8, 'stroke-linecap':'round'});
  el('rect', {x:x+30, y:y-86, width:22, height:16, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.1});
  /* 腿（立正微分） */
  el('path', {d:'M '+(x+2)+' '+(y-44)+' Q '+(x+14)+' '+(y-22)+' '+(x+18)+' '+y, fill:'none', stroke:INK, 'stroke-width':1.6, 'stroke-linecap':'round'});
  el('path', {d:'M '+(x+2)+' '+(y-44)+' Q '+(x-10)+' '+(y-22)+' '+(x-14)+' '+y, fill:'none', stroke:INK, 'stroke-width':1.6, 'stroke-linecap':'round'});
  txt(x, y+40, 'FLOOR STAFF', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
})();

/* ============ 排队隔离带 A-1 ============ */
(function(){
  var x = 830, y = GY, w = 180;
  /* 两根立柱、织带与方向牌 */
  [x+34, x+w-34].forEach(function(px){
    el('line', {x1:px, y1:y-110, x2:px, y2:y-8, stroke:INK, 'stroke-width':1.8});
    el('circle', {cx:px, cy:y-116, r:7, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.2});
    el('line', {x1:px-18, y1:y-8, x2:px+18, y2:y-8, stroke:INK, 'stroke-width':1.4});
  });
  el('path', {d:'M '+(x+34)+' '+(y-92)+' Q '+(x+w/2)+' '+(y-68)+' '+(x+w-34)+' '+(y-92), fill:'none', stroke:INK, 'stroke-width':2});
  el('rect', {x:x+58, y:y-152, width:64, height:36, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.2});
  el('path', {d:'M '+(x+74)+' '+(y-134)+' L '+(x+106)+' '+(y-134)+' M '+(x+99)+' '+(y-141)+' L '+(x+106)+' '+(y-134)+' L '+(x+99)+' '+(y-127), fill:'none', stroke:INK, 'stroke-width':1.2});
  txt(x+w/2, y-172, 'QUEUE · A-1', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
  /* 手写场控提示 */
  txt(x+w/2-10, y-202, 'A 区：你先走。', {id:'accent-dialogue', 'data-accent-group':'narrative-focus', 'font-family':'var(--brush)', 'font-size':'var(--type-emphasis)', fill:ACCENT ? RED : INK, transform:'rotate(-3 '+(x+w/2)+' '+(y-202)+')'});
})();

/* ============ 拍照背景墙 B-12 ============ */
(function(){
  var x = 1130, y = GY, w = 330, h = 300;
  /* 统一主视觉板、拍照圆环与落地签名区 */
  el('rect', {x:x, y:y-h, width:w, height:h, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.4});
  el('rect', {x:x+12, y:y-h+12, width:w-24, height:h-24, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.35});
  el('circle', {cx:x+w/2, cy:y-168, r:76, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('circle', {cx:x+w/2, cy:y-168, r:54, fill:'url(#hatch)', stroke:INK, 'stroke-width':.8});
  el('path', {d:'M '+(x+54)+' '+(y-58)+' Q '+(x+w/2)+' '+(y-94)+' '+(x+w-54)+' '+(y-58), fill:'none', stroke:INK, 'stroke-width':1.1});
  el('line', {x1:x+58, y1:y-40, x2:x+w-58, y2:y-40, stroke:INK, 'stroke-width':.8, opacity:.55});
  txt(x+w/2, y-h-26, 'PHOTO WALL · B-12', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
})();

/* ============ 签到亭 B-3 ============ */
(function(){
  var x = 1540, y = GY, w = 150;
  /* 竖屏、扫码区与稳固底座 */
  el('rect', {x:x+18, y:y-230, width:w-36, height:148, rx:10, fill:'rgba(255,255,255,.22)', stroke:INK, 'stroke-width':1.4});
  el('rect', {x:x+32, y:y-214, width:w-64, height:72, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.7});
  el('circle', {cx:x+w/2, cy:y-116, r:12, fill:'none', stroke:INK, 'stroke-width':1.1});
  el('path', {d:'M '+(x+w/2-6)+' '+(y-116)+' L '+(x+w/2-1)+' '+(y-111)+' L '+(x+w/2+8)+' '+(y-122), fill:'none', stroke:INK, 'stroke-width':1.2});
  el('path', {d:'M '+(x+54)+' '+(y-82)+' L '+(x+44)+' '+(y-18)+' L '+(x+w-44)+' '+(y-18)+' L '+(x+w-54)+' '+(y-82)+' Z', fill:'none', stroke:INK, 'stroke-width':1.3});
  el('line', {x1:x+24, y1:y-8, x2:x+w-24, y2:y-8, stroke:INK, 'stroke-width':1.5});
  txt(x+w/2, y-272, 'CHECK-IN · B-3', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});
})();

/* ============ 12 m 窄通道段尺寸标注 ============ */
(function(){
  var y = GY + 76, x1 = 1010, x2 = 1540;
  el('line', {x1:x1, y1:y, x2:x2, y2:y, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x1, y1:y-10, x2:x1, y2:y+10, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x2, y1:y-10, x2:x2, y2:y+10, stroke:INK, 'stroke-width':1.6});
  el('line', {x1:x1, y1:y, x2:x1, y2:GY+4, stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'2 4', opacity:.5});
  el('line', {x1:x2, y1:y, x2:x2, y2:GY+4, stroke:INK, 'stroke-width':.8, 'stroke-dasharray':'2 4', opacity:.5});
  txt((x1+x2)/2, y+40, '12 m', {'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:INK});
  txt((x1+x2)/2, y-16, 'ONE-WAY WINDOW', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:'rgba(25,25,23,.5)'});
})();

stageFit();
</script>
</body>
</html>
