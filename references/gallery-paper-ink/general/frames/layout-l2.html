<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-l2" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.mapping.constellation-network" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-l2 · 星座映射网</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.mapping.constellation-network.mapping-network" data-content-ref="example.l2">
  <div class="doc tl">产品 · 培训 — L2<br>能力到功能映射课</div>
  <div class="folio">L2 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">洞察、规则、数据、内容、协作与反馈共同支撑六项产品功能，映射关系并非一对一。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -34.7)'});


/* ---------- 星座映射网：左侧产品能力 → 右侧大众应用功能 ---------- */
var AX = 360;    /* 原子节点 x */
var MX = 1380;   /* 功能落点 x */
var atoms = [
  {en:'INSIGHT',  cn:'用户洞察',   y:300},
  {en:'RULE',     cn:'业务规则',   y:396},
  {en:'DATA',     cn:'数据资产',   y:492},
  {en:'CONTENT',  cn:'内容素材',   y:588},
  {en:'COLLAB',   cn:'协作机制',   y:684},
  {en:'FEEDBACK', cn:'用户反馈',   y:780}
];
var feats = [
  {en:'PROFILE',    cn:'用户画像 / 人群分层', y:290},
  {en:'RECOMMEND',  cn:'智能推荐 / 场景匹配', y:386},
  {en:'WORKFLOW',   cn:'流程编排 / 任务协作', y:482},
  {en:'DASHBOARD',  cn:'经营看板 / 指标追踪', y:578},
  {en:'EXPERIMENT', cn:'实验配置 / 效果验证', y:674},
  {en:'ASSIST',     cn:'商业助手 / 策略建议', y:770}
];

/* 列头 */
txt(AX-8, 246, 'CAPABILITY', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'end', fill:INK45});
el('line', {x1:AX-168, y1:258, x2:AX-8, y2:258, stroke:INK, 'stroke-width':.6, opacity:.3});
txt(MX+24, 246, 'FEATURE', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:INK45});
el('line', {x1:MX+24, y1:258, x2:MX+150, y2:258, stroke:INK, 'stroke-width':.6, opacity:.3});

/* 竖向虚线构造基线（作图痕迹） */
el('line', {x1:AX, y1:270, x2:AX, y2:810, stroke:INK, 'stroke-width':.5, opacity:.2, 'stroke-dasharray':'2 6'});
el('line', {x1:MX, y1:270, x2:MX, y2:810, stroke:INK, 'stroke-width':.5, opacity:.2, 'stroke-dasharray':'2 6'});

/* 权重三档：主依赖 1.8px@.9 / 次依赖 1.1px@.4 / 弱关联 0.6px@.2 */
var W = {sig:{'stroke-width':1.8, opacity:.9}, mid:{'stroke-width':1.1, opacity:.4}, weak:{'stroke-width':.6, opacity:.2}};
function arc(x1, y1, x2, y2, w) {
  var cx = (x1 + x2) / 2;
  el('path', {d:'M '+x1+' '+y1+' C '+cx+' '+y1+', '+cx+' '+y2+', '+x2+' '+y2,
    fill:'none', stroke:INK, 'stroke-width':w['stroke-width'], opacity:w.opacity});
  el('circle', {cx:x2, cy:y2, r:2.4, fill:INK, opacity:.6});
}
function A(en){ return atoms.filter(function(a){return a.en===en;})[0]; }
function M(en){ return feats.filter(function(m){return m.en===en;})[0]; }
function link(a, m, w){ arc(AX+8, A(a).y, MX-8, M(m).y, w); }

/* PROFILE    ← INSIGHT(sig) + DATA(mid) */
link('INSIGHT','PROFILE', W.sig);
link('DATA','PROFILE', W.mid);
/* RECOMMEND  ← RULE(sig) + FEEDBACK(mid) + INSIGHT(weak) */
link('RULE','RECOMMEND', W.sig);
link('FEEDBACK','RECOMMEND', W.mid);
link('INSIGHT','RECOMMEND', W.weak);
/* WORKFLOW   ← COLLAB(sig) + RULE(mid) */
link('COLLAB','WORKFLOW', W.sig);
link('RULE','WORKFLOW', W.mid);
/* DASHBOARD  ← DATA(sig) + FEEDBACK(mid) + CONTENT(weak) */
link('DATA','DASHBOARD', W.sig);
link('FEEDBACK','DASHBOARD', W.mid);
link('CONTENT','DASHBOARD', W.weak);
/* EXPERIMENT ← INSIGHT(sig) + DATA(mid) + FEEDBACK(weak) */
link('INSIGHT','EXPERIMENT', W.sig);
link('DATA','EXPERIMENT', W.mid);
link('FEEDBACK','EXPERIMENT', W.weak);
/* ASSIST     ← CONTENT(mid) + COLLAB(mid) */
link('CONTENT','ASSIST', W.mid);
link('COLLAB','ASSIST', W.mid);

/* 原子节点（小方块标本钉 + mono 名 + 中文注） */
atoms.forEach(function(a){
  el('rect', {x:AX-5, y:a.y-5, width:10, height:10, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:AX, cy:a.y, r:1.6, fill:INK});
  txt(AX-18, a.y+2, a.en, {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':1.5, 'text-anchor':'end', fill:INK});
  txt(AX-18, a.y+22, a.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'end', fill:INK45});
});

/* 功能落点（双圈 + 中文 400 + mono EN） */
feats.forEach(function(m){
  el('circle', {cx:MX, cy:m.y, r:7, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:MX, cy:m.y, r:2.4, fill:INK});
  txt(MX+24, m.y+2, m.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  txt(MX+24, m.y+28, m.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK45});
});

/* 权重图例（右下，贴边缘微型 mono 档案字） */
var LX = 1380, LY = 836;
el('line', {x1:LX, y1:LY, x2:LX+52, y2:LY, stroke:INK, 'stroke-width':1.8, opacity:.9});
txt(LX+64, LY+5, 'PRIMARY', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});
el('line', {x1:LX+170, y1:LY, x2:LX+222, y2:LY, stroke:INK, 'stroke-width':1.1, opacity:.4});
txt(LX+234, LY+5, 'SHARED', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});

stageFit();
</script>
</body>
</html>
