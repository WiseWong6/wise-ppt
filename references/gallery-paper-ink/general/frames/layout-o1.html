<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-o1" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.funnel.conversion" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-o1 · 漏斗（连续收敛）</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: rgba(25,25,23,.45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.funnel.conversion.funnel-stages" data-content-ref="example.o1">
  <div class="doc tl">运营 · 汇报 — O1<br>活动转化漏斗</div>
  <div class="folio">O1 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">120 万触达经过报名与到场两轮筛选，最终沉淀 9600 名参与者，转化瓶颈逐层显现。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -37.7)'});


/* ---------- 连续漏斗：一个大倒三角，两侧边一路收为塔尖 ---------- */
var topY = 240, botY = 770;          /* 漏斗顶 / 塔尖（收为点） */
var cX = 660;                        /* 漏斗中轴 */
var topW = 720;                      /* 顶宽 */
function wAt(y) { return topW * (botY - y) / (botY - topY); }

/* 外轮廓：顶线 + 两条连续侧边 */
el('line', {x1:cX-topW/2, y1:topY, x2:cX+topW/2, y2:topY, stroke:INK80, 'stroke-width':1.4});
el('line', {x1:cX-topW/2, y1:topY, x2:cX, y2:botY, stroke:INK80, 'stroke-width':1.4});
el('line', {x1:cX+topW/2, y1:topY, x2:cX, y2:botY, stroke:INK80, 'stroke-width':1.4});

/* 两条横向分隔线切出三层 */
[440, 600].forEach(function(sy){
  var w = wAt(sy);
  el('line', {x1:cX-w/2, y1:sy, x2:cX+w/2, y2:sy, stroke:INK, 'stroke-width':.9, opacity:.55});
});

/* 顶部刻度尺 */
for (var i = 0; i <= 20; i++) {
  var tx = cX - topW/2 + i * (topW/20);
  el('line', {x1:tx, y1:topY, x2:tx, y2:topY - (i%5===0?12:6), stroke:INK, 'stroke-width':.6, opacity:.35});
}

var layers = [
  {y0:topY, y1:440, n:'≈ 120万', tag:'REACH',        t:'触达', en:'AWARE',
   notes:['公众号推送','社群邀约','合作渠道','线下海报']},
  {y0:440,  y1:600, n:'≈ 8.6万', tag:'REGISTRATION', t:'报名', en:'SIGN-UP',
   notes:['主题吸引','表单简化','权益说明','好友转发']},
  {y0:600,  y1:740, n:'≈ 9,600', tag:'CHECK-IN',     t:'到场', en:'ATTEND',
   notes:['会前提醒','路线指引','扫码签到','现场接待']}
];

layers.forEach(function(L, i){
  var last = (i === layers.length - 1);   /* 最底层=到场=漏斗出口=活动结果 */
  var inkLayer = (ACCENT && last) ? RED : INK;
  var midY = (L.y0 + L.y1)/2;
  /* 层名 */
  txt(cX, midY-4, L.t, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:inkLayer});
  txt(cX, midY+26, L.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:(ACCENT && last ? 'var(--accent-red-65)' : INK45)});
  /* 左侧：虚线引出 mono 数量 */
  var lw = wAt(midY);
  el('line', {x1:cX-lw/2-16, y1:midY, x2:cX-lw/2-70, y2:midY, stroke:inkLayer, 'stroke-width':.6, 'stroke-dasharray':'3 4', opacity:.5});
  txt(cX-lw/2-86, midY-4, L.n, {'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'end', fill:inkLayer});
  txt(cX-lw/2-86, midY+22, L.tag, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'end', fill:(ACCENT && last ? 'var(--accent-red-65)' : INK45)});
  /* 右侧：实线引出字段注记 */
  el('line', {x1:cX+lw/2+16, y1:midY, x2:cX+lw/2+70, y2:midY, stroke:INK, 'stroke-width':.6, opacity:.5});
  L.notes.forEach(function(n, j){
    txt(cX+lw/2+86, midY - 45 + j*30, n, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:'rgba(25,25,23,.7)'});
  });
});

/* 底部收口：塔尖墨点 → 双线小框（出口） */
el('line', {x1:cX, y1:botY, x2:cX, y2:botY+30, stroke:INK, 'stroke-width':1.2});
el('circle', {cx:cX, cy:botY+38, r:3.5, fill:INK});
el('rect', {x:cX-70, y:botY+46, width:140, height:44, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('rect', {x:cX-66, y:botY+50, width:132, height:36, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
txt(cX, botY+74, 'TO ATTEND', {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});

/* ---------- 右侧规格单：活动到场渠道（标本面板） ---------- */
(function(){
  var x = 1380, y = 330, w = 400;
  el('rect', {x:x, y:y, width:w, height:330, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:x+5, y:y+5, width:w-10, height:320, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(x+26, y+42, 'TOP CHANNELS', {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':2, fill:INK});
  el('line', {x1:x+26, y1:y+56, x2:x+90, y2:y+56, stroke:INK, 'stroke-width':1});
  txt(x+26, y+88, '活动当日 · 到场 9600 人', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:'rgba(25,25,23,.55)'});
  var rows = [
    ['SRC #08172', '公众号', '2,899'],
    ['SRC #08168', '社群',   '1,580'],
    ['SRC #08155', '合作方', '2,200'],
    ['SRC #08141', '线下',   '  799'],
    ['SRC #08127', '短视频', '2,122']
  ];
  rows.forEach(function(r, i){
    var ry = y + 128 + i * 38;
    txt(x+26, ry, r[0], {'font-family':MONO, 'font-size':'var(--type-body-small)', fill:INK});
    txt(x+w-120, ry, r[1], {'font-family':MONO, 'font-size':'var(--type-body-small)', 'text-anchor':'end', fill:'rgba(25,25,23,.7)'});
    txt(x+w-26, ry, r[2], {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'end', fill:INK45});
    if (i < rows.length-1) el('line', {x1:x+26, y1:ry+14, x2:x+w-26, y2:ry+14, stroke:INK, 'stroke-width':.5, 'stroke-dasharray':'2 5', opacity:.25});
  });
})();

stageFit();
</script>
</body>
</html>
