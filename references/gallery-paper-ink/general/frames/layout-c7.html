<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-c7" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.data.ranked-specimen-bars" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-c7 · 样本排行柱图</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.data.ranked-specimen-bars.ranking" data-content-ref="example.c7">
  <div class="doc tl">品牌 · 汇报 — C7<br>渠道内容排行榜</div>
  <div class="folio">C7 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch30" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width=".7" opacity=".35"/>
      </pattern>
      <pattern id="hatch30red" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--accent-red)" stroke-width="1" opacity=".5"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">头部渠道与长尾贡献差距显著，第一名的内容表现需要拆解增长来源。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -24.2)'});


/* ---------- 数据（虚构品牌渠道内容样张） ---------- */
var rows = [
  {name:'品牌公众号', code:'CHANNEL-01', v:428, bot:'round'},
  {name:'短视频主号', code:'CHANNEL-02', v:391, bot:'cap'},
  {name:'生活方式社区',code:'CHANNEL-03', v:355, bot:'glasses'},
  {name:'行业媒体',   code:'CHANNEL-04', v:298},
  {name:'线下门店',   code:'CHANNEL-05', v:264},
  {name:'伙伴联名号', code:'CHANNEL-06', v:227},
  {name:'企业视频号', code:'CHANNEL-07', v:196},
  {name:'邮件通讯',   code:'CHANNEL-08', v:168}
];
var BASE = 820, X0 = 200, X1 = 1720, SC = 1.08, BW = 64;

/* ---------- 左侧数值轴 + 横向构造栅格 ---------- */
[0,100,200,300,400].forEach(function(v){
  var y = BASE - v*SC;
  if (v > 0) el('line', {x1:X0, y1:y, x2:X1, y2:y, stroke:INK, 'stroke-width':.5, opacity:.12, 'stroke-dasharray':'2 6'});
  el('line', {x1:X0-8, y1:y, x2:X0, y2:y, stroke:INK, 'stroke-width':.9, opacity:.6});
  txt(X0-16, y+4, String(v), {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'end', fill:INK45});
});
el('line', {x1:X0, y1:300, x2:X0, y2:BASE, stroke:INK, 'stroke-width':1, opacity:.6});
txt(X0-16, 290, '万 阅读 · K VIEWS', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'end', fill:INK45});

/* ---------- 底部共享基线尺 ---------- */
el('line', {x1:X0, y1:BASE, x2:X1, y2:BASE, stroke:INK80, 'stroke-width':1.2});
rows.forEach(function(r, i){
  var cx = 300 + i*190;
  el('line', {x1:cx, y1:BASE, x2:cx, y2:BASE+10, stroke:INK, 'stroke-width':1, opacity:.7});
  if (i < rows.length-1)
    el('line', {x1:cx+95, y1:BASE, x2:cx+95, y2:BASE+6, stroke:INK, 'stroke-width':.5, opacity:.4});
});

/* ---------- 降序线稿柱 ---------- */
/* 主角判定：Top1（品牌公众号 428）是榜单焦点 → 柱体描边 + 柱顶数值 + 内部 hatch 斜线全部跟随染色 */
rows.forEach(function(r, i){
  var cx = 300 + i*190;
  var h = r.v*SC, y = BASE - h;
  var top = ACCENT && i === 0;
  el('rect', {x:cx-BW/2, y:y, width:BW, height:h,
    fill: (i===0 && top) ? 'url(#hatch30red)' : (i===0 ? 'url(#hatch30)' : 'none'),
    stroke: top ? RED : INK80, 'stroke-width': i===0 ? 1.4 : 1.2});
  txt(cx, y-14, String(r.v), {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':1, 'text-anchor':'middle', fill: top ? RED : INK});
  txt(cx, BASE+34, r.name, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':'middle', fill:INK});
  txt(cx, BASE+56, r.code, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
});

/* ---------- Top3 垂挂标本缩略框（微场景：三种头像线稿） ---------- */
function drawAvatar(bx, by, kind) {
  var S = {stroke:INK80, 'stroke-width':1.1, fill:'none'};
  if (kind === 'round') {         /* 圆脸头像：圆头 + 肩膀弧 */
    el('circle', Object.assign({cx:bx, cy:by-14, r:14}, S));
    el('path', Object.assign({d:'M '+(bx-22)+' '+(by+14)+' Q '+bx+' '+(by-6)+' '+(bx+22)+' '+(by+14)}, S));
  } else if (kind === 'cap') {    /* 戴帽头像：帽檐 + 圆脸 */
    el('ellipse', Object.assign({cx:bx, cy:by-10, rx:13, ry:14}, S));
    el('line', Object.assign({x1:bx-18, y1:by-18, x2:bx+18, y2:by-18}, S));
    el('path', Object.assign({d:'M '+(bx-20)+' '+(by+14)+' Q '+bx+' '+(by-2)+' '+(bx+20)+' '+(by+14)}, S));
  } else {                        /* 方框眼镜头像：圆脸 + 眼镜框 */
    el('circle', Object.assign({cx:bx, cy:by-14, r:14}, S));
    el('rect', Object.assign({x:bx-12, y:by-18, width:10, height:7}, S));
    el('rect', Object.assign({x:bx+2, y:by-18, width:10, height:7}, S));
    el('line', Object.assign({x1:bx-2, y1:by-15, x2:bx+2, y2:by-15}, S));
    el('path', Object.assign({d:'M '+(bx-22)+' '+(by+14)+' Q '+bx+' '+(by-6)+' '+(bx+22)+' '+(by+14)}, S));
  }
}

var FW = 212, FH = 118, FY = 180;
rows.slice(0,3).forEach(function(r, i){
  var cx = 300 + i*190, fx = cx - FW/2;
  /* 垂挂虚线：终点收在柱顶数值上方（数值 bbox 顶 ≈ 柱顶-27），过短则不画 */
  var ly2 = BASE - r.v*SC - 40;
  if (ly2 - (FY+FH) >= 8)
    el('line', {x1:cx, y1:FY+FH, x2:cx, y2:ly2, stroke:INK, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  el('circle', {cx:cx, cy:FY+FH+5, r:2.2, fill:INK, opacity:.6});
  /* 双线框 */
  el('rect', {x:fx, y:FY, width:FW, height:FH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:fx+5, y:FY+5, width:FW-10, height:FH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  /* 排名徽章 + 领域标签 */
  txt(fx+14, FY+24, '0'+(i+1), {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK});
  txt(fx+FW-14, FY+24, ['OWNED','VIDEO','SOCIAL'][i] || 'CHANNEL', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':1, 'text-anchor':'end', fill:INK45});
  drawAvatar(cx, FY+64, r.bot);
  txt(cx, FY+FH-19, 'SAMPLE · '+r.code, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'middle', fill:INK45});
});

stageFit();
</script>
</body>
</html>
