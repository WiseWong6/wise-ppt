<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-general-g2" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.radial.annotated-hero" data-layout-source="gallery">

<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;

<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.radial.annotated-hero.hero" data-content-ref="example.g2">
  <div class="doc tl">品牌 · 活动 — G2<br>品牌快闪主装置全解</div>
  <div class="folio">G2 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch28" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#191917" stroke-width=".7" opacity=".28"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">主视觉门楣、入场识别、互动体验、媒体内容、核心信息与氛围灯光，共同组成快闪主装置。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -18.7)'});


/* ---------- 构造基准：十字虚线 + 地面线 ---------- */
el('line', {x1:620, y1:560, x2:1300, y2:560, stroke:INK, 'stroke-width':.5, opacity:.18, 'stroke-dasharray':'2 6'});
el('line', {x1:960, y1:230, x2:960, y2:330, stroke:INK, 'stroke-width':.5, opacity:.18, 'stroke-dasharray':'2 6'});
el('line', {x1:680, y1:816, x2:1240, y2:816, stroke:INK, 'stroke-width':1, opacity:.55});
el('line', {x1:680, y1:810, x2:680, y2:822, stroke:INK, 'stroke-width':.8, opacity:.55});
el('line', {x1:1240, y1:810, x2:1240, y2:822, stroke:INK, 'stroke-width':.8, opacity:.55});

/* ---------- 主角：品牌快闪主装置（正视，门楣 + 展台 + 内容屏） ---------- */
/* 主展台 */
el('rect', {x:740, y:616, width:440, height:150, rx:2, fill:'none', stroke:INK80, 'stroke-width':1.3});
/* 展台下沿 hatch 材质带 */
el('path', {d:'M 756 726 L 1164 726 L 1164 750 Q 1164 766 1148 766 L 772 766 Q 756 766 756 750 Z',
  fill:'url(#hatch28)', stroke:'none'});
el('line', {x1:756, y1:726, x2:1164, y2:726, stroke:INK, 'stroke-width':.6, opacity:.35});
/* 互动台面（内部虚线格） */
el('rect', {x:840, y:626, width:240, height:90, fill:'none', stroke:INK, 'stroke-width':.8, opacity:.6, 'stroke-dasharray':'5 4'});
el('line', {x1:1080, y1:652, x2:1096, y2:652, stroke:INK, 'stroke-width':.9, opacity:.7});
el('line', {x1:1080, y1:690, x2:1096, y2:690, stroke:INK, 'stroke-width':.9, opacity:.7});
/* 双互动触点（同处台面内部，避免形成交通工具轮廓） */
[888, 1032].forEach(function(wx){
  el('circle', {cx:wx, cy:676, r:24, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.3});
  el('circle', {cx:wx, cy:676, r:8, fill:'none', stroke:INK, 'stroke-width':.8, opacity:.6});
  el('circle', {cx:wx, cy:676, r:2.4, fill:INK});
});
/* 入场识别门：双立柱 + 顶部横梁 */
el('line', {x1:790, y1:616, x2:790, y2:336, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:1130, y1:616, x2:1130, y2:336, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:790, y1:336, x2:1130, y2:336, stroke:INK80, 'stroke-width':1.3});
for (var by = 370; by <= 590; by += 55) {
  el('line', {x1:890, y1:by, x2:1030, y2:by, stroke:INK, 'stroke-width':.6, opacity:.4});
}
/* 核心信息牌 + 活动标语分隔线 */
el('rect', {x:880, y:390, width:160, height:72, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.1});
el('line', {x1:960, y1:462, x2:960, y2:480, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:900, y1:480, x2:1020, y2:480, stroke:INK80, 'stroke-width':1.3});
/* 顶部品牌标识：拱形外轮廓 + 中心识别点 */
el('rect', {x:900, y:290, width:120, height:46, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('path', {d:'M 900 290 Q 960 250 1020 290', fill:'none', stroke:INK80, 'stroke-width':1.3});
el('circle', {cx:960, cy:300, r:2, fill:INK});
el('path', {d:'M 920 274 Q 960 240 1000 274', fill:'none', stroke:INK, 'stroke-width':.7, opacity:.45});
el('path', {d:'M 930 282 Q 960 256 990 282', fill:'none', stroke:INK, 'stroke-width':.7, opacity:.45});
/* 右侧媒体内容屏 */
el('rect', {x:1070, y:390, width:100, height:150, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.1});
el('circle', {cx:1120, cy:412, r:5.5, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.75});
/* 氛围灯光带（右侧双弧） */
el('path', {d:'M 1092 554 Q 1120 526 1148 554', fill:'none', stroke:INK80, 'stroke-width':1.2});
el('path', {d:'M 1080 568 Q 1120 520 1160 568', fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'3 4'});

/* ---------- 标注锚点与注释块 ---------- */
/* 锚点：双圈 */
function anchor(x, y) {
  el('circle', {cx:x, cy:y, r:5, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:x, cy:y, r:1.6, fill:INK});
}
/* 注释块：竖节线 + 三行文字（左列右对齐止于 x=490、右列左对齐起于 x=1430——与中心严格镜像 960±470） */
function block(side, y, code, cn, spec) {
  var isL = side === 'L';
  var x = isL ? 490 : 1430;
  var rx = isL ? 504 : 1416;
  var ta = isL ? 'end' : 'start';
  el('line', {x1:rx, y1:y-42, x2:rx, y2:y+50, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(x, y-24, code, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':ta, fill:INK45});
  txt(x, y+8, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':ta, fill:INK});
  txt(x, y+40, spec, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':1.5, 'text-anchor':ta, fill:INK45});
}
/* 肘形引线：锚点 → 水平 → 竖直 → 水平入块（端点小圆） */
function elbow(pts, endX, endY) {
  var d = 'M ' + pts[0][0] + ' ' + pts[0][1];
  for (var i = 1; i < pts.length; i++) d += ' L ' + pts[i][0] + ' ' + pts[i][1];
  el('path', {d:d, fill:'none', stroke:INK, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  el('circle', {cx:endX, cy:endY, r:2.2, fill:INK, opacity:.6});
}

/* 左列（上→下）：主视觉门楣 / 入场识别 / 互动体验 */
anchor(960, 274);  elbow([[960,274],[960,266],[500,266]], 500, 266);
anchor(790, 430);  elbow([[790,430],[600,430],[600,486],[500,486]], 500, 486);
anchor(888, 676);  elbow([[888,676],[640,676],[640,706],[500,706]], 500, 706);
block('L', 270, 'PART 01 · KEY VISUAL', '主视觉门楣',  'LOGO · CAMPAIGN LINE');
block('L', 490, 'PART 02 · ENTRY',      '入场识别门',  'WIDTH 3.2M · OPEN FLOW');
block('L', 710, 'PART 03 · INTERACT',   '互动体验台',  'DEMO · CHECK-IN · SHARE');

/* 右列（上→下）：媒体内容 / 核心信息 / 氛围灯光 */
anchor(1120, 430); elbow([[1120,430],[1310,430],[1310,266],[1420,266]], 1420, 266);
anchor(960, 450); elbow([[960,450],[1350,450],[1350,486],[1420,486]], 1420, 486);
anchor(1120, 554); elbow([[1120,554],[1390,554],[1390,706],[1420,706]], 1420, 706);
block('R', 270, 'PART 04 · MEDIA',   '媒体内容屏',  'AGENDA · STORY · CTA');
block('R', 490, 'PART 05 · MESSAGE', '核心信息墙',  'VALUE · PROOF · OFFER');
block('R', 710, 'PART 06 · LIGHT',   '氛围灯光带',  'WARM · FOCUS · GUIDE');

stageFit();
</script>
</body>
</html>
