  var it = document.createElement('div');
  it.className = 'item'; it.dataset.i = i; it.dataset.layoutId = l.id;
  it.innerHTML = '<span class="code">' + l.code + '</span><span class="name">' + l.name + '</span>';
  it.addEventListener('click', function () { go(i); });
  toc.appendChild(it);
});

/* ---------- 预览缩放：唯一权威为 runtime/stage-fit.js ---------- */
var viewport = document.getElementById('viewport');
var stagebox = document.getElementById('stagebox');
var frameLine = document.getElementById('frame-line');
var frameLoader = createGalleryFrameLoader(stagebox);
function fitGallery() { WisePPTStageFit.fitGallery(stagebox, viewport, frameLine); }
window.addEventListener('resize', fitGallery);

/* ---------- 强调色开关 ---------- */
var accentOn = false;
var accBtn = document.getElementById('acc-btn');
function applyAccent() {
  accBtn.classList.toggle('on', accentOn);
  accBtn.textContent = accentOn ? '强调色：开' : '强调色：关';
  if (LAYOUTS.length) go(cur);
}
accBtn.addEventListener('click', function () {
  accentOn = !accentOn;
  applyAccent();
});

/* ---------- 切换 ---------- */
/* 当前版式同步进 URL hash（如 #A2），刷新自动停留、链接可直达 */
function codeToIndex(code) {
  if (!code) return -1;
  for (var i = 0; i < LAYOUTS.length; i++) if (LAYOUTS[i].code === code) return i;
  return -1;
}
var prevBtn = document.getElementById('prev');
var nextBtn = document.getElementById('next');
/* 加载锁配套：连点/连按被吞的目标暂存于此，reveal 完成后只消费最后一次，
   根治"页码跳了但画面没动"的体感失效。null 表示无排队。 */
var pendingTarget = null;
/* 不用 disabled（会让浏览器硬丢弃 click、连点意图无法排队），
   改用 is-busy class 表达加载态：视觉变淡 + cursor:wait，但保持可点击，
   让 go() 内的 isBusy() 软锁接管排队。 */
function setNavBusy(busy) {
  prevBtn.classList.toggle('is-busy', busy);
  nextBtn.classList.toggle('is-busy', busy);
  prevBtn.setAttribute('aria-busy', busy ? 'true' : 'false');
  nextBtn.setAttribute('aria-busy', busy ? 'true' : 'false');
}
/* 箭头/键盘的相对翻页：基于"已排队的最新目标"累加 delta，
   使加载窗口内的连点能正确合并为最终意图（如连点5次 next → 跳5页）。 */
function step(delta) {
  var base = pendingTarget !== null ? pendingTarget : cur;
  go(base + delta);
}
function go(i, opts) {
  /* 加载锁：iframe 切换是异步流水线（load→fonts→render-ready→双rAF→reveal），
     在此窗口内到达的新请求一律排队（只保留最后一次），不提前更新 cur/页码/hash，
     避免 UI 与可见画面不同步。reveal 完成后由 onReady 回调消费 pendingTarget。 */
  if (frameLoader.isBusy()) {
    pendingTarget = (i + LAYOUTS.length) % LAYOUTS.length;
    return;
  }
  cur = (i + LAYOUTS.length) % LAYOUTS.length;
  var l = LAYOUTS[cur];
  frameLoader.load('frames/' + l.file + (accentOn ? '?accent=1' : ''));
  setNavBusy(true);
  document.getElementById('b-code').textContent = l.code;
  document.getElementById('b-name').textContent = l.name;
  document.getElementById('b-use').textContent = l.use || '';
  document.getElementById('b-idx').textContent =
    String(cur + 1).padStart(2, '0') + ' / ' + String(LAYOUTS.length).padStart(2, '0');
  var items = document.querySelectorAll('#toc .item');
  items.forEach(function (it) { it.classList.toggle('active', +it.dataset.i === cur); });
  var act = document.querySelector('#toc .item.active');
  if (act) act.scrollIntoView({ block: 'nearest' });
  /* 写入 hash（opts.silent 跳过，避免与 hashchange 互相触发） */
  if (!opts || !opts.silent) {
    var want = '#' + l.code;
    if (location.hash !== want) location.hash = want;
  }
}
/* 每帧 reveal 完成（含连点期间攒下的排队被接力加载后）触发：
   恢复箭头可用态，并消费 pendingTarget——保证用户最后一次意图不丢失。 */
frameLoader.onReady(function () {
  setNavBusy(false);
  if (pendingTarget !== null) {
    var next = pendingTarget;
    pendingTarget = null;
    go(next);
  }
});
/* 浏览器前进/后退或手动改地址栏 → 驱动切换 */
window.addEventListener('hashchange', function () {
  var i = codeToIndex(location.hash.slice(1));
  if (i >= 0 && i !== cur) go(i, { silent: true });
});
prevBtn.addEventListener('click', function () { step(-1); });
nextBtn.addEventListener('click', function () { step(1); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { step(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { step(1); e.preventDefault(); }
});

fitGallery();
/* 刷新时按 URL hash 停留在原位（如 index.html#A2），无 hash 则回第一页 */
if (LAYOUTS.length) {
  var startI = codeToIndex(location.hash.slice(1));
  go(startI >= 0 ? startI : 0);
}
</script>
</body>
</html>
