txt('版式不是模板',225,277,{'font-size':'var(--type-emphasis)','font-weight':300},left);txt('它先决定一页的阅读关系',225,319,{'font-size':'var(--type-body)','font-weight':300,fill:INK70},left);txt('同一段内容，因关系不同，',225,373,{'font-size':'var(--type-body-small)','font-weight':300,fill:INK70},left);txt('应当拥有不同的组织方式。',225,401,{'font-size':'var(--type-body-small)','font-weight':300,fill:INK70},left);
