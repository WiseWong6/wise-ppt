<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-ai-e2" data-page-role="compare" data-theme="paper-ink" data-layout="paper-ink.comparison.watershed-columns" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-e2 · 分水岭双栏 · RAG vs 微调</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.comparison.watershed-columns.comparison-fields" data-content-ref="example.e2">
  <div class="doc tl">AI ENGINEERING — E2<br>RAG VS FINETUNE</div>
  <div class="folio">E2 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">RAG 适合频繁变化的知识，微调适合稳定重复的任务；更新频率决定技术选择。</div>

</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -28.7)'});

/* ---------- 分水岭中轴 x960（38px 刻度齿，中段留 VS 缺口） ---------- */
var VX = 960, VT = 240, VB = 830, VY = 512;
el('line', {x1:VX, y1:VT, x2:VX, y2:VY-30, stroke:INK80, 'stroke-width':1.3});
el('line', {x1:VX, y1:VY+56, x2:VX, y2:VB, stroke:INK80, 'stroke-width':1.3});
for (var ty = VT + 20; ty <= VB - 10; ty += 38) {
  if (ty > VY - 46 && ty < VY + 72) continue;
  el('line', {x1:VX-8, y1:ty, x2:VX+8, y2:ty, stroke:INK, 'stroke-width':.8, opacity:.5});
}
el('line', {x1:VX-14, y1:VT, x2:VX+14, y2:VT, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:VX-14, y1:VB, x2:VX+14, y2:VB, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:VX-26, y1:VY+14, x2:VX-14, y2:VY+14, stroke:INK, 'stroke-width':.6, opacity:.35});
el('line', {x1:VX+14, y1:VY+14, x2:VX+26, y2:VY+14, stroke:INK, 'stroke-width':.6, opacity:.35});
txt(VX, VY-6, 'VS', {'font-family':MONO, 'font-size':'var(--type-body)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
txt(VX, VY+20, 'RAG × FINETUNE', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* ---------- 两栏字段对照（无卡无外框，纯表格制图） ---------- */
var HY = 300, RY0 = 352, RH = 118;
var cols = [
  {
    x: 200, w: 680,
    title: 'RAG · 来一条查一条',
    tag: 'MODE: RETRIEVE · LATENCY: 200 MS',
    rows: [
      {label:'触发时机', code:'TRIGGER',  d:['每条提问实时检索，', '命中即拼进上下文']},
      {label:'更新成本', code:'UPDATE',   d:['知识改了即生效，', '无需重训、零额外算力']},
      {label:'知识时效', code:'FRESH',    d:['知识库可随时增删，', '永远是最新版本']},
      {label:'适用场景', code:'SCENE',    d:['动态知识库、文档', '频繁变动的业务']}
    ]
  },
  {
    x: 1040, w: 680,
    title: '微调 · 攒一批训一次',
    tag: 'MODE: FINETUNE · CYCLE: 数日',
    rows: [
      {label:'触发时机', code:'TRIGGER',  d:['攒一批语料统一训练，', '训完才更新权重']},
      {label:'更新成本', code:'UPDATE',   d:['改知识要重训，', '算力与时间成本高']},
      {label:'知识时效', code:'FRESH',    d:['知识固化进权重，', '更新一次滞后数日']},
      {label:'适用场景', code:'SCENE',    d:['任务稳定、风格固定', '的高频重复场景']}
    ]
  }
];

cols.forEach(function(c){
  var x = c.x, xr = c.x + c.w;
  /* 栏头：中文标题 + 右对齐 mono tag + 双线分隔 + 虚线引线到中轴 */
  txt(x, HY, c.title, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
  txt(xr, HY, c.tag, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':1.5, 'text-anchor':'end', fill:INK45});
  el('line', {x1:x, y1:HY+22, x2:xr, y2:HY+22, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('line', {x1:x, y1:HY+27, x2:x+120, y2:HY+27, stroke:INK, 'stroke-width':.6, opacity:.3});
  var lx1 = (x < VX) ? xr : VX + 8, lx2 = (x < VX) ? VX - 8 : x;
  el('line', {x1:lx1, y1:HY+22, x2:lx2, y2:HY+22, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 5'});

  /* 四行字段：圆点刻度 + 中文小标题 + mono 字段码 + 虚线竖分隔 + 说明列 */
  c.rows.forEach(function(r, i){
    var ry = RY0 + i * RH;
    el('circle', {cx:x, cy:ry+36, r:2.6, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.8});
    txt(x+18, ry+43, r.label, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
    txt(x+18, ry+71, r.code, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK45});
    el('line', {x1:x+182, y1:ry+12, x2:x+182, y2:ry+RH-24, stroke:INK, 'stroke-width':.6, opacity:.2, 'stroke-dasharray':'2 5'});
    r.d.forEach(function(line, j){
      txt(x+206, ry+40 + j*30, line, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
    });
    if (i < c.rows.length - 1) {
      el('line', {x1:x, y1:ry+94, x2:xr, y2:ry+94, stroke:INK, 'stroke-width':.6, opacity:.3});
    }
  });
});

stageFit();
</script>
</body>
</html>
