<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-k2" data-page-role="synthesize" data-theme="paper-ink" data-layout="paper-ink.matrix.problem-solution-outcome" data-layout-source="gallery" data-sample-focus-profile="content-only" data-sample-focus-members='[{"selector":"#k2-focus-kpi-code","role":"annotation"},{"selector":"#sample-focus","role":"value"},{"selector":"#k2-focus-kpi-label","role":"label"}]' data-sample-focus-ref="sample.k2.k2-focus">
<head>
<meta charset="UTF-8">
<title>layout-k2 · 痛点→解法→成效三栏 · AI 阅读系统</title>
<script src="../../../../runtime/stage-fit.js"></script>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/catalog-fonts.css" data-wise-catalog-fonts="true">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  canvas { position: absolute; inset: 0; z-index: 2; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.matrix.problem-solution-outcome.story-loop" data-content-ref="example.k2">
  <div class="doc tl">PPT 标题<br>页面标题</div>
  <div class="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div class="caption">自动归档、知识卡片与个人智能体让 600 篇收藏重新可用，每篇速读耗时降至 1 分钟。</div>
</div>

<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var SERIF = 'var(--serif)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';
G = el('g', {transform:'translate(0 -73.2)'});




/* 主体包络整体配平：FIG 等固定件不参与位移 */
G = el('g', {id:'body', 'data-balance':'structural', transform:'translate(59 +95)'});

/* ---------- 栏头：mono 栏题 + 短横 + 中文栏题 ---------- */
var heads = [
  {x:150,  en:'PAIN POINTS', cn:'阅读痛点'},
  {x:700,  en:'THE FIX',    cn:'AI 解法'},
  {x:1330, en:'OUTCOME',    cn:'真实成效'}
];
heads.forEach(function(h){
  txt(h.x, 238, h.en, {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, fill:INK45});
  el('line', {x1:h.x, y1:254, x2:h.x+100, y2:254, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(h.x, 296, h.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
});

/* ---------- 栏间细线开放箭头 ---------- */
function colArrow(x1, x2, y){
  el('line', {x1:x1, y1:y, x2:x2, y2:y, stroke:INK, 'stroke-width':1.2, opacity:.6});
  el('line', {x1:x2-10, y1:y-6, x2:x2, y2:y, stroke:INK, 'stroke-width':1.2, opacity:.6});
  el('line', {x1:x2-10, y1:y+6, x2:x2, y2:y, stroke:INK, 'stroke-width':1.2, opacity:.6});
}
function svgGroup(attrs, draw){
  var parent = G;
  var group = el('g', attrs || {});
  G = group;
  draw();
  G = parent;
  return group;
}
function centeredColArrow(leftRegion, rightRegion, y){
  var width = 48;
  var arrow = svgGroup({'data-layout-role':'flow-arrow'}, function(){
    colArrow(0, width, y);
  });
  function place(){
    var left = leftRegion.getBBox();
    var right = rightRegion.getBBox();
    var x = (left.x + left.width + right.x - width) / 2;
    arrow.setAttribute('transform', 'translate('+x+' 0)');
  }
  place();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
}

/* ---------- 编号条目（左右栏同构对位；x = 栏头 x，圆圈左缘与栏头共线，同右栏 1330） ---------- */
function item(x, y, no, title, note1, note2, tag){
  el('circle', {cx:x+13, cy:y, r:13, fill:'var(--paper)', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:x+13, cy:y, r:10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  txt(x+13, y+4.5, no, {'font-family':MONO, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:INK});
  txt(x+43, y+7, title, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  txt(x+43, y+40, note1, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
  if (note2) txt(x+43, y+66, note2, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
}

var pains = [
  ['1', '收藏夹是坟场', '文章无限期积压，', '存了等于没看，越积越多。', 'BACKLOG↑'],
  ['2', '读完就忘', '没有提炼与归档，', '一周后内容全忘光。', 'RETENTION↓'],
  ['3', '不会用', '不知道能问什么，', '拿到 AI 也只会查天气。', 'USAGE↓']
];
var fixes = [
  ['1', 'AI 阅读系统', '输入链接自动出卡片，', '收藏即整理，零负担归档。', 'AUTO READ'],
  ['2', '知识卡片', '结构化提炼要点，', '一篇长文压缩成 5 张卡。', 'KNOWLEDGE CARD'],
  ['3', '个人智能体', '基于知识库问答，', '随时反查、随时调用。', 'PERSONAL AGENT']
];
var YS = [372, 522, 672];
var painRegion = svgGroup({'data-arrow-region':'pain'}, function(){
  YS.forEach(function(y, i){
    item(150, y, pains[i][0], pains[i][1], pains[i][2], pains[i][3], pains[i][4]);
  });
});
var fixRegion = svgGroup({'data-arrow-region':'fix'}, function(){
  YS.forEach(function(y, i){
    item(700, y, fixes[i][0], fixes[i][1], fixes[i][2], fixes[i][3], fixes[i][4]);
  });
});
YS.forEach(function(y, i){
  /* 对位虚线（栏间短桥，编号对齐语义） */
  el('line', {x1:616, y1:y, x2:680, y2:y, stroke:INK, 'stroke-width':.5, opacity:.3, 'stroke-dasharray':'2 5'});
});

/* ---------- 右栏：成效大数字（两段等分；顶对齐第一条编号，底对齐前两列末行说明） ---------- */
var CXR = 1330;
var KPI_TOP = 352;
var KPI_LABEL_FROM_TOP = 168;
var KPI_LAST_LABEL = YS[2] + 66;
var KPI_BAND = KPI_LAST_LABEL - KPI_TOP - KPI_LABEL_FROM_TOP;
function kpi(index, value, label, highlight){
  var top = KPI_TOP + index * KPI_BAND;
  var head = txt(CXR, top+20, 'KPI · 0'+(index+1), {id:highlight?'k2-focus-kpi-code':'', 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});
  txt(CXR, top+112, value, {id:highlight?'sample-focus':'k2-kpi-'+index, 'font-family':SERIF, 'font-size':'var(--type-hero)', fill:INK});
  var cap = txt(CXR, top+KPI_LABEL_FROM_TOP, label, {id:highlight?'k2-focus-kpi-label':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  return {head:head, cap:cap};
}
var outcomeRegion = svgGroup({'data-arrow-region':'outcome'}, function(){
  var k0 = kpi(0, '600', '份文章已整理', false);
  var divider = el('line', {x1:1330, y1:KPI_TOP+KPI_BAND, x2:1640, y2:KPI_TOP+KPI_BAND, stroke:INK, 'stroke-width':.6, opacity:.3});
  var k1 = kpi(1, '1分钟', '每篇速读耗时', true);
  function placeDivider(){
    var a = k0.cap.getBBox();
    var b = k1.head.getBBox();
    var y = a.y + a.height + (b.y - a.y - a.height) / 2;
    divider.setAttribute('y1', y);
    divider.setAttribute('y2', y);
  }
  placeDivider();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeDivider);
});
centeredColArrow(painRegion, fixRegion, 485);
centeredColArrow(fixRegion, outcomeRegion, 485);

stageFit();
</script>
</body>
</html>
