<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-render-pending="true" data-page-id="gallery-ai-c4" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.data.geo-bubble-map" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-c4 · 广东分布地图 · AI 覆盖</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<!-- ECharts 纸墨化（规约见 ../../../references/component-adapters.md）：仅用于真实地理分布图 -->
<script src="../../../../capabilities/vendors/echarts/echarts.min.js"></script>
<script src="../../../../capabilities/vendors/geo/guangdong-geo.js"></script>
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  /* ECharts 地图画布：铺在主图区，让 registerMap 渲染真实省/市界 */
  #chart {
    position: absolute;
    left: 180px; top: 214.8px;
    width: 1160px; height: 624px;
    z-index: 2;
  }
  /* SVG 节点叠层：盖在 echarts canvas 之上，画双圈节点/数值/城市名 */
  svg.overlay {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    z-index: 3; pointer-events: none;
  }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.data.geo-bubble-map.map" data-content-ref="example.c4">
  <div class="doc tl">AI ENGINEERING — C4<br>GUANGDONG AI COVERAGE</div>
  <div class="folio">C4 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>
  <div id="chart"></div>
  <svg class="overlay" viewBox="0 0 1920 1080">
    <g id="nodes"></g>
  </svg>

  <div class="caption">六座城市组成广东 AI 服务网，节点部署与日均调用量集中在广深核心区。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var INK15 = 'rgba(25,25,23,.15)';
var G = document.getElementById('draw');
G = el('g', {transform:'translate(0 -34.2)'});
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'Courier Prime', SANS = 'Han Sans';

/* ---------- 色阶配方：遵循强调色开关（design-tokens.md §2）----------
   默认单色系统 → 墨灰色阶；?accent 开启 → 番茄红色阶。
   未覆盖城市一律填深一度纸色（rgba(212,213,205,.55)，--paper-deep 系），仅覆盖城市按仓数分档上色。
   visualMap（地图）与左下角图例从同一 RAMP 生成，保证 1:1 对应。 */
/* 直接读 URL 判定强调色（stageFit 末尾才加 .accent class，此处不能依赖它） */
var ACCENT_ON = location.search.indexOf('accent') >= 0;
/* 番茄红从 design token 读取（同 layout-j3 取色方式），再解析出 RGB 分量供 rgba() 拼接 */
var RED_CSS = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
function cssToRgb(c){
  var m = c.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (m) return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)].join(',');
  m = c.match(/^rgba?\(\s*([^)]+?)\s*\)$/i);
  if (m) return m[1].split(',').slice(0, 3).map(function(s){ return s.trim(); }).join(',');
  return '25,25,23';  /* 解析失败退回墨灰档，避免拼出非法 rgba() */
}
/* rgb 串 + alpha 区间：墨灰档轻（.12–.55），番茄红档重（.30–.85） */
var RAMP_RGB = ACCENT_ON ? cssToRgb(RED_CSS) : '25,25,23';
var RAMP_LO = ACCENT_ON ? .30 : .12;
var RAMP_HI = ACCENT_ON ? .85 : .55;
/* 六档 alpha：仓数越高越饱和，与六个城市的 value 线性对应 */
function rampAlpha(v){
  var mn = 6, mx = 42;
  if (v <= mn) return RAMP_LO;
  if (v >= mx) return RAMP_HI;
  return +(RAMP_LO + (v - mn) / (mx - mn) * (RAMP_HI - RAMP_LO)).toFixed(3);
}
function rampColor(v){ return 'rgba(' + RAMP_RGB + ',' + rampAlpha(v) + ')'; }
/* visualMap 的分段边界（按城市仓数划分，每档左闭右开区间） */
var RAMP_PIECES = [
  {min:35, max:100}, {min:24, max:35}, {min:15, max:24},
  {min:11, max:15}, {min:7, max:11}, {min:0, max:7}
].map(function(p){
  /* 每档取中点算 alpha，保证档内城市命中预期色 */
  var midV = (p.min + Math.min(p.max,42)) / 2;
  return { min: p.min, max: p.max, color: rampColor(midV) };
});
/* 图例用的 5 档展示 alpha（从最浅到最深） */
var RAMP_LEGEND = [.12,.27,.40,.52,.65].map(function(frac){
  return +(RAMP_LO + frac * (RAMP_HI - RAMP_LO)).toFixed(3);
});
if (ACCENT_ON) RAMP_LEGEND = [.30,.46,.60,.73,.85];


/* ---------- 经纬构造线（测绘底稿，不擦除）—— 广东约 109.7°–117.2°E / 20.2°–25.5°N ---------- */
[740, 980].forEach(function(x, i){
  el('line', {x1:x, y1:208, x2:x, y2:832, stroke:INK, 'stroke-width':.5, opacity:.14, 'stroke-dasharray':'2 6'});
});
el('line', {x1:210, y1:520, x2:1340, y2:520, stroke:INK, 'stroke-width':.5, opacity:.14, 'stroke-dasharray':'2 6'});
txt(222, 510, '23°N', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});

/* ---------- 右侧 KPI 栏（x1360–1780，细线分隔、无外框） ---------- */
txt(1360, 226, 'PROVINCE TOTALS', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:INK45});
el('line', {x1:1360, y1:242, x2:1770, y2:242, stroke:INK, 'stroke-width':.8, opacity:.5});
var kpis = [
  ['117',   '部署节点总数（个）'],
  ['3,842', '在线推理实例（路）'],
  ['21',    '覆盖城市（个）'],
  ['96',    '日均调用量（万次）']
];
kpis.forEach(function(k, i){
  var y = 340 + i * 157;
  txt(1360, y, k[0], {'font-family':MONO, 'font-size':'var(--type-metric)', 'letter-spacing':1, fill:INK});
  txt(1360, y+40, k[1], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
  if (i < kpis.length - 1)
    el('line', {x1:1360, y1:y+66, x2:1770, y2:y+66, stroke:INK, 'stroke-width':.6, opacity:.25});
});

/* ---------- 图例（左下）：少 色阶 多 横排 —— 与地图同配方（RAMP），1:1 对应 ---------- */
var rampY = 845, rampX = 200, rampStep = 22, rampH = 12;
txt(rampX, rampY + 6, '少', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-micro-secondary)', fill:INK45});
RAMP_LEGEND.forEach(function(a, i){
  el('rect', {x:rampX + 24 + i*rampStep, y:rampY - rampH/2, width:rampStep-2, height:rampH,
    fill:'rgba('+RAMP_RGB+','+a+')', stroke:INK, 'stroke-width':.5, opacity:.9});
});
txt(rampX + 24 + 5*rampStep + 8, rampY + 6, '多', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-micro-secondary)', fill:INK45});

/* ---------- 左上注记行：左缘与左下色阶共线（x=200），顶与 PROVINCE TOTALS(226) 对齐 ---------- */
txt(200, 228, 'FILL INTENSITY = NODES · 112°E–115°E · MAP DATA © DATAV.GEOATLAS', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});

/* ===================== ECharts 广东省地图（纸墨化） =====================
   分工：ECharts geo 只渲染真实市界（21 地级市），节点（双圈+数值+
   城市名）全部由 SVG overlay 在 canvas 之上绘制，保证纸墨线稿手法
   与字体一致、层级干净。 */

/* 六个覆盖城市：广东省内真实城市名 + 部署节点数 + 经纬度 + 延伸线方向（弧度）
   labelDir 用于规避珠三角城市群的密集重叠：节点数标签沿引线甩到不同方向。
   城市名必须与 GeoJSON properties.name 完全一致（含「市」），供 series.map 匹配。 */
var NODES = [
  {city:'广州市',lng:113.26,lat:23.13,v:42,tag:'广州',en:'GUANGZHOU', dir:Math.PI},        /* 正左，出图 */
  {city:'深圳市',lng:114.06,lat:22.55,v:27,tag:'深圳',en:'SHENZHEN',  dir:0.55},           /* 右下，出图 */
  {city:'佛山市',lng:113.12,lat:23.02,v:19,tag:'佛山',en:'FOSHAN',    dir:-2.36},          /* 左上，出图 */
  {city:'东莞市',lng:113.75,lat:23.05,v:14,tag:'东莞',en:'DONGGUAN',  dir:-0.45},          /* 右上，出图 */
  {city:'珠海市',lng:113.58,lat:22.27,v:9, tag:'珠海',en:'ZHUHAI',    dir:1.15},           /* 下方偏右，出图 */
  {city:'汕头市',lng:116.68,lat:23.35,v:6, tag:'汕头',en:'SHANTOU',   dir:0}               /* 正右，出图 */
];

/* overlay 层的绘制工具（独立于 #draw，因 overlay 在更高 z 层） */
var ONodes = document.getElementById('nodes');
function oEl(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  ONodes.appendChild(e); return e;
}
function oTxt(x, y, str, attrs){
  var t = oEl('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}

/* 地图数据由本地脚本预载，file:// 双击放映不发起网络请求。 */
function loadMap(){
  if (!window.WISE_GUANGDONG_GEO) return Promise.reject(new Error('local geo asset missing'));
  return Promise.resolve(window.WISE_GUANGDONG_GEO);
}

loadMap().then(function(geo){
  echarts.registerMap('guangdong', geo);

  var chart = echarts.init(document.getElementById('chart'));
  chart.setOption({
    animation: false,
    backgroundColor: 'transparent',
    /* visualMap：按 value（仓数）自动映射 areaColor，分级填色的标准做法。
       六个覆盖城市带 value 落入对应分段；其余城市无 value → outOfRange 用深一度纸色（rgba(212,213,205,.55)，--paper-deep 系），避免大面积白块抢眼。
       piecewise 分段比 continuous 更贴合「分档强调」语义。 */
    visualMap: {
      type: 'piecewise',
      /* 与左下角图例同配方（RAMP_PIECES）：墨灰（默认）/ 番茄红（?accent） */
      pieces: RAMP_PIECES,
      outOfRange: { color: 'rgba(212,213,205,.55)' },
      show: false
    },
    series: [{
      type: 'map',
      map: 'guangdong',
      roam: false,
      data: NODES.map(function(n){ return {name: n.city, value: n.v}; }),
      itemStyle: {
        /* 无数据城市底色（visualMap 管不到非数据城市）：深一度纸色，避免大面积白块 */
        areaColor: 'rgba(212,213,205,.55)',
        borderColor: INK,
        borderWidth: 0.8,
        shadowBlur: 0
      },
      emphasis: { disabled: true, label: { show: false } },
      select: { disabled: true },
      label: {
        show: true,
        color: 'rgba(25,25,23,.32)',
        fontFamily: MONO,
        fontSize: paperInkTypeSize('micro-secondary')
      },
      layoutCenter: ['42%', '50%'],
      layoutSize: '70%'
    }]
  });

  /* ---- 节点数标注：延伸线从城市中心拉到地图外，圆点气泡不再使用 ----
     convertToPixel 在 series.map 下用 'series' 坐标系反查经纬度。 */
  var OFFX = 180, OFFY = 208;
  function drawCallouts(){
    ONodes.innerHTML = '';
    NODES.forEach(function(p){
      var xy;
      try { xy = chart.convertToPixel({seriesIndex:0}, [p.lng, p.lat]); } catch(e) { xy = null; }
      if (!xy) return;
      var x = xy[0] + OFFX, y = xy[1] + OFFY;
      /* 城市锚点小圆点（标记经纬度落点，替代原气泡） */
      oEl('circle', {cx:x, cy:y, r:2.4, fill:INK, opacity:.7});

      /* 延伸线终点：沿 dir 方向外推固定长度 */
      var lead = 135;
      var ax = x + Math.cos(p.dir) * lead;
      var ay = y + Math.sin(p.dir) * lead;
      /* 延伸线（细实线，墨 35%） */
      oEl('line', {x1:x + Math.cos(p.dir)*4, y1:y + Math.sin(p.dir)*4,
                   x2:ax, y2:ay, stroke:INK, 'stroke-width':.7, opacity:.35});
      /* 线末端小横杠（制图标注感） */
      var perp = p.dir + Math.PI/2;
      oEl('line', {x1:ax + Math.cos(perp)*5, y1:ay + Math.sin(perp)*5,
                   x2:ax - Math.cos(perp)*5, y2:ay - Math.sin(perp)*5,
                   stroke:INK, 'stroke-width':.9, opacity:.6});
      /* 文字对齐方向：右半平面左对齐，左半平面右对齐 */
      var anchor = Math.cos(p.dir) >= 0 ? 'start' : 'end';
      var tx = ax + (anchor === 'start' ? 8 : -8);
      /* 节点数（mono 大字）+ 城市名（中文）+ mono EN 注 */
      oTxt(tx, ay - 6, p.v + ' 节点', {'font-family':MONO, 'font-size':'var(--type-body)', 'letter-spacing':1, 'text-anchor':anchor, fill:INK});
      oTxt(tx, ay + 18, p.tag + ' · ' + p.en, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'letter-spacing':1, 'text-anchor':anchor, fill:INK70});
    });
  }

  /* setOption 同步完成 layout（无动画），finished 兜底确保 convertToPixel 可用 */
  chart.on('finished', drawCallouts);
  drawCallouts();
  markRenderReady();
});

stageFit();
</script>
</body>
</html>
