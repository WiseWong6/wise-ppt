<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-b5" data-page-role="sequence" data-theme="paper-ink" data-layout="paper-ink.temporal.step-rise" data-layout-source="gallery" data-sample-focus-profile="content-only" data-sample-focus-members='[{"selector":"#b5-focus-node","role":"outline"},{"selector":"#b5-focus-dot","role":"symbol","paint":"fill"},{"selector":"#b5-focus-year","role":"value"},{"selector":"#b5-focus-event","role":"value"},{"selector":"#b5-focus-note","role":"label"},{"selector":"#b5-focus-leader","role":"outline"}]' data-sample-focus-ref="sample.b5.b5-focus">
<head>
<meta charset="UTF-8">

  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;

    z-index: 5;
  }
</style>

<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.temporal.step-rise.stages" data-content-ref="example.b5">
  <div class="doc tl">PPT 标题<br>页面标题</div>
  <div class="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">AI 能力从单点工具走向自主组织，需要依次补齐工作流、Agent 协同与开放协议。</div>
</div>

<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -9.2)'});


/* ---------- 主角：左下→右上的楼梯折线（五级，1.4px） ---------- */
el('path', {d:'M 220 820 H 560 V 690 H 900 V 560 H 1240 V 430 H 1580 V 300 H 1760',
  fill:'none', stroke:INK80, 'stroke-width':1.4});

/* ---------- 平行上升箭头（全页唯一强调线 2.2px，含开放式箭头） ---------- */
el('path', {d:'M 200 862 H 560 V 732 H 900 V 602 H 1240 V 472 H 1580 V 342 H 1740 L 1720 331 M 1740 342 L 1720 353',
  fill:'none', stroke:INK, 'stroke-width':2.2, opacity:.85});

/* ---------- 起点与终点套准 ---------- */
el('circle', {cx:220, cy:820, r:8, fill:'none', stroke:INK80, 'stroke-width':1.1});
el('circle', {cx:220, cy:820, r:2.4, fill:INK});
el('line', {x1:1768, y1:300, x2:1784, y2:300, stroke:INK, 'stroke-width':.8, opacity:.45});
el('line', {x1:1776, y1:292, x2:1776, y2:308, stroke:INK, 'stroke-width':.8, opacity:.45});

/* ---------- 踏步节点块（年份 + 事件 + 一行注，挂台阶侧边） ---------- */
var steps = [
  {x:250,  lx:286,  tread:820, ty:700, year:'2022', ev:'单点工具', note:'单任务模型调用跑通'},
  {x:590,  lx:626,  tread:690, ty:570, year:'2023', ev:'工作流自动化', note:'多步骤编排 12 条流水线上线'},
  {x:930,  lx:966,  tread:560, ty:440, year:'2024', ev:'Agent 协同', note:'多 Agent 路径规划 V2 发布'},
  {x:1270, lx:1306, tread:430, ty:310, year:'2025', ev:'多 Agent 编排', note:'多 Agent 编排 · 统一编排'},
  {x:1540, lx:1644, tread:300, ty:186, year:'2026', ev:'自主组织', note:'开放协议 · 百 Agent 互联', focus:true}
];
steps.forEach(function(s, i){
  var top = Boolean(s.focus);
  /* 踏步落点 + 短引线 */
  el('circle', {id:top?'b5-focus-node':'b5-step-'+i, cx:s.lx, cy:s.tread, r:5, fill:'var(--paper)', stroke:INK80, 'stroke-width':1});
  el('circle', {id:top?'b5-focus-dot':'', cx:s.lx, cy:s.tread, r:1.8, fill:INK});
  el('line', {id:top?'b5-focus-leader':'', x1:s.lx, y1:s.tread-6, x2:s.lx, y2:s.ty+78, stroke:INK, 'stroke-width':.7, opacity:.45});
  /* 文字块 */
  txt(s.x, s.ty, s.year, {id:top?'b5-focus-year':'', 'font-family':MONO, 'font-size':'var(--type-body)', 'letter-spacing':2, fill:INK});
  el('line', {x1:s.x, y1:s.ty+12, x2:s.x+58, y2:s.ty+12, stroke:INK, 'stroke-width':.6, opacity:.3});
  txt(s.x, s.ty+44, s.ev, {id:top?'b5-focus-event':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
  txt(s.x, s.ty+72, s.note, {id:top?'b5-focus-note':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
});

/* ---------- 右下空白区：竖向高度标注（构造件） ---------- */
el('line', {x1:1830, y1:340, x2:1830, y2:820, stroke:INK, 'stroke-width':.5, opacity:.3, 'stroke-dasharray':'2 6'});
el('line', {x1:1822, y1:340, x2:1838, y2:340, stroke:INK, 'stroke-width':.7, opacity:.4});
el('line', {x1:1822, y1:820, x2:1838, y2:820, stroke:INK, 'stroke-width':.7, opacity:.4});
el('text', {x:1807, y:586, 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45,
  transform:'rotate(90 1807 586)'}).textContent = 'Δ STAGE × 5';

stageFit();
</script>
</body>
</html>
