<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-ai-h4" data-page-role="explain" data-theme="paper-ink" data-layout="paper-ink.nested.foundation-stack" data-layout-source="gallery">

<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">

  canvas { position: absolute; inset: 0; z-index: 2; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;

<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.nested.foundation-stack.support-layers" data-content-ref="example.h4">
  <div class="doc tl">AI ENGINEERING — H4<br>AI INFRA STACK</div>
  <div class="folio">H4 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch20" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#191917" stroke-width=".7" opacity=".3"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div class="caption">算力底座先支撑训练、推理和评测，才能托起知识库、Agent 平台与多模态助手。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK70 = 'rgba(25,25,23,.7)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -58.7)'});


function nodeDot(cx, cy){
  el('circle', {cx:cx, cy:cy, r:4.5, fill:'none', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:cx, cy:cy, r:1.6, fill:INK});
}

/* ---------- 细线开放箭头（托举语义，自下而上） ---------- */
function liftArrow(x, y1, y2, label){          /* y1 下 → y2 上 */
  el('line', {x1:x, y1:y1, x2:x, y2:y2, stroke:INK, 'stroke-width':1.2, opacity:.7});
  el('line', {x1:x-8, y1:y2+11, x2:x, y2:y2, stroke:INK, 'stroke-width':1.2, opacity:.7});
  el('line', {x1:x+8, y1:y2+11, x2:x, y2:y2, stroke:INK, 'stroke-width':1.2, opacity:.7});
  if (label) txt(x+16, (y1+y2)/2+4, label, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});
}
/* 3 组箭头，每组对齐对应模块的水平中心（产品卡/能力卡中心 x=460/960/1460），自下而上逐级托举 */
[460, 960, 1460].forEach(function(x){
  liftArrow(x, 776, 692, 'LIFT');               /* 底座 → 能力层 */
  liftArrow(x, 533, 424);                       /* 能力层 → 产品层 */
});

/* ---------- 卡带图元（形态随语义变化） ---------- */
function gRoute(cx, cy){
  el('path', {d:'M '+(cx-26)+' '+(cy+14)+' C '+(cx-6)+' '+(cy-22)+', '+(cx+4)+' '+(cy+26)+', '+(cx+26)+' '+(cy-14), fill:'none', stroke:INK80, 'stroke-width':1.2});
  nodeDot(cx-26, cy+14);
  nodeDot(cx+26, cy-14);
}
function gTree(cx, cy){
  nodeDot(cx-26, cy);
  [[14,-18],[14,0],[14,18]].forEach(function(p){
    el('line', {x1:cx-22, y1:cy, x2:cx+p[0]-4, y2:cy+p[1], stroke:INK, 'stroke-width':.9, opacity:.6});
    nodeDot(cx+p[0], cy+p[1]);
  });
}
function gCross(cx, cy){
  el('line', {x1:cx-26, y1:cy-16, x2:cx+26, y2:cy+16, stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx-26, y1:cy+16, x2:cx+26, y2:cy-16, stroke:INK, 'stroke-width':.9, opacity:.5, 'stroke-dasharray':'4 3'});
  el('circle', {cx:cx, cy:cy, r:9, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.1});
  txt(cx, cy+3.5, '~', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'middle', fill:INK});
}
function gRobot(cx, cy){
  el('rect', {x:cx-19, y:cy-16, width:38, height:24, rx:5, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:cx, y1:cy-16, x2:cx, y2:cy-24, stroke:INK80, 'stroke-width':1});
  el('circle', {cx:cx, cy:cy-27, r:2.2, fill:'none', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:cx-8, cy:cy-5, r:1.6, fill:INK});
  el('circle', {cx:cx+8, cy:cy-5, r:1.6, fill:INK});
  el('circle', {cx:cx-11, cy:cy+12, r:5.5, fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('circle', {cx:cx+11, cy:cy+12, r:5.5, fill:'none', stroke:INK80, 'stroke-width':1.1});
}
function gDock(cx, cy){
  el('line', {x1:cx-30, y1:cy+14, x2:cx+30, y2:cy+14, stroke:INK80, 'stroke-width':1.3});
  [-22, 0, 22].forEach(function(dx){
    el('line', {x1:cx+dx, y1:cy+14, x2:cx+dx, y2:cy+22, stroke:INK, 'stroke-width':1, opacity:.6});
  });
  el('rect', {x:cx-24, y:cy-8, width:26, height:16, fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('path', {d:'M '+(cx+2)+' '+(cy+8)+' L '+(cx+2)+' '+(cy-8)+' L '+(cx+16)+' '+(cy-8)+' L '+(cx+24)+' '+(cy+1)+' L '+(cx+24)+' '+(cy+8)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('circle', {cx:cx-14, cy:cy+10, r:3.6, fill:'none', stroke:INK, 'stroke-width':1});
  el('circle', {cx:cx+14, cy:cy+10, r:3.6, fill:'none', stroke:INK, 'stroke-width':1});
}
function gDrone(cx, cy){
  el('line', {x1:cx-20, y1:cy-14, x2:cx+20, y2:cy+14, stroke:INK80, 'stroke-width':1.1});
  el('line', {x1:cx-20, y1:cy+14, x2:cx+20, y2:cy-14, stroke:INK80, 'stroke-width':1.1});
  [[-20,-14],[20,14],[-20,14],[20,-14]].forEach(function(p){
    el('ellipse', {cx:cx+p[0], cy:cy+p[1], rx:7, ry:3, fill:'none', stroke:INK, 'stroke-width':1, opacity:.65});
  });
  el('rect', {x:cx-6, y:cy-4, width:12, height:8, fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('line', {x1:cx, y1:cy+4, x2:cx, y2:cy+12, stroke:INK, 'stroke-width':.9, opacity:.6, 'stroke-dasharray':'2 2'});
}

/* ---------- 卡带（双线框卡） ---------- */
function card(x, y, w, h, item){
  el('rect', {x:x, y:y, width:w, height:h, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:x+5, y:y+5, width:w-10, height:h-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  item.g(x+62, y+h/2);
  txt(x+112, y+40, item.en, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});
  txt(x+112, y+72, item.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  el('line', {x1:x+112, y1:y+88, x2:x+w-28, y2:y+88, stroke:INK, 'stroke-width':.6, opacity:.25});
  txt(x+112, y+114, item.note, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', fill:INK70});
}

/* 顶层：产品 / 场景卡带 y270–420 */
var topItems = [
  {g:gRobot, en:'AGENT PLATFORM', cn:'Agent 平台', note:'智能体编排与多步执行'},
  {g:gDock,  en:'KNOWLEDGE BASE', cn:'知识库',     note:'企业私有知识检索增强'},
  {g:gDrone, en:'MULTIMODAL',     cn:'多模态助手', note:'图文音视统一理解与生成'}
];
[260, 760, 1260].forEach(function(x, i){ card(x, 270, 400, 150, topItems[i]); });

/* 中层：能力卡带 y535–685 */
var midItems = [
  {g:gRoute, en:'TRAINING',    cn:'模型训练',   note:'预训练与指令微调流水线'},
  {g:gTree,  en:'INFERENCE',   cn:'推理服务',   note:'高并发低延迟在线推理'},
  {g:gCross, en:'EVALUATION',  cn:'评测体系',   note:'离线基准与线上质量监控'}
];
[260, 760, 1260].forEach(function(x, i){ card(x, 535, 400, 150, midItems[i]); });

/* ---------- 底层：通栏底座带 y780–860 ---------- */
el('rect', {x:150, y:780, width:1620, height:80, fill:'url(#hatch20)', stroke:INK80, 'stroke-width':1.3});
el('rect', {x:156, y:786, width:1608, height:68, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
txt(960, 819, 'AI CORE — COMPUTE + TRAINING FRAMEWORK', {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK});
txt(960, 845, 'AI 算力底座 · 训练与推理一体化框架', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':'middle', fill:INK});
txt(186, 845, 'REV 4.2', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, fill:INK45});
txt(1734, 845, '2,400 GPU', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'end', fill:INK45});

stageFit();
</script>
</body>
</html>
