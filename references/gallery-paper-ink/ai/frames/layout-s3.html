<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
var PAPER = 'var(--paper)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('s3-chrome');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs || {}));
  t.textContent = str; return t;
}
function svgGroup(id, draw) {
  var parent = G;
  G = document.getElementById(id);
  draw();
  G = parent;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)', SERIF = 'var(--serif)';

function sectionHead(x, y, en, cn) {
  txt(x, y, en, {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, fill:INK45});
  el('line', {x1:x, y1:y+16, x2:x+100, y2:y+16, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(x, y+54, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
}
function drawMark(kind, y) {
  if (kind === 'doc') {
    el('rect', {x:158, y:y-28, width:44, height:52, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
    el('rect', {x:150, y:y-20, width:44, height:52, fill:PAPER, stroke:INK80, 'stroke-width':1.2});
    [y-8, y+4, y+16, y+28].forEach(function(yy){
      el('line', {x1:158, y1:yy, x2:186, y2:yy, stroke:INK, 'stroke-width':.8, opacity:.5});
    });
    el('line', {x1:154, y1:y+26, x2:190, y2:y-16, stroke:INK, 'stroke-width':1, opacity:.6});
    el('line', {x1:154, y1:y-16, x2:190, y2:y+26, stroke:INK, 'stroke-width':1, opacity:.6});
  } else if (kind === 'ruler') {
    el('line', {x1:150, y1:y-8, x2:214, y2:y-8, stroke:INK80, 'stroke-width':1.2});
    for (var t = 0; t < 6; t++) el('line', {x1:152+t*12, y1:y-8, x2:152+t*12, y2:y-16, stroke:INK, 'stroke-width':.8, opacity:.6});
    el('line', {x1:158, y1:y+16, x2:214, y2:y+16, stroke:INK80, 'stroke-width':1.2});
    for (var u = 0; u < 5; u++) el('line', {x1:162+u*12, y1:y+16, x2:162+u*12, y2:y+24, stroke:INK, 'stroke-width':.8, opacity:.6});
    el('line', {x1:182, y1:y-20, x2:182, y2:y+28, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'2 4'});
  } else if (kind === 'trace') {
    el('path', {d:'M 150 '+(y+16)+' L 166 '+(y-2)+' L 180 '+(y+10)+' L 194 '+(y-10), fill:'none', stroke:INK, 'stroke-width':1, 'stroke-dasharray':'4 4', opacity:.6});
    el('circle', {cx:208, cy:y, r:13, fill:PAPER, stroke:INK80, 'stroke-width':1.2});
    el('line', {x1:217, y1:y+9, x2:226, y2:y+18, stroke:INK80, 'stroke-width':1.3});
  } else if (kind === 'ledger') {
    el('rect', {x:156, y:y-22, width:48, height:58, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
    el('rect', {x:150, y:y-16, width:48, height:58, fill:PAPER, stroke:INK80, 'stroke-width':1.2});
    [y-2, y+10, y+22, y+34].forEach(function(yy, i){
      el('line', {x1:158, y1:yy, x2:i === 0 ? 176 : 190, y2:yy, stroke:INK, 'stroke-width':.8, opacity:.5});
    });
  } else if (kind === 'loop') {
    el('path', {d:'M 168 '+(y-18)+' A 18 18 0 1 1 154 '+(y+8), fill:'none', stroke:INK80, 'stroke-width':1.3});
    el('line', {x1:168, y1:y-18, x2:160, y2:y-28, stroke:INK80, 'stroke-width':1.2});
    el('line', {x1:168, y1:y-18, x2:178, y2:y-24, stroke:INK80, 'stroke-width':1.2});
    el('circle', {cx:186, cy:y+16, r:3, fill:INK});
  } else {
    el('circle', {cx:174, cy:y, r:22, fill:'none', stroke:INK80, 'stroke-width':1.3});
    el('line', {x1:174, y1:y, x2:174, y2:y-12, stroke:INK, 'stroke-width':1.2});
    el('line', {x1:174, y1:y, x2:186, y2:y+4, stroke:INK, 'stroke-width':1.1});
    el('circle', {cx:174, cy:y, r:2.4, fill:INK});
  }
}
function cardItems(rows) {
  rows.forEach(function(item){

    txt(246, item.y+48, item.desc[1], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', fill:INK70});
  });
}

function unionBox(ids) {
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ids.forEach(function(id){
    var b = document.getElementById(id).getBBox();
    minX = Math.min(minX, b.x);
    minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.width);
    maxY = Math.max(maxY, b.y + b.height);
  });
  return {x:minX, y:minY, right:maxX, bottom:maxY};
}

/* 箭头夹在左栏墨迹右缘和右栏墨迹左缘之间，水平居中；垂直仍对整列中线 */
var ARROW_W = 28;
var gutterArrow = el('g', {'data-layout-role':'flow-arrow'});
(function(){
  var parent = G;
  G = gutterArrow;
  el('line', {x1:0, y1:506, x2:ARROW_W, y2:506, stroke:INK, 'stroke-width':1.3, opacity:.65});
  el('line', {x1:ARROW_W-10, y1:498, x2:ARROW_W, y2:506, stroke:INK, 'stroke-width':1.3, opacity:.65});
  el('line', {x1:ARROW_W-10, y1:514, x2:ARROW_W, y2:506, stroke:INK, 'stroke-width':1.3, opacity:.65});
  G = parent;
})();
function placeGutterArrow() {
  var left = unionBox(['s3-problem-list', 's3-problem-cost']);
  var right = unionBox(['s3-solution-flow', 's3-evidence-band', 's3-result-band']);
  var x = (left.right + right.x - ARROW_W) / 2;
  gutterArrow.setAttribute('transform', 'translate('+x+' 0)');
}

    });
  }

  (function(){

    [[-28,-26],[0,-32],[28,-26]].forEach(function(p){

    });
    el('path', {d:'M '+(x-20)+' '+(y-10)+' L '+(x+20)+' '+(y-10)+' L '+(x+8)+' '+(y+14)+' L '+(x-8)+' '+(y+14)+' Z', fill:'none', stroke:INK80, 'stroke-width':1.4});
    el('line', {x1:x, y1:y+14, x2:x, y2:y+28, stroke:INK80, 'stroke-width':1.4});

    el('line', {x1:x-32, y1:y+14, x2:x+32, y2:y+14, stroke:INK, 'stroke-width':.7, opacity:.35, 'stroke-dasharray':'3 3'});

  })();
  (function(){

    el('path', {d:'M '+(x-22)+' '+y+' A 22 22 0 0 1 '+(x+22)+' '+y, fill:'none', stroke:INK80, 'stroke-width':1.4});
    el('line', {x1:x-22, y1:y, x2:x-10, y2:y-16, stroke:INK, 'stroke-width':1.2});

  var labels = ['意图解析', '知识召回', '工具编排', '生成校验', '灰度放量'];
  var codes = ['PARSE', 'RETRIEVE', 'ORCHESTRATE', 'VERIFY', 'CANARY'];
  var notes = ['三路信号汇入槽位', '当周口径一次对齐', '工具与回写交叠执行', '生成前拦下越界答案', '小流量观察再放量'];
  PX.forEach(function(x, i){
    txt(x, 268, '0'+(i+1), {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
    txt(x, 400, labels[i], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:INK});
    txt(x, 424, codes[i], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
    txt(x, 452, notes[i], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', 'text-anchor':'middle', fill:INK70});
  });
});

svgGroup('s3-evidence-band', function(){

if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeGutterArrow);

stageFit();
</script>
