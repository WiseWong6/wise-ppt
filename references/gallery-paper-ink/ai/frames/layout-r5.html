<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-ai-r5" data-page-role="synthesize" data-theme="paper-ink" data-layout="paper-ink.network.interlocking-system" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-r5 · 互锁齿轮 · AI 系统协同</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  .gears-host{position:absolute;left:435px;top:225px;width:1050px;height:560px;z-index:1}
  .gears-host>.pi-card{background:transparent}
  .caption{position:absolute;left:0;right:0;bottom:82px;text-align:center;font-family:var(--sans);font-size:var(--type-caption);letter-spacing:.04em;color:var(--ink);z-index:5}
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="native-html" data-component-source="native" data-component-id="native.paper-ink.107.interlocking-gears" data-content-ref="example.r5">
  <div class="doc tl">AI 系统 — 互锁齿轮<br>模块彼此驱动</div>
  <div class="folio">R5 / 79 — BY @歪斯WISE</div>
  <div id="gears-host" class="gears-host" data-slot-id="system" data-component-id="native.paper-ink.107.interlocking-gears" aria-label="内容模型评测三个互锁模块"></div>
  <div class="caption">齿轮表达“彼此驱动”；如果只是三个同级模块，应使用并列或网格。</div>
</div>
<script src="../../../../capabilities/layouts/paper-ink-components.js"></script>
<script src="../../../../runtime/stage-fit.js"></script>
<script>
  const catalog=window.PAPER_INK_COMPONENT_DATA;
  const entry=catalog&&catalog.entries.find(item=>item.num===107);
  if(!entry)throw new Error('缺少 native.paper-ink.107.interlocking-gears');
  const style=document.createElement('style');
  style.textContent=(catalog.componentCss||'')+(catalog.componentMotionCss||'');
  document.head.appendChild(style);
  const host=document.getElementById('gears-host');
  host.innerHTML=entry.snippet;
  const content={
    module_1:'内容',
    module_1_desc:'知识与任务',
    module_2:'模型',
    module_2_desc:'推理与执行',
    module_3:'评测',
    module_3_desc:'反馈与校准',
    system_result:'稳定交付'
  };
  Object.entries(content).forEach(([field,value])=>{
    const node=host.querySelector(`[data-field="${field}"]`);
    if(node)node.textContent=value;
  });
  stageFit();
</script>
</body>
</html>
