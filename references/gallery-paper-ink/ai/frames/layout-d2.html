<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-ai-d2" data-page-role="close" data-theme="paper-ink" data-layout="paper-ink.scaffold.particle-outro" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-d2 · 粒子大字尾卡 · AGENT</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  canvas { position: absolute; inset: 0; z-index: 2; }
  svg.marks { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

  /* 尾卡文字（DOM，居中） */
  .sub-en {
    position: absolute; left: 0; right: 0; top: 691.8px;
    text-align: center;
    font-family: var(--mono); font-size: var(--type-body-small);
    letter-spacing: .42em; text-indent: .42em;   /* 末字符补偿，保持视觉居中 */
    color: var(--ink-70);
    z-index: 5;
  }
  .next-cn {
    position: absolute; left: 0; right: 0; top: 789.8px;
    text-align: center;
    font-family: var(--sans); font-weight: 300; font-size: var(--type-subheading);
    letter-spacing: .08em;
    color: var(--ink);
    z-index: 5;
  }
  .next-cn .q { color: var(--ink-70); }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="typography" data-component-source="native" data-component-id="native.paper-ink.scaffold.particle-outro.outro-lockup" data-content-ref="example.d2">
  <div class="doc tl">AI ENGINEERING — D2<br>NEXT · ENGINEERING</div>
  <div class="folio">D2 / 63 — BY @歪斯WISE</div>

  <canvas id="cv" width="1920" height="1080"></canvas>

  <svg class="marks" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="sub-en">@歪斯WISE · AI ENGINEERING V1.0</div>
  <div class="next-cn">下一章 · 评测<span class="q">——没有尺子的 Agent 是盲飞。</span></div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}

/* ---- 构图参数 ---- */
var WORD = 'AGENT';
var FS = paperInkTypeSize('particle-sample');    // 采样字号
var FONT = '500 ' + FS + 'px "Han Serif"';
var CY = 483.8;                                    // 单词中心（中央偏上）

function draw() {
  var w = PART.measure(WORD, FONT);
  var x0 = 960 - w / 2;
  var pts = PART.textPoints(WORD, x0, CY, FONT, 7);

  var minY = 1e9, maxY = -1e9;
  pts.forEach(function (p) { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; });

  /* ① ASCII 乱序字面：0 / 1 / * / - / . 随机落位，打字机小字 */
  var CH = '01*-.';
  ctx.font = paperInkTypeSize('micro-secondary') + 'px "Courier Prime"';
  ctx.fillStyle = '#191917';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  pts.forEach(function (p) {
    var a = .45 + Math.random() * .35;
    var ch = CH[(Math.random() * CH.length) | 0];
    ctx.globalAlpha = a;
    ctx.fillText(ch, p.x + (Math.random() - .5) * 1.5, p.y + (Math.random() - .5) * 1.5);
  });
  ctx.globalAlpha = 1;

  /* ② 字冠上沿零星未落位的浮字符 */
  for (var k = 0; k < 40; k++) {
    ctx.globalAlpha = .2 + Math.random() * .3;
    ctx.fillText(CH[(Math.random() * CH.length) | 0],
      x0 + Math.random() * w, minY - 2 + PART.gauss() * 7);
  }
  ctx.globalAlpha = 1;

  /* ③ 版面大氛围尘（避开文字区，保持尾卡的静） */
  PART.dust(ctx, 140, 150, 1640, 700, 70, .08);

  /* ============ 细线制图标记（SVG） ============ */
  var LX = x0 - 34, RX = x0 + w + 34;            // 单词外扩框
  var TY = minY - 158, BY = maxY + 30;

  /* 套准十字：单词四角 */
  [[LX, TY], [RX, TY], [LX, BY], [RX, BY]].forEach(function (c) {
    el('line', {x1: c[0]-9, y1: c[1], x2: c[0]+9, y2: c[1], stroke:'#191917', 'stroke-width':.6, opacity:.3});
    el('line', {x1: c[0], y1: c[1]-9, x2: c[0], y2: c[1]+9, stroke:'#191917', 'stroke-width':.6, opacity:.3});
  });

  /* 基线构造虚线：单词下沿 */
  el('line', {x1: LX, y1: maxY + 12, x2: RX, y2: maxY + 12,
    stroke:'#191917', 'stroke-width':.6, 'stroke-dasharray':'2 5', opacity:.3});

  /* 字高尺寸标注：左侧引线 + 刻度 */
  (function () {
    var ax = LX - 46;
    el('line', {x1: ax, y1: minY, x2: ax, y2: maxY, stroke:'#191917', 'stroke-width':.8, opacity:.55});
    el('line', {x1: ax-6, y1: minY, x2: ax+6, y2: minY, stroke:'#191917', 'stroke-width':.8, opacity:.55});
    el('line', {x1: ax-6, y1: maxY, x2: ax+6, y2: maxY, stroke:'#191917', 'stroke-width':.8, opacity:.55});
    el('line', {x1: ax, y1: minY, x2: LX, y2: minY, stroke:'#191917', 'stroke-width':.6, 'stroke-dasharray':'2 4', opacity:.3});
    el('line', {x1: ax, y1: maxY, x2: LX, y2: maxY, stroke:'#191917', 'stroke-width':.6, 'stroke-dasharray':'2 4', opacity:.3});
    var t = el('text', {x: ax - 14, y: (minY + maxY) / 2, 'text-anchor':'middle',
      'font-family':'Courier Prime', 'font-size':'var(--type-meta)', 'letter-spacing':2,
      fill:'rgba(25,25,23,.45)', transform:'rotate(-90 ' + (ax - 14) + ' ' + ((minY + maxY) / 2) + ')'});
    t.textContent = 'X-HEIGHT 240';
  })();

  /* 分隔细线：英文行下方，两端小刻度 */
  (function () {
    var y = 765.8, x1 = 800, x2 = 1120;
    el('line', {x1: x1, y1: y, x2: x2, y2: y, stroke:'#191917', 'stroke-width':.8, opacity:.55});
    el('line', {x1: x1, y1: y-4, x2: x1, y2: y+4, stroke:'#191917', 'stroke-width':.8, opacity:.55});
    el('line', {x1: x2, y1: y-4, x2: x2, y2: y+4, stroke:'#191917', 'stroke-width':.8, opacity:.55});
  })();

  /* 图注 */
  var ft = el('text', {x: 960, y: 881.8, 'text-anchor':'middle',
    'font-family':'Courier Prime', 'font-size':'var(--type-meta)', 'letter-spacing':5,
    fill:'rgba(25,25,23,.45)'});
  ft.textContent = 'FIG. D2 — END CARD';
}

/* 等思源宋体装完再采样，保证轮廓来自 Han Serif */
function start() {
  if (document.fonts && document.fonts.load) {
    document.fonts.load(FONT, WORD).then(function () {
      document.fonts.ready.then(draw);
    });
  } else {
    draw();
  }
}
start();
stageFit();
</script>
</body>
</html>
