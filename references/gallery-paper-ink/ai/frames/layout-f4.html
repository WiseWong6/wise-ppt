<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-ai-f4" data-page-role="orient" data-theme="paper-ink" data-layout="paper-ink.decomposition.icon-grid" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-f4 · 图标六宫格 · AI 六大能力</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink); z-index: 5;
  }
</style>

<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.decomposition.icon-grid.concepts" data-content-ref="example.f4">
  <div class="doc tl">AI ENGINEERING — F4<br>SIX AGENT CAPABILITIES</div>
  <div class="folio">F4 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch-d2" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#191917" stroke-width=".6" opacity=".3"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">推理、记忆、工具、多模态、理解与生成，构成 Agent 从认知到行动的六项基础能力。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK60 = 'rgba(25,25,23,.6)';
var INK45 = 'rgba(25,25,23,.45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';


/* 六宫格对齐网格2×3空槽规范(版心 1500×620 @ 210,196)，六格 500×310 严格等分，不再整体平移。 */
G = el('g', {transform:'translate(0 0)'});

/* ---------- 6 格：2 行 × 3 列，六等分版心 ---------- */
var COLS = [210, 710, 1210];          /* 三列左缘 x，每格宽 500 */
var ROWS = [196, 506];                /* 两行顶部 y，每格高 310 */
var CW = 500;

/* 通用：每格画图标(居中)+标题+说明 */
function cell(col, row, drawIcon, title, en, desc1, desc2) {
  var gx = COLS[col], gy = ROWS[row];
  var cx = gx + CW/2;                 /* 格水平中心 */
  /* 图标在格上半部居中 */
  drawIcon(cx, gy + 70);
  /* 标题 + EN code */
  txt(cx, gy + 188, title, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:INK});
  txt(cx, gy + 212, en, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2.5, 'text-anchor':'middle', fill:INK45});
  el('line', {x1:cx-24, y1:gy+224, x2:cx+24, y2:gy+224, stroke:INK, 'stroke-width':.6, opacity:.4});
  /* 说明两行 */
  txt(cx, gy + 250, desc1, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':'middle', fill:'rgba(25,25,23,.7)'});
  txt(cx, gy + 272, desc2, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':'middle', fill:'rgba(25,25,23,.55)'});
}

/* ---------- 6 枚细线图标（cx=格中心, cy=图标中心） ---------- */

/* 1. 推理：分叉路径 + 节点（思维链·多步规划） */
cell(0, 0, function(cx, cy){
  el('circle', {cx:cx-38, cy:cy, r:6, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:cx-38, cy:cy, r:2, fill:INK});
  el('circle', {cx:cx+38, cy:cy-26, r:5, fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('circle', {cx:cx+38, cy:cy+26, r:5, fill:'none', stroke:INK80, 'stroke-width':1.1});
  el('path', {d:'M '+(cx-32)+' '+cy+' Q '+(cx-2)+' '+cy+' '+(cx+2)+' '+cy+' Q '+(cx+14)+' '+cy+' '+(cx+20)+' '+(cy-16)+' L '+(cx+34)+' '+(cy-24),
    fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('path', {d:'M '+(cx-32)+' '+cy+' Q '+(cx+14)+' '+cy+' '+(cx+20)+' '+(cy+16)+' L '+(cx+34)+' '+(cy+24),
    fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('circle', {cx:cx+2, cy:cy, r:3, fill:INK, opacity:.7});
}, '推理', 'REASONING', '思维链·多步规划', '复杂问题分步求解');

/* 2. 记忆：电池 + 容量刻度（上下文·容量） */
cell(1, 0, function(cx, cy){
  el('rect', {x:cx-34, y:cy-20, width:60, height:40, fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('rect', {x:cx+26, y:cy-10, width:6, height:20, fill:'none', stroke:INK80, 'stroke-width':1.2});
  /* 电量三格（最后一格 hatch = 已充） */
  el('rect', {x:cx-28, y:cy-14, width:16, height:28, fill:'url(#hatch-d2)', stroke:'none'});
  el('rect', {x:cx-10, y:cy-14, width:16, height:28, fill:'none', stroke:INK, 'stroke-width':.5, opacity:.3});
  el('rect', {x:cx+8, y:cy-14, width:16, height:28, fill:'none', stroke:INK, 'stroke-width':.5, opacity:.3});
  /* 底部刻度 */
  for (var i = 0; i < 4; i++)
    el('line', {x1:cx-34+i*15, y1:cy+26, x2:cx-34+i*15, y2:cy+32, stroke:INK, 'stroke-width':.6, opacity:.4});
}, '记忆', 'MEMORY', '上下文窗口与容量', '向量检索召回相关片段');

/* 3. 工具：3×3 货架网格 + 热点（函数调用·API 编排） */
cell(2, 0, function(cx, cy){
  var gx = cx-33, gy = cy-33, cw = 22;
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
    el('rect', {x:gx+c*cw, y:gy+r*cw, width:cw-3, height:cw-3, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.55});
  }
  /* 中心格 hatch = 热点 */
  el('rect', {x:gx+cw, y:gy+cw, width:cw-3, height:cw-3, fill:'url(#hatch-d2)', stroke:INK80, 'stroke-width':1});
  /* 热点引线 */
  el('circle', {cx:gx+cw+9, cy:gy+cw+9, r:2, fill:INK});
}, '工具', 'TOOLS', '函数调用·API 编排', '多工具串行自动调度');

/* 4. 多模态：三道信号弧 + 发射点（图文音视融合） */
cell(0, 1, function(cx, cy){
  el('circle', {cx:cx, cy:cy+12, r:5, fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('circle', {cx:cx, cy:cy+12, r:2, fill:INK});
  el('path', {d:'M '+(cx-16)+' '+(cy+2)+' A 18 18 0 0 1 '+(cx+16)+' '+(cy+2), fill:'none', stroke:INK80, 'stroke-width':1.2, opacity:.7});
  el('path', {d:'M '+(cx-26)+' '+(cy-4)+' A 30 30 0 0 1 '+(cx+26)+' '+(cy-4), fill:'none', stroke:INK, 'stroke-width':1, opacity:.5});
  el('path', {d:'M '+(cx-36)+' '+(cy-10)+' A 42 42 0 0 1 '+(cx+36)+' '+(cy-10), fill:'none', stroke:INK, 'stroke-width':.9, opacity:.3});
}, '多模态', 'MULTIMODAL', '图文音视融合理解', '跨模态对齐与检索');

/* 5. 理解：刻度表盘 + 指针（自然语言意图解析） */
cell(1, 1, function(cx, cy){
  el('path', {d:'M '+(cx-34)+' '+(cy+12)+' A 34 34 0 0 1 '+(cx+34)+' '+(cy+12), fill:'none', stroke:INK80, 'stroke-width':1.3});
  /* 刻度 */
  for (var i = -2; i <= 2; i++) {
    var a = -Math.PI/2 + i * 0.32;
    el('line', {x1:cx+Math.cos(a)*30, y1:cy+12+Math.sin(a)*30, x2:cx+Math.cos(a)*36, y2:cy+12+Math.sin(a)*36,
      stroke:INK, 'stroke-width':.7, opacity:.5});
  }
  /* 指针 */
  el('line', {x1:cx, y1:cy+12, x2:cx+18, y2:cy-14, stroke:INK, 'stroke-width':1.6});
  el('circle', {cx:cx, cy:cy+12, r:3, fill:INK});
}, '理解', 'COMPREHEND', '自然语言意图解析', '模糊提问精准定位');

/* 6. 生成：盾牌轮廓 + 对勾（文本/代码/图像） */
cell(2, 1, function(cx, cy){
  el('path', {d:'M '+(cx-26)+' '+(cy-28)+' L '+(cx+26)+' '+(cy-28)+' L '+(cx+26)+' '+(cy+6)+
    ' Q '+(cx+26)+' '+(cy+30)+' '+cx+' '+(cy+36)+' Q '+(cx-26)+' '+(cy+30)+' '+(cx-26)+' '+(cy+6)+' Z',
    fill:'none', stroke:INK80, 'stroke-width':1.3});
  el('path', {d:'M '+(cx-26)+' '+(cy-28)+' L '+(cx-26)+' '+(cy+6), fill:'none', stroke:INK, 'stroke-width':.5, opacity:.3});
  el('path', {d:'M '+(cx-26)+' '+(cy-20)+' L '+(cx+26)+' '+(cy-20), fill:'none', stroke:INK, 'stroke-width':.5, opacity:.3});
  /* 对勾 */
  el('path', {d:'M '+(cx-12)+' '+cy+' L '+(cx-3)+' '+(cy+10)+' L '+(cx+14)+' '+(cy-12),
    fill:'none', stroke:INK, 'stroke-width':1.8});
}, '生成', 'GENERATE', '文本·代码·图像产出', '一次成稿可读可运行');

/* 网格构造虚线：外框 + 十字中缝，六等分可见 */
el('rect', {x:210, y:196, width:1500, height:620, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.22, 'stroke-dasharray':'2 6'});
el('line', {x1:710, y1:196, x2:710, y2:816, stroke:INK, 'stroke-width':.6, opacity:.22, 'stroke-dasharray':'2 6'});
el('line', {x1:1210, y1:196, x2:1210, y2:816, stroke:INK, 'stroke-width':.6, opacity:.22, 'stroke-dasharray':'2 6'});
el('line', {x1:210, y1:506, x2:1710, y2:506, stroke:INK, 'stroke-width':.6, opacity:.22, 'stroke-dasharray':'2 6'});

stageFit();
</script>
</body>
</html>
