<!DOCTYPE html>
<html data-theme-id="paper-ink" lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-d4" data-page-role="orient" data-theme="paper-ink" data-layout="paper-ink.scaffold.agenda" data-layout-source="gallery" data-emphasis-targets='[]' data-vnext-semantic-key-map='[]'>
<head>
<meta charset="UTF-8">
<title>layout-d4 · 目录导航页 · AI Engineering</title>
<script src="../../../../runtime/stage-fit.js"></script>
<!--
  纸墨线稿样张 · C5 目录导航页
  @歪斯Wise「AI 工程化实战」分享
  版式纪律（layouts C5）：编号纵列 + 行间细线；当前章一处高亮，其余 45%；右侧一处小线稿；无 FIG
-->
<link rel="stylesheet" href="../../../../themes/engine/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/packages/paper-ink/theme.css">
<link rel="stylesheet" href="../../../../themes/packages/hermes-orange/theme.css">
<link rel="stylesheet" href="../../../../themes/packages/klein-blue/theme.css">
<link rel="stylesheet" href="../../../../themes/engine/assets/catalog-fonts.css" data-wise-catalog-fonts="true">
<link rel="stylesheet" href="../../../../themes/engine/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: var(--ink-45); }
</style>
</head>
<body class="slide">
<div class="stage" data-template-id="D4" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.wise-ppt.scaffold.agenda.agenda" data-content-ref="example.d4">
  <div class="doc tl" data-template-part="support" data-template-slot="support" data-template-slot-kind="text">PPT 标题<br>页面标题</div>
  <div class="folio" data-template-part="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" data-template-part="illustration" data-template-slot="illustration" data-template-slot-kind="illustration" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

</div>

<script src="../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var G = document.getElementById('draw');
function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (parent || G).appendChild(e); return e;
}
function txt(x, y, str, attrs, parent) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}), parent);
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -16.2)'});

/* ===== 页头：mono 小标 + 短横 ===== */
txt(300, 218, 'CONTENTS', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':4, fill:'var(--ink-45)'});
el('line', {x1:438, y1:212, x2:560, y2:212, stroke:INK, 'stroke-width':.6, opacity:.3});

/* ===== 条目纵列：x300–1500，y250 起，行高 126 ===== */
var rows = [
  {no:'1', cn:'认知奠基', en:'FOUNDATIONS',       note:'AI 产品的四类角色与能力边界',       cur:false},
  {no:'2', cn:'工程化思维', en:'HARNESS ENG',     note:'从模型到产品的工程鸿沟',            cur:true},
  {no:'3', cn:'Agent 实战', en:'AGENT IN ACTION', note:'工具调用、状态机与失败恢复',        cur:false},
  {no:'4', cn:'评测体系', en:'EVAL FRAMEWORK',    note:'离线指标与在线尺子的双层护栏',      cur:false},
  {no:'5', cn:'落地路径', en:'ROLLOUT ROADMAP',   note:'从 Demo 到生产的渐进上线计划',      cur:false}
];
var X0 = 300, X1 = 1620, Y0 = 250, GAP = 126;

rows.forEach(function(r, i){
  var y = Y0 + i * GAP;                 /* 行基线带顶部 */
  var op = r.cur ? 1 : .45;             /* 非当前章整行淡墨 */

  /* 序号：当前章实心墨圆反白，其余空心单圈 */
  var cx = X0 + 34, cy = y + 42;
  var marker = el('g', {'data-number-kind':'circled', 'data-number-role':'sequence', 'data-number-state':r.cur?'filled':'outline', 'data-number-rings':r.cur?'2':'1'});
  if (r.cur) {
    el('circle', {cx:cx, cy:cy, r:26, fill:'var(--wp-color-primary)', opacity:op, 'data-number-part':'disc'}, marker);
    el('circle', {cx:cx, cy:cy, r:31, fill:'none', stroke:'var(--wp-color-primary)', 'stroke-width':.6, opacity:.35, 'data-number-part':'outer-ring'}, marker);
    txt(cx, cy+9, r.no, {'data-number-part':'label', 'data-text-kind':'number', 'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:'var(--wp-color-surface-panel)'}, marker);
    /* 高亮短横引出（全页唯一强调线） */
    el('line', {x1:cx+44, y1:cy, x2:cx+72, y2:cy, stroke:INK, 'stroke-width':1.8});
  } else {
    el('circle', {cx:cx, cy:cy, r:26, fill:'none', stroke:'var(--wp-color-primary)', 'stroke-width':1, opacity:op, 'data-number-part':'disc'}, marker);
    txt(cx, cy+8, r.no, {'data-number-part':'label', 'data-text-kind':'number', 'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:'var(--wp-color-primary)', opacity:op}, marker);
  }

  /* 中文章题 + EN 副题 + 内容预告 */
  var tx = X0 + 116;
  txt(tx, cy+2, r.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK, opacity:op});
  var cnw = r.cn.length * 32 + 26;
  txt(tx+cnw, cy-1, r.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:'var(--wp-adapter-pi-ink-60)', opacity:op});
  txt(tx, cy+38, r.note, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:'var(--ink-70)', opacity:op});

  /* 行右端 mono 页码锚 */
  txt(X1, cy+2, 'P.' + (i*4+3), {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'end', fill:'color-mix(in srgb, var(--ink) 50%, transparent)', opacity:op});

  /* 行间 0.6px 分隔线 */
  if (i < rows.length-1)
    el('line', {x1:X0, y1:y+GAP-26, x2:X1, y2:y+GAP-26, stroke:INK, 'stroke-width':.6, opacity:.22});
});
/* 首行上方分隔线 */
el('line', {x1:X0, y1:Y0-26, x2:X1, y2:Y0-26, stroke:INK, 'stroke-width':.6, opacity:.22});

stageFit();
</script>
</body>
</html>
