<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="mixed" data-page-id="gallery-ai-e1" data-page-role="compare" data-theme="paper-ink" data-layout="paper-ink.comparison.dual-panel" data-layout-source="gallery">
<head>
<meta charset="UTF-8">
<title>layout-e1 · 对比双面板 · 传统软件 vs Agent</title>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.comparison.dual-panel.comparison" data-content-ref="example.e1">
  <div class="doc tl">系统对比 — 核心差异<br>软件与 Agent</div>
  <div class="folio">E1 / 63 — BY @歪斯WISE</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">传统软件执行预设路径，Agent 会结合上下文持续判断并调用工具完成目标。</div>
</div>

<script src="../../../../runtime/stage-fit.js"></script>
<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = '#191917';
var INK80 = 'rgba(25,25,23,.8)';
var INK45 = 'rgba(25,25,23,.45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var RED = getComputedStyle(document.documentElement).getPropertyValue('--accent-red').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -32.7)'});

/* ---------- 双面板（520×560 双线框 + 顶部页签） ---------- */
var PY = 270, PH = 560, PW = 520;
var LX = 300, RX = 1100;                 /* 面板左缘；中心 560 / 1360 */
[LX, RX].forEach(function(px){
  el('rect', {x:px, y:PY, width:PW, height:PH, fill:'rgba(255,255,255,.22)', stroke:INK80, 'stroke-width':1.3});
  el('rect', {x:px+5, y:PY+5, width:PW-10, height:PH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
});
el('rect', {x:560-160, y:248, width:320, height:44, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.2});
txt(486, 277, '传统软件', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', fill:INK});
txt(555, 277, 'CLASSIC SOFTWARE', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'rgba(25,25,23,.6)'});
el('rect', {x:1360-160, y:248, width:320, height:44, fill:'#DFE0D9', stroke:INK, 'stroke-width':1.2});
txt(1283, 277, 'Agent', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', fill:INK});
txt(1353, 277, 'AGENTIC', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'rgba(25,25,23,.6)'});

/* ---------- 左面板：错了中断 ✗ ---------- */
txt(560, 420, '错了中断', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', 'letter-spacing':4, 'text-anchor':'middle', fill:INK});
el('path', {d:'M 656 388 L 690 422 M 690 388 L 656 422', stroke:INK, 'stroke-width':3.5, 'stroke-linecap':'round', fill:'none'});
txt(560, 462, 'ERRORS HALT THE FLOW', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 小图形：巷道间往返的拣货路径（虚线折返 + 货架齿） */
(function(){
  var x0 = 390, x1 = 730, y0 = 540;
  /* 三排货架齿 */
  [y0, y0+52, y0+104].forEach(function(ay){
    for (var i = 0; i < 8; i++) {
      el('line', {x1:x0+i*46, y1:ay, x2:x0+i*46+26, y2:ay, stroke:INK, 'stroke-width':1, opacity:.5});
    }
  });
  /* 拣货员的折返虚线路径 */
  el('path', {d:'M '+(x0+12)+' '+(y0-26)+' L '+(x0+12)+' '+(y0+26)+' L '+(x0+104)+' '+(y0+26)
    +' L '+(x0+104)+' '+(y0+78)+' L '+(x0+230)+' '+(y0+78)+' L '+(x0+230)+' '+(y0+130)+' L '+(x0+320)+' '+(y0+130),
    fill:'none', stroke:INK, 'stroke-width':1.1, 'stroke-dasharray':'5 5', opacity:.7});
  el('circle', {cx:x0+12, cy:y0-26, r:3, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('circle', {cx:x0+320, cy:y0+130, r:2.4, fill:INK});
  /* 耗时标注 */
  txt(560, y0+186, '42 MIN · NEEDS HUMAN FIX', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.7)'});
})();
txt(560, 806, '报错即停，等人工介入', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});

/* ---------- 右面板：错了继续 ✓ ---------- */
txt(1360, 420, '错了继续', {'data-accent-group':'positive-outcome', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', 'letter-spacing':4, 'text-anchor':'middle', fill:ACCENT ? RED : INK});
el('path', {d:'M 1452 404 L 1464 418 L 1488 388', fill:'none', stroke: ACCENT ? RED : INK, 'stroke-width':3.5, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
txt(1360, 462, 'SELF-HEALING RELAY', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 小图形：Agent 自愈接力直线送达目标 */
(function(){
  var y = 620, x0 = 1190, x1 = 1530;
  /* 起点：出错的 Agent 节点 */
  el('circle', {cx:x0, cy:y+34, r:16, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('circle', {cx:x0, cy:y+34, r:2.4, fill:INK});
  el('rect', {x:x0-26, y:y-14, width:52, height:34, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:x0-26, y1:y+3, x2:x0+26, y2:y+3, stroke:INK, 'stroke-width':.6, opacity:.4});
  /* 直线路径（实线开放箭头） */
  el('line', {x1:x0+40, y1:y+34, x2:x1-40, y2:y+34, stroke:INK, 'stroke-width':1.4});
  el('path', {d:'M '+(x1-56)+' '+(y+26)+' L '+(x1-40)+' '+(y+34)+' L '+(x1-56)+' '+(y+42), fill:'none', stroke:INK, 'stroke-width':1.4, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  /* 终点：工位（双圈+实心核） */
  el('circle', {cx:x1, cy:y+34, r:12, fill:'none', stroke:INK, 'stroke-width':1.2});
  el('circle', {cx:x1, cy:y+34, r:16, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
  el('circle', {cx:x1, cy:y+34, r:2.4, fill:INK});
  txt(x1, y+78, 'STATION', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  /* 耗时标注 */
  txt(1360, y+146, '3 MIN · SELF-RECOVERY', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':2, 'text-anchor':'middle', fill:'rgba(25,25,23,.7)'});
})();
txt(1360, 806, 'Agent 自己重试、自己修复', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:'rgba(25,25,23,.6)'});

/* ---------- 中央 VS 双圈徽章 + 构造引线 ---------- */
el('circle', {cx:960, cy:460, r:34, fill:'#DFE0D9', stroke:INK80, 'stroke-width':1.2});
el('circle', {cx:960, cy:460, r:40, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
txt(960, 468, 'VS', {'font-family':MONO, 'font-size':'var(--type-body)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
el('line', {x1:LX+PW+14, y1:460, x2:960-46, y2:460, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 5'});
el('line', {x1:960+46, y1:460, x2:RX-14, y2:460, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 5'});

stageFit();
</script>
</body>
</html>
