<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-a5" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.evidence.policy-columns" data-layout-source="gallery" data-sample-focus-profile="content-only" data-sample-focus-members='[{"selector":"#a5-regulation-1","role":"value"},{"selector":"#a5-regulation-2","role":"value"}]' data-sample-focus-ref="sample.a5.a5-focus">
<head>
<meta charset="UTF-8">
<title>layout-a5 · 条文陈列页 · AI 使用合规规范</title>
<script src="../../../../runtime/stage-fit.js"></script>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/catalog-fonts.css" data-wise-catalog-fonts="true">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.evidence.policy-columns.clauses" data-content-ref="example.a5">
  <div class="doc tl">PPT 标题<br>页面标题</div>
  <div class="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">数据、服务与内容安全都必须有明确责任链，AI 上线不是只过一次模型测试。</div>
</div>

<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
function txtSegments(x, y, segments, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  segments.forEach(function(segment){
    var span = document.createElementNS(NS, 'tspan');
    if (segment.id) span.setAttribute('id', segment.id);
    span.textContent = segment.text;
    t.appendChild(span);
  });
  return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -40.2)'});


/* ---------- 栏题带（mono EN + 中文栏题 + 短横） ---------- */
/* v169:三栏等节距 572、整组居中(209 / 781 / 1353,组 bbox 心 960) */
var cols = [
  {x:209, en:'CH.1 · GENERAL RULES',   cn:'数据与训练'},
  {x:781, en:'CH.2 · SERVICE PROVISION',   cn:'服务提供'},
  {x:1353,en:'CH.3 · CONTENT & SAFETY', cn:'内容与安全', focus:true}
];
cols.forEach(function(c){
  txt(c.x, 246, c.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:INK45});
  txt(c.x, 296, c.cn, {id:c.focus?'sample-focus':'a5-column-'+c.x, 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
  el('line', {x1:c.x, y1:316, x2:c.x+150, y2:316, stroke:INK, 'stroke-width':.8, opacity:.5});
  el('line', {x1:c.x, y1:321, x2:c.x+64, y2:321, stroke:INK, 'stroke-width':.6, opacity:.25});
});

/* ---------- 栏间细分隔（0.6px，在两栏内容间隙正中，高度不超栏高） ---------- */
/* 栏内容右缘≈x+289；分隔线=（上一栏右缘 与 下一栏左缘 的中点） */
[701, 1237].forEach(function(x){
  el('line', {x1:x, y1:338, x2:x, y2:820, stroke:INK, 'stroke-width':.8, opacity:.22});
});

/* ---------- 编号条款（①②③ 多级缩进，17px / 行距 40，条款间距 30） ---------- */
function clause(x, y, mark, lines) {
  txt(x, y, mark, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK});
  lines.forEach(function(ln, i){
    var attrs = {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK};
    if (ln === '提供服务前应按照《互联网信息服务') {
      txtSegments(x+34, y + i*40, [
        {text:'提供服务前应按照'},
        {id:'a5-regulation-1', text:'《互联网信息服务'}
      ], attrs);
    } else if (ln === '深度合成管理规定》完成算法备案。') {
      txtSegments(x+34, y + i*40, [
        {id:'a5-regulation-2', text:'深度合成管理规定》'},
        {text:'完成算法备案。'}
      ], attrs);
    } else {
      txt(x+34, y + i*40, ln, attrs);
    }
  });
  return y + lines.length * 40 + 30;
}
function sub(x, y, mark, line) {
  txt(x+34, y, mark, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
  txt(x+70, y, line, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
  return y + 34;
}

/* 栏一 · 数据与训练 */
var y = 372;
y = clause(209, y, '①', ['训练数据处理活动应使用具有合法来源的', '基础语料与标注数据，不得侵害他人民事权益。']);
y = clause(209, y, '②', ['涉及个人信息的，须取得同意或符合法定', '情形，并采取去标识化等脱敏措施。']);
y = clause(209, y, '③', ['发现训练数据存在违法内容的，应及时', '停止使用并采取处置措施。']);
y = clause(209, y, '④', ['提供者应当提高训练数据质量，增强', '训练数据的真实性、准确性、可靠性。']);
y = clause(209, y, '⑤', ['基础模型发生重大变更的，应重新履行', '备案与安全评估程序。']);

/* 栏二 · 服务提供 */
y = 372;
y = clause(781, y, '①', ['提供服务前应按照《互联网信息服务', '深度合成管理规定》完成算法备案。']);
y = clause(781, y, '②', ['应与注册使用者签订服务协议，明确', '双方权利义务与禁止内容。']);
y = clause(781, y, '③', ['不得为未满十四周岁未成年人提供', '单独的生成式服务，须获监护人同意。']);
y = clause(781, y, '④', ['应承担个人信息处理者责任，依法', '履行个人信息保护义务。']);
y = clause(781, y, '⑤', ['应建立公众投诉举报受理机制，及时', '处置并反馈处理情况。']);

/* 栏三 · 内容与安全 */
y = 372;
y = clause(1353, y, '①', ['生成内容应体现社会主义核心价值观，', '不得生成煽动颠覆国家政权的内容。']);
y = clause(1353, y, '②', ['应采取有效措施防范未成年人过度依赖，', '并在显著位置标识 AI 生成。']);
y = clause(1353, y, '③', ['提供图片、视频等生成服务的，应在', '生成内容中添加水印等可溯源标识。']);
y = clause(1353, y, '④', ['发现违法内容的，应立即采取处置措施，', '保存记录并向有关主管部门报告。']);
y = clause(1353, y, '⑤', ['违反规定的，由主管部门依法予以警告、', '罚款、暂停或关闭服务等处罚。']);

stageFit();
</script>
</body>
</html>
