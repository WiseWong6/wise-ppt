<!DOCTYPE html>
<html data-theme-id="paper-ink" lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-c6" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.data.kpi-band" data-layout-source="gallery" data-vnext-semantic-key-map='[{"key":"kpis.text.003","tag":"text","text":"No.01","occurrence":0},{"key":"kpis.text.008","tag":"text","text":"No.02","occurrence":0},{"key":"kpis.text.013","tag":"text","text":"No.03","occurrence":0},{"key":"kpis.text.018","tag":"text","text":"No.04","occurrence":0}]' data-emphasis-targets='[{"target_id":"focus.main-evidence","members":[{"selector":"#sample-focus","role":"value","treatment":"focus.color","expected_count":1},{"selector":"#c6-focus-unit","role":"value","treatment":"focus.color","expected_count":1},{"selector":"#c6-focus-index","role":"label","treatment":"focus.color","expected_count":1},{"selector":"#c6-focus-label","role":"label","treatment":"focus.color","expected_count":1},{"selector":"#c6-focus-en","role":"label","treatment":"focus.color","expected_count":1}]}]'>
<head>
<meta charset="UTF-8">
<title>layout-c6 · KPI 大数字横带 · AI 成效</title>
<script src="../../../../runtime/stage-fit.js"></script>
<link rel="stylesheet" href="../../../../themes/engine/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/packages/paper-ink/theme.css">
<link rel="stylesheet" href="../../../../themes/packages/hermes-orange/theme.css">
<link rel="stylesheet" href="../../../../themes/packages/klein-blue/theme.css">
<link rel="stylesheet" href="../../../../themes/engine/assets/catalog-fonts.css" data-wise-catalog-fonts="true">
<link rel="stylesheet" href="../../../../themes/engine/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .doc.tl, .folio { color: var(--ink-45); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.wise-ppt.data.kpi-band.kpis" data-content-ref="example.c6">
  <div class="doc tl">PPT 标题<br>页面标题</div>
  <div class="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="caption">上线 18 个月后，调用量、完成率、延迟与覆盖用户共同回答 AI 是否产生真实成效。</div>
</div>

<script src="../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
var DIVIDER = 'var(--wp-color-divider)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (parent || G).appendChild(e); return e;
}
function txt(x, y, str, attrs, parent) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}), parent);
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -7.2)'});

/* ---------- 引子 ---------- */
txt(960, 316, '上线 18 个月 · AI 产品成效总账', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:INK70});
txt(960, 350, 'AI IMPACT · 2026 H1', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});

/* ---------- 主角：通栏大数字横带（x120–1800，y380–640，4 格均分） ---------- */
var cells = [
  {num:'1.28',  unit:'M',  label:'日均调用量', en:'DAILY CALLS'},
  {num:'94.2',  unit:'%',  label:'任务完成率', en:'TASK SUCCESS', focus:true},
  {num:'280',   unit:'ms', label:'平均延迟',   en:'AVG LATENCY'},
  {num:'86,400',unit:'人', label:'覆盖用户数', en:'ACTIVE USERS'}
];
cells.forEach(function(C, i){
  var cx = 120 + 420*i + 210;
  /* 主角判定：第二项任务完成率是全页唯一焦点，编号、数值、中英文标签共同构成完整焦点。 */
  var sampleFocus = Boolean(C.focus);
  /* 格编号 */
  txt(cx, 408, 'No.0' + (i+1), {id:sampleFocus?'c6-focus-index':'', 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill: INK45});
  /* 超大数字 + 降级单位 */
  /* 数值与单位属于同一个居中文本块；混合字号由 SVG 自己量宽，避免按字符数估宽造成偏移。 */
  var metric = el('text', {x:cx, y:532, 'text-anchor':'middle'});
  var number = el('tspan', {id:sampleFocus?'sample-focus':'c6-kpi-'+i, 'font-family':MONO, 'font-size':'var(--type-display)', fill:INK}, metric);
  number.textContent = C.num;
  var unit = el('tspan', {id:sampleFocus?'c6-focus-unit':'', dx:16, 'data-text-kind':'label', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK70}, metric);
  unit.textContent = C.unit;
  /* 中文标签 + mono EN */
  txt(cx, 600, C.label, {id:sampleFocus?'c6-focus-label':'', 'data-text-kind':'label', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:INK});
  txt(cx, 632, C.en, {id:sampleFocus?'c6-focus-en':'', 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill: INK45});
});
/* 格间 0.6px 竖线分隔（无外框） */
[540, 960, 1380].forEach(function(x, i){
  el('line', {id:i===0?'c6-divider':'', x1:x, y1:402, x2:x, y2:636, stroke:DIVIDER, 'stroke-width':.6});
});

/* ---------- 底部 mono 口号行（竖线分隔） ---------- */
var words = ['RETRIEVE', 'REASON', 'GENERATE', 'DELIVER'];
var wx = [762, 908, 1048, 1170];
var sx = [832, 984, 1112];
words.forEach(function(wd, i){
  txt(wx[i], 732, wd, {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK70});
});
sx.forEach(function(x){
  el('line', {x1:x, y1:718, x2:x, y2:736, stroke:DIVIDER, 'stroke-width':.8});
});

stageFit();
</script>
</body>
</html>
