<!DOCTYPE html>
<html data-theme-id="paper-ink" lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-m2" data-page-role="transition" data-theme="paper-ink" data-layout="paper-ink.emotion.quote" data-layout-source="gallery" data-vnext-semantic-key-map='[]' data-emphasis-targets='[]'>
<head>
<meta charset="UTF-8">
<title>layout-m2 · 秩序环过渡页 · AI 工程化之墙</title>
<script src="../../../../runtime/stage-fit.js"></script>
<link rel="stylesheet" href="../../../../themes/engine/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/packages/paper-ink/theme.css">
<link rel="stylesheet" href="../../../../themes/packages/hermes-orange/theme.css">
<link rel="stylesheet" href="../../../../themes/packages/klein-blue/theme.css">
<link rel="stylesheet" href="../../../../themes/engine/assets/catalog-fonts.css" data-wise-catalog-fonts="true">
<link rel="stylesheet" href="../../../../themes/engine/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  canvas.px { position: absolute; inset: 0; z-index: 1; }
  svg.marks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

  /* mono 小标：沿用已接受 custom master 的空间与字阶。 */
  .motif-label {
    position: absolute; left: 0; right: 0; top: 704px;
    text-align: center;
    font-family: var(--mono); font-size: var(--type-body);
    line-height: 1;
    letter-spacing: .38em; text-indent: .38em;
    color: var(--ink-70);
    z-index: 3;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-template-id="M2" data-block-id="gallery-primary" data-renderer-kind="typography" data-component-source="native" data-component-id="native.wise-ppt.emotion.quote.motif-label" data-content-ref="example.m2">
  <div class="doc tl" data-template-part="support" data-template-slot="support" data-template-slot-kind="text">PPT 标题<br>页面标题</div>
  <div class="folio" data-template-part="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <canvas class="px" id="px" data-template-part="canvas" data-template-slot="canvas" data-template-slot-kind="illustration" width="1920" height="1080"></canvas>

  <svg class="marks" data-template-part="marks" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="draw"></g>
  </svg>

  <div class="motif-label" data-template-part="motif-label" data-template-slot="motif-label" data-template-slot-kind="text">A THICK WALL</div>
</div>

<script src="../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
(function(){
  var ctx = document.getElementById('px').getContext('2d');
  var FUNCTIONAL = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-functional').trim();
  if (!FUNCTIONAL) throw new Error('M2 缺少必需的 --wp-color-functional 语义色');
  function focusDot(x, y, r, a) {
    ctx.globalAlpha = a;
    ctx.fillStyle = FUNCTIONAL;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ---------- 四周稀疏静点氛围（避开中央主角与 caption 区） ---------- */
  PART.dust(ctx, 120, 140, 1680, 150, 85, .22);
  PART.dust(ctx, 120, 320, 560, 420, 72, .20);
  PART.dust(ctx, 1240, 320, 560, 420, 72, .20);
  PART.dust(ctx, 120, 730, 1680, 90, 56, .18);

  /* ---------- 小主角：秩序环上一粒侧身让位（版心垂直居中） ---------- */
  var CX = 960, CY = 503.8, R = 138, N = 36, GAP_INDEX = 8, GAP_OFFSET = 56;
  for (var i = 0; i < N; i++) {
    if (i === GAP_INDEX) continue;               // 缺口：让位的那一粒不在环上
    var an = -Math.PI / 2 + i / N * 6.2832;
    var px = CX + Math.cos(an) * R + (PART.rand() - .5) * 1.4;
    var py = CY + Math.sin(an) * R + (PART.rand() - .5) * 1.4;
    focusDot(px, py, 2.4 + PART.rand(), .88 + PART.rand() * .11);
  }
  // 让位的一粒：在缺口外侧偏开一步
  var an5 = -Math.PI / 2 + GAP_INDEX / N * 6.2832;
  var gx = CX + Math.cos(an5) * (R + GAP_OFFSET);
  var gy = CY + Math.sin(an5) * (R + GAP_OFFSET);
  focusDot(gx, gy, 3.2, .98);
  // 环心一粒静止核
  focusDot(CX, CY, 3, .96);
})();

/* ---------- 细线制图标记：让位轨迹（虚线） + 构造环 ---------- */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var FUNCTIONAL = 'var(--wp-color-functional)';
  var G = document.getElementById('draw');
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    G.appendChild(e); return e;
  }
  var CX = 960, CY = 503.8, R = 138, N = 36, GAP_INDEX = 8, GAP_OFFSET = 56;
  var an5 = -Math.PI / 2 + GAP_INDEX / N * 6.2832;
  var ix = CX + Math.cos(an5) * R,  iy = CY + Math.sin(an5) * R;
  var ox = CX + Math.cos(an5) * (R + GAP_OFFSET), oy = CY + Math.sin(an5) * (R + GAP_OFFSET);

  // 构造环（虚线基准，不擦除）
  el('circle', {'data-vnext-visual-key':'m2.order-ring', cx:CX, cy:CY, r:R+18, fill:'none',
    stroke:FUNCTIONAL, 'stroke-width':.7, opacity:.38, 'stroke-dasharray':'2 7'});
  // 让位轨迹：缺口 → 外偏点，虚线 + 中点小圆点
  el('line', {'data-vnext-visual-key':'m2.gap-trail', x1:ix, y1:iy, x2:ox, y2:oy, stroke:FUNCTIONAL,
    'stroke-width':.8, opacity:.62, 'stroke-dasharray':'3 5'});
  el('circle', {'data-vnext-visual-key':'m2.gap-marker', cx:(ix+ox)/2, cy:(iy+oy)/2, r:2.8, fill:FUNCTIONAL, opacity:.9});
})();

stageFit();
</script>
</body>
</html>
