<!DOCTYPE html>
<html lang="zh-CN" data-runtime="wise-ppt-specimen" data-typography-mode="all-sans" data-page-id="gallery-ai-c2" data-page-role="prove" data-theme="paper-ink" data-layout="paper-ink.data.chart-wall" data-layout-source="gallery" data-sample-focus-profile="content-only" data-sample-focus-members='[{"selector":"#c2-focus-value","role":"value"},{"selector":"#c2-focus-bar","role":"outline"},{"selector":"#hatch92-line","role":"texture"}]' data-sample-focus-ref="sample.c2.c2-focus">
<head>
<meta charset="UTF-8">
<title>layout-c2 · 图表联排墙 · 模型基准</title>
<script src="../../../../runtime/stage-fit.js"></script>
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/design-tokens.css">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/catalog-fonts.css" data-wise-catalog-fonts="true">
<link rel="stylesheet" href="../../../../themes/paper-ink/assets/slide-components.css">
<link rel="stylesheet" href="../../../shell.css">
<style>
  svg.scene { position: absolute; inset: 0; z-index: 1; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 118px;
    text-align: center;
    font-family: var(--sans); font-weight: 400;
    font-size: var(--type-caption); letter-spacing: .04em;
    color: var(--ink);
    z-index: 5;
  }
</style>
</head>
<body class="slide">
<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.paper-ink.data.chart-wall.charts" data-content-ref="example.c2">
  <div class="doc tl">PPT 标题<br>页面标题</div>
  <div class="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch33" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink)" stroke-width=".7" opacity=".32"/>
      </pattern>
      <pattern id="hatch92" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line id="hatch92-line" x1="0" y1="0" x2="0" y2="7" stroke="var(--ink)" stroke-width=".7" opacity=".55"/>
      </pattern>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">模型基准不能只看单项峰值，推理、训练与嵌入三类负载共同决定资源表现。</div>
</div>

<script src="../../../../themes/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -39.7)'});


/* ---------- 图表小图题（mono + 短横） ---------- */
function chartTitle(x, y, label){
  txt(x, y, label, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK});
  el('line', {x1:x, y1:y+10, x2:x+210, y2:y+10, stroke:INK, 'stroke-width':.6, opacity:.3});
}

/* ========== 顶图：周准确率趋势折线 ========== */
chartTitle(150, 232, 'CHART 01 — WEEKLY BENCHMARK SCORE');
/* 坐标轴 */
el('line', {x1:200, y1:260, x2:200, y2:490, stroke:INK, 'stroke-width':1, opacity:.6});
el('line', {x1:200, y1:490, x2:1800, y2:490, stroke:INK, 'stroke-width':1, opacity:.6});
[0, 20, 40, 60].forEach(function(v, i){
  var y = 490 - v * 3.833;
  el('line', {x1:194, y1:y, x2:200, y2:y, stroke:INK, 'stroke-width':.8, opacity:.5});
  txt(190, y+4, String(v), {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'end', fill:INK45});
  el('line', {x1:200, y1:y, x2:1800, y2:y, stroke:INK, 'stroke-width':.4, opacity:.15, 'stroke-dasharray':'2 5'});
});
/* 折线 + 数据点 */
var weeks = [31, 34, 33, 38, 42, 41, 47, 52];
var PX = [];
weeks.forEach(function(v, i){
  var x = 300 + i * 200, y = 490 - v * 3.833;
  PX.push([x, y]);
});
var d = 'M ' + PX.map(function(p){ return p[0] + ' ' + p[1]; }).join(' L ');
el('path', {d:d, fill:'none', stroke:INK80, 'stroke-width':1.3});
PX.forEach(function(p, i){
  var isPeak = i === PX.length - 1;
  el('circle', {cx:p[0], cy:p[1], r: isPeak ? 4.5 : 3.5, fill: isPeak ? INK : 'var(--paper)', stroke: isPeak ? INK80 : INK80, 'stroke-width': isPeak ? 1.4 : 1.1});
});
/* 峰值注释 */
var peak = PX[PX.length - 1];
el('line', {x1:peak[0], y1:peak[1]-8, x2:peak[0], y2:256, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'3 4'});
txt(peak[0], 248, 'PEAK 52', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
/* X 轴标签 */
weeks.forEach(function(v, i){
  txt(300 + i * 200, 514, 'W' + String(24 + i), {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'middle', fill:INK45});
});

/* ========== 底左：各任务 benchmark 得分柱图 ========== */
chartTitle(150, 612, 'CHART 02 — TASK BENCHMARK (%)');
/* 整组下移 13px：使底部 Z 标签(ZF) 与 chart03「退货」标签 y 对齐；柱高系数不变 */
var C2BASE = 843, C2YTOP = 653, C2ZLAB = 865;
el('line', {x1:200, y1:C2YTOP, x2:200, y2:C2BASE, stroke:INK, 'stroke-width':1, opacity:.6});
el('line', {x1:200, y1:C2BASE, x2:900, y2:C2BASE, stroke:INK, 'stroke-width':1, opacity:.6});
var zones = [
  {value:92, label:'MMLU', focus:true, contentRef:'sample.c2.chart-wall'},
  {value:87, label:'HEVAL'}, {value:81, label:'GSM8K'},
  {value:76, label:'BBH'}, {value:68, label:'TRUTH'}, {value:61, label:'ARC'}
];
zones.forEach(function(zone, i){
  var x = 240 + i * 108, h = zone.value * 1.9, y = C2BASE - h;
  var fill = zone.focus ? 'url(#hatch92)' : 'none';
  el('rect', {id:zone.focus?'c2-focus-bar':'', x:x, y:y, width:60, height:h, fill:fill, stroke:INK80, 'stroke-width':1.2});
  txt(x + 30, y - 8, String(zone.value) + '%', {id:zone.focus?'c2-focus-value':'', 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'middle', fill:INK});
  txt(x + 30, C2ZLAB, ['MMLU','HEVAL','GSM8K','BBH','TRUTH','ARC'][i], {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'middle', fill:INK45});
});

/* ========== 底右：模型调用构成环图（线稿 donut） ========== */
chartTitle(1010, 612, 'CHART 03 — CALL MIX');
var CCX = 1390, CCY = 745, RO = 86, RI = 52;  /* 右下槽 979+821 水平居中；环图适应槽，不另切空格 */
function seg(ang1, ang2, fill, stroke){
  var a1 = ang1 * Math.PI / 180, a2 = ang2 * Math.PI / 180;
  var ox = CCX + RO * Math.cos(a1), oy = CCY - RO * Math.sin(a1);
  var ix = CCX + RI * Math.cos(a1), iy = CCY - RI * Math.sin(a1);
  var ex = CCX + RO * Math.cos(a2), ey = CCY - RO * Math.sin(a2);
  var ix2 = CCX + RI * Math.cos(a2), iy2 = CCY - RI * Math.sin(a2);
  var large = (a2 - a1) > Math.PI ? 1 : 0;
  el('path', {d:'M '+ix+' '+iy+' L '+ox+' '+oy+' A '+RO+' '+RO+' 0 '+large+' 1 '+ex+' '+ey+
             ' L '+ix2+' '+iy2+' A '+RI+' '+RI+' 0 '+large+' 0 '+ix+' '+iy+' Z',
    fill:fill, stroke:stroke || INK80, 'stroke-width':stroke ? 1.4 : .9});
}
/* 三段：46% / 33% / 21%（从顶部 -90° 起顺时针） */
seg(-90, 75.6, 'url(#hatch33)', null);      /* 推理 46% */
seg(75.6, 194.4, 'none', null);             /* 训练 33% */
seg(194.4, 270, 'none', null);              /* 嵌入 21% */
/* 分隔线 */
[75.6, 194.4].forEach(function(a){
  var rd = a * Math.PI / 180;
  el('line', {x1:CCX + RI * Math.cos(rd), y1:CCY - RI * Math.sin(rd),
              x2:CCX + RO * Math.cos(rd), y2:CCY - RO * Math.sin(rd),
    stroke:INK, 'stroke-width':.8, opacity:.6});
});
/* 中心 */
txt(CCX, CCY - 2, '100%', {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':1, 'text-anchor':'middle', fill:INK});
txt(CCX, CCY + 24, 'N=3 MIX', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
/* 扇区标签（引线 + 数值/名称） */
function segLabel(ang, en, cn, anchor){
  var mid = ang * Math.PI / 180;
  var lx = CCX + 132 * Math.cos(mid), ly = CCY - 132 * Math.sin(mid);
  var rx = CCX + RO * Math.cos(mid), ry = CCY - RO * Math.sin(mid);
  el('line', {x1:rx, y1:ry, x2:lx, y2:ly, stroke:INK, 'stroke-width':.6, opacity:.4, 'stroke-dasharray':'3 4'});
  txt(lx, ly - 6, en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':1, 'text-anchor':anchor, fill:INK});
  txt(lx, ly + 16, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':anchor, fill:INK70});
}
segLabel(-7.2, '46%', '推理', 'middle');
segLabel(135, '33%', '训练', 'middle');
segLabel(232.2, '21%', '嵌入', 'middle');

stageFit();
</script>
</body>
</html>
