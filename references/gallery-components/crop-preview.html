<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>组件本体裁剪预览</title>
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;position:relative;background:#DFE0D9}
  .viewport{position:absolute;inset:0;overflow:hidden}
  .viewport iframe{position:absolute;width:1920px;height:1080px;border:0;transform-origin:0 0;left:0;top:0}
</style>
</head>
<body>
<div class="viewport"><iframe id="stage"></iframe></div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var u=p.get('u')||'';
  var rect=(p.get('rect')||'200,210,1520,670').split(',').map(Number);
  var f=document.getElementById('stage');
  if(u)f.src=u;
  function fit(){
    var x=rect[0],y=rect[1],w=rect[2],h=rect[3];
    if(!w||!h)return;
    var s=Math.min(1280/w,720/h);
    f.style.transform='translate('+((1280-w*s)/2-x*s)+'px,'+((720-h*s)/2-y*s)+'px) scale('+s+')';
  }
  window.addEventListener('load',fit);
  window.addEventListener('resize',fit);
  fit();
})();
</script>
</body>
</html>
