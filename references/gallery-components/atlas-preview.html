<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Atlas 组件预览</title>
<link rel="stylesheet" href="../../themes/paper-ink/assets/design-tokens.css">
<script src="../themes/paper-ink/adapters/atlas.js"></script>
<script src="ppt-component-atlas/catalog-data.js"></script>
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;position:relative;background:var(--wp-color-surface-canvas,#DFE0D9)}
  .swiss-card{border-radius:0 !important;margin:0 !important;flex-shrink:0 !important}
</style>
</head>
<body>
<script>
(function(){
  var num=Number(new URLSearchParams(location.search).get('num')||0);
  var data=window.SWISS_CATALOG_DATA||{entries:[]};
  var e=data.entries.find(function(x){return x.num===num;});
  if(!e){document.body.textContent='组件 #'+num+' 不存在';return;}

  var adapter=(window.WisePPTThemeAdapters||{})['paper-ink.atlas'];
  var css=adapter?adapter.adaptCss(data.componentCss||''):(data.componentCss||'');
  var overrides=(adapter&&adapter.COMPONENT_OVERRIDES)||'';
  var motion=data.componentMotionCss||'';
  var st=document.createElement('style');
  st.textContent=css+motion+overrides;
  document.head.appendChild(st);

  var snippet=adapter?adapter.adaptMarkup(e.snippet||''):(e.snippet||'');
  document.body.insertAdjacentHTML('beforeend',snippet);

  /* 场馆 1280×720,组件原尺寸居中,仅超界缩小 */
  function fit(){
    var el=document.querySelector('.swiss-card')||document.body;
    el.style.transform='none';
    var w=el.offsetWidth||600,h=el.offsetHeight||600;
    var s=Math.min(1280/w,720/h,1);
    el.style.transformOrigin='0 0';
    el.style.transform='scale('+s+')';
    el.style.position='absolute';
    el.style.margin='0';
    el.style.left=((1280-w*s)/2)+'px';
    el.style.top=((720-h*s)/2)+'px';
  }
  window.addEventListener('load',function(){setTimeout(fit,60);});
  window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
