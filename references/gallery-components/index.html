  <script>
    (function resolveGalleryTheme() {
      let themeId = 'paper-ink';
      try {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get('theme');
        if (requested === 'paper-ink' || requested === 'swiss') themeId = requested;
        else if (params.get('style') === 'swiss') themeId = 'swiss';
        document.documentElement.classList.toggle('accent', params.get('emphasis') === 'accent');
      } catch (err) {}
      window.WISE_PPT_GALLERY_THEME = themeId;
      document.documentElement.dataset.theme = themeId;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.dataset.wisePptThemeTokens = themeId;
      link.href = `../../themes/${themeId}/assets/design-tokens.css`;
      document.head.appendChild(link);
    })();

      <h1 class="page-title" style="display:flex;align-items:center;gap:0.5rem;"><a id="back-link" href="../" title="返回" style="display:inline-flex;color:var(--gallery-color-text-muted);text-decoration:none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>HTML PPT组件</h1>

      <div class="project-meta">
        <a class="meta-pill" href="https://github.com/WiseWong6/wise-labs" target="_blank" rel="noopener noreferrer">

          源代码

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 7l8 4 8-4-8-4Z"/><path d="M4 11l8 4 8-4"/><path d="M4 15l8 4 8-4"/></svg>

    <div class="filter-controls" id="filterControls">
      <nav class="filter-bar" id="filterBar"></nav>

        <label class="search-input-wrap" for="componentSearch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="component-search" id="componentSearch" type="search" placeholder="搜索组件名称、英文名或分类" autocomplete="off" spellcheck="false">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>

  <script src="../../capabilities/vendors/ppt-component-atlas/catalog-data.js"></script>
  <script src="../../capabilities/layouts/paper-ink-components.js?v=6"></script>
  <script src="../../themes/paper-ink/adapters/atlas.js?v=4"></script>
  <script src="../../themes/swiss/adapters/atlas.js"></script>
  <script src="../../themes/paper-ink/adapters/native.js"></script>
  <script src="../../themes/swiss/adapters/native.js"></script>
  <script src="./paper-ink-adapter.js?v=2"></script>
  <script src="./echarts-catalog-data.js"></script>
  <script>
    // ===== Data =====
    const DATA = window.SWISS_CATALOG_DATA;
    const PI_DATA = window.PAPER_INK_COMPONENT_DATA || { componentCss: '', entries: [] };
    const MODAL_TRANSITION_MS = 180;
    const PREVIEW_PARAMS = new URLSearchParams(window.location.search);
    const THEME_ID = window.WISE_PPT_GALLERY_THEME || 'paper-ink';
    const EMPHASIS_MODE = PREVIEW_PARAMS.get('emphasis') === 'accent' ? 'accent' : 'none';
    document.documentElement.dataset.theme = THEME_ID;
    document.documentElement.classList.toggle('accent', EMPHASIS_MODE === 'accent');
    // taxonomyEmbed：统一语义画册把本页嵌入为组件预览帧。file:// 下父页面
    // 无法跨源注入样式（DOM 访问被浏览器拦截），嵌入外壳必须由本页自己应用；
    // 规则与 gallery/taxonomy/app.js 的同名注入保持一致（同 id，父页面检测到
    // 已存在即跳过，不会重复注入）。
    if (PREVIEW_PARAMS.get('taxonomyEmbed')) {
      const embedStyle = document.createElement('style');
      embedStyle.id = 'taxonomy-embed-style';
      embedStyle.textContent = [
        'html, body, .shell, #detailView, .detail-panel, .detail-panel-body, .detail-preview { width: 100% !important; height: 100% !important; max-width: none !important; }',
        'html, body { overflow: hidden !important; }',
        '.shell { margin: 0 !important; padding: 0 !important; }',
        '.detail-view { padding: 0 !important; overflow: hidden !important; }',
        '.detail-panel { margin: 0 !important; border: 0 !important; border-radius: 0 !important; }',
        '.detail-panel-body[data-view-panel="preview"] { display: block !important; }',
        '.detail-header, .detail-panel-header, .detail-source, .detail-nav, #back-to-top { display: none !important; }'
      ].join('\n');
      document.head.appendChild(embedStyle);
    }
    const ADAPTERS = window.WisePPTThemeAdapters || {};
    const ATLAS_ADAPTER = ADAPTERS[`${THEME_ID}.atlas`];
    const NATIVE_ADAPTER = ADAPTERS[`${THEME_ID}.native-components`];
    if (!ATLAS_ADAPTER || !NATIVE_ADAPTER) {
      throw new Error(`Theme adapters failed to load: ${THEME_ID}`);
    }

    function adaptComponentCss(source) {
      return ATLAS_ADAPTER.adaptCss(source);
    }

    function adaptComponentMarkup(source) {
      return ATLAS_ADAPTER.adaptMarkup(source);
    }

    function adaptComponentHtml(source) {
      return ATLAS_ADAPTER.adaptHtml(source);
    }

    const COMPONENT_CSS = adaptComponentCss(DATA.componentCss);
    // Motion orchestration is not a theme target. Keep the catalog layer byte-for-byte.
    const COMPONENT_MOTION_CSS = DATA.componentMotionCss || '';
    // Paper Ink 原生组件的共享样式已是纸墨语言，原样注入、不过 adapter
    const PI_COMPONENT_CSS = PI_DATA.componentCss || '';
    // 纸墨原生组件动效层：同样原样注入，与 COMPONENT_MOTION_CSS 并存（选择器互不重叠）
    const PI_MOTION_CSS = PI_DATA.componentMotionCss || '';
    const THEME_ADAPTER_CSS = [ATLAS_ADAPTER.themeCss, NATIVE_ADAPTER.themeCss].filter(Boolean).join('\n');
    const THEME_COMPONENT_OVERRIDES = ATLAS_ADAPTER.COMPONENT_OVERRIDES || '';
    const entries = DATA.entries.concat(PI_DATA.entries || []);
    const retiredProductionComponentIds = new Set(['atlas.001.cover']);

    // ===== ECharts 组件并入（原独立 echarts 画册已下线，数据/渲染迁移至此） =====
    // 渲染走 echarts-frame.html（src iframe）；静态视觉只取正式 Theme adapter，
    // echarts-theme-adapter.js 仅保留画册预览几何与本地动效预览，不进入 Theme/Runtime 合同。
    // 源码/复制/下载给出 deck 可嵌入的 snippet + init_script（与旧画册行为一致）。
    const ECHARTS_DATA = window.WISE_PPT_ECHARTS_GALLERY_DATA;
    const ECHARTS_BASE_NUM = entries.reduce((max, e) => Math.max(max, e.num || 0), 0);

    function bindEchartsThemeSource(item) {
      const source = `${item.snippet}\n${item.init_script}`;
      const sourceAdapterId = item.render_plan_binding && item.render_plan_binding.theme_adapter_id;
      const sourceMarker = `data-theme-adapter-id="${sourceAdapterId}"`;
      const targetMarker = `data-theme-adapter-id="${THEME_ID}.echarts"`;
      const occurrences = sourceAdapterId ? source.split(sourceMarker).length - 1 : 0;
      if (occurrences !== 1) {
        throw new Error(`ECharts ${item.component_id} 缺少唯一主题绑定`);
      }
      return source.replace(sourceMarker, targetMarker);
    }

    // 视觉形制族：与生产组件路由一致的主分组；tree/sankey 两个非指标类图表单列。
    const ECHARTS_GROUP_OVERRIDES = {
      'echarts.tree-lr': { group: 'hierarchy-structure', groupLabel: '层级与结构' },
      'echarts.sankey-basic': { group: 'relation-mapping', groupLabel: '关系与映射' },
      'echarts.geo-choropleth-map': { group: 'relation-mapping', groupLabel: '关系与映射' }
    };
    // 来源文案与 atlas 既有口径一致（radar-hex → "ECharts Radar 参考"），按图表族生成，链接逐组件指向官方示例。
    const ECHARTS_SOURCE_FAMILIES = { line: 'Line', bar: 'Bar', pie: 'Pie', scatter: 'Scatter', radar: 'Radar', tree: 'Tree', sankey: 'Sankey', calendar: 'Calendar', geo: 'Map' };
    function echartsSourceName(componentId) {
      const family = String(componentId).replace(/^echarts\./, '').split('-')[0];
      return `ECharts ${ECHARTS_SOURCE_FAMILIES[family] || family} 参考`;
    }
    const ECHARTS_ENTRIES = ((ECHARTS_DATA && ECHARTS_DATA.components) || []).map((item, index) => ({
      name: item.component_id,
      label: item.name,
      num: ECHARTS_BASE_NUM + index + 1,
      variant: null,
      group: (ECHARTS_GROUP_OVERRIDES[item.component_id] || {}).group || 'metric-data',
      groupLabel: (ECHARTS_GROUP_OVERRIDES[item.component_id] || {}).groupLabel || '指标与数据',
      routeGroup: 'echarts',
      description: [item.selection_notes, ...(item.aliases || [])].filter(Boolean).join(' '),
      source: { name: echartsSourceName(item.component_id), label: 'ECharts 参考', url: item.source_url },
      echartsId: item.component_id,
      echartsSource: bindEchartsThemeSource(item),
      frame: item.preview_frame || { width: 600, height: 600, fit: 'fixed' }
    }));
    entries.push(...ECHARTS_ENTRIES);

    function echartsFrameUrl(entry, mode) {
      return `./echarts-frame.html?id=${encodeURIComponent(entry.echartsId)}&theme=${THEME_ID}&emphasis=${EMPHASIS_MODE}&mode=${mode}&motion=${state.motion ? '1' : '0'}`;
    }

    function slugComponentPart(value) {
      return String(value || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function buildComponentId(entry) {
      const parts = [
        entry.routeGroup || entry.group,
        entry.name,
        entry.variant || 'default'
      ].map(slugComponentPart).filter(Boolean);
      return parts.join('-') || `component-${entry.num}`;
    }

    const componentIdCounts = new Map();
    entries.forEach(entry => {
      const baseId = buildComponentId(entry);
      const count = componentIdCounts.get(baseId) || 0;
      componentIdCounts.set(baseId, count + 1);
      entry.componentId = count > 0 ? `${baseId}-${entry.num}` : baseId;
    });
    for (let index = entries.length - 1; index >= 0; index -= 1) {
      const entry = entries[index];
      const productionId = entry.routeGroup === 'echarts'
        ? entry.echartsId
        : entry.num <= 61
          ? `atlas.${String(entry.num).padStart(3, '0')}.${entry.name}${entry.variant ? `.${entry.variant}` : ''}`
          : null;
      if (retiredProductionComponentIds.has(productionId)) entries.splice(index, 1);
    }
    const entriesByComponentId = new Map(entries.map(entry => [entry.componentId, entry]));

    // Category order — 七个视觉形制族固定顺序，其后动态追加新组
    const GROUP_ORDER = ['证据与媒体', '指标与数据', '流程与时序', '对比与对照', '层级与结构', '关系与映射', '文档与文本'];
    const CAT_ORDER = GROUP_ORDER.filter(g => entries.some(e => e.groupLabel === g))
      .concat([...new Set(entries.map(e => e.groupLabel))].filter(g => g && !GROUP_ORDER.includes(g)));


    // ===== Motion Mode（动态/静态） =====
    const MOTION_STORAGE_KEY = 'htmlPptMotion';
    function getInitialMotion() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('motion') === '0') return false;
        if (params.get('motion') === '1') return true;
        const saved = window.localStorage.getItem(MOTION_STORAGE_KEY);
        if (saved === '0') return false;
        if (saved === '1') return true;
      } catch (err) {}
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
      return true;
    }

    // ===== State =====
    const state = {
      activeGroup: null,
      search: '',
      layout: null,    // entry num for detail view
      lastGridScrollTop: 0,
      lastGridCardKey: null,
      detailOpenedFromGrid: false,
      restoreGridScrollTop: 0,
      restoreGridCardKey: null,
      pendingGridRestore: false,
      page: 1,
      motion: getInitialMotion(),
      detailTab: 'preview'
    };

    // ===== DOM refs =====
    const filterControlsEl = document.getElementById('filterControls');
    const filterBarEl = document.getElementById('filterBar');
    const searchBarEl = document.getElementById('searchBar');
    const componentSearchEl = document.getElementById('componentSearch');
    const gridViewEl = document.getElementById('gridView');
    const detailViewEl = document.getElementById('detailView');
    const paginationEl = document.getElementById('pagination');
    const PAGE_SIZE = 12;

    function requestParentClose() {
      if (window.parent === window) return false;
      try {
        if (typeof window.parent.closeTab === 'function') {
          window.parent.closeTab();
          return true;
        }
      } catch (err) {}
      try {
        window.parent.postMessage({ type: 'close-tab' }, '*');
        return true;
      } catch (err) {}
      return false;
    }

    const backLink = document.getElementById('back-link');
    if (backLink) {
      backLink.addEventListener('click', (event) => {
        if (!requestParentClose()) return;
        event.preventDefault();
      });
    }

    function switchTheme(nextTheme) {
      if (!['paper-ink', 'swiss'].includes(nextTheme) || nextTheme === THEME_ID) return;
      const url = new URL(window.location.href);
      url.searchParams.set('theme', nextTheme);
      url.searchParams.delete('style');
      window.location.assign(url.toString());
    }

    const themeSwitchButtons = [...document.querySelectorAll('[data-theme-value]')];
    themeSwitchButtons.forEach(button => {
      const isActive = button.dataset.themeValue === THEME_ID;
      button.setAttribute('aria-pressed', String(isActive));
      button.addEventListener('click', () => switchTheme(button.dataset.themeValue));
      button.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        switchTheme(event.key === 'ArrowLeft' ? 'paper-ink' : 'swiss');
      });
    });

    // ===== Helpers =====
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getCardKey(entry) {
      return `${entry.name}::${entry.variant || 'default'}`;
    }

    function getCurrentCardKey() {
      if (!state.layout) return null;
      const entry = entries.find(e => e.num === state.layout);
      return entry ? getCardKey(entry) : null;
    }

    function getComponentIdByLayout(layout) {
      const entry = entries.find(e => e.num === layout);
      return entry ? entry.componentId : null;
    }

    function getCurrentComponentId() {
      return getComponentIdByLayout(state.layout);
    }

    function getSourceLabel(source) {
      if (!source) return '';
      return [source.name, source.label].filter(Boolean).join(' ');
    }

    function normalizeSearchText(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[\s_-]+/g, '')
        .trim();
    }

    function getSearchCorpus(entry) {
      return [
        entry.label,
        entry.name,
        entry.variant,
        entry.group,
        entry.groupLabel,
        entry.description,
        getSourceLabel(entry.source)
      ].filter(Boolean).join(' ');
    }

    function getPageScrollTop() {
      return window.scrollY || document.documentElement.scrollTop || 0;
    }

    function setPageScrollTop(top) {
      window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
    }

    // 内容密度补偿（内容层）：wrapped 流程链在卡内重排为 3×2 网格；组件固有画布 744 宽，见 FRAME_OVERRIDES
    const WRAPPED_FLOW_CSS = adaptComponentCss(`
    .swiss-card .process-chain[data-type="wrap"] {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, auto);
      grid-template-areas:
        "s1 s2 s3"
        "s6 s5 s4";
      gap: 24px 32px;
      position: relative;
      padding: 10px 20px;
      overflow: visible;
    }
    .swiss-card .process-chain[data-type="wrap"] .step {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      background: color-mix(in srgb, var(--wp-color-focus) 8%, transparent);
      border: 2px solid var(--wp-color-focus);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .swiss-card .process-chain[data-type="wrap"] .arrow {
      display: none;
    }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(1) { grid-area: s1; }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(3) { grid-area: s2; }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(5) { grid-area: s3; }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(7) { grid-area: s4; }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(9) { grid-area: s5; }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(11) { grid-area: s6; }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(1)::after,
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(3)::after {
      content: '→';
      position: absolute;
      right: -26px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--wp-color-focus);
      font-size: 16px;
      font-weight: 700;
    }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(5)::after {
      content: '↓';
      position: absolute;
      left: 50%;
      bottom: -26px;
      transform: translateX(-50%);
      color: var(--wp-color-focus);
      font-size: 16px;
      font-weight: 700;
    }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(7)::after,
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(9)::after {
      content: '←';
      position: absolute;
      left: -26px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--wp-color-focus);
      font-size: 16px;
      font-weight: 700;
      z-index: 2;
    }
    .swiss-card .process-chain[data-type="wrap"] .step:nth-child(11)::before {
      content: '↑';
      position: absolute;
      left: 50%;
      top: -26px;
      transform: translateX(-50%);
      color: var(--wp-color-focus);
      font-size: 16px;
      font-weight: 700;
      z-index: 2;
    }`);

    // ===== Motion Select（动态/静态下拉切换） =====
    const MOTION_ICON_PLAY = '<polygon points="6 3 20 12 6 21 6 3"/>';
    const MOTION_ICON_PAUSE = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    const MOTION_SELECT_HTML = `
      <div class="motion-select" data-motion-select>
        <button type="button" class="motion-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="组件动效模式">
          <svg class="motion-select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MOTION_ICON_PLAY}</svg>
          <span class="motion-select-label">动态</span>
          <svg class="motion-select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="motion-select-menu" role="listbox" aria-label="组件动效模式" hidden>
          <button type="button" class="motion-select-option" data-motion="1" role="option" aria-selected="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MOTION_ICON_PLAY}</svg>
            <span>动态</span>
            <svg class="motion-select-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <button type="button" class="motion-select-option" data-motion="0" role="option" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MOTION_ICON_PAUSE}</svg>
            <span>静态</span>
            <svg class="motion-select-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
        </div>
      </div>`;

    function closeMotionSelects() {
      document.querySelectorAll('[data-motion-select].open').forEach(sel => {
        sel.classList.remove('open');
        const menu = sel.querySelector('.motion-select-menu');
        if (menu) menu.hidden = true;
        const trigger = sel.querySelector('.motion-select-trigger');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
      });
    }

    function syncMotionToggleUI() {
      document.querySelectorAll('[data-motion-select]').forEach(sel => {
        const label = sel.querySelector('.motion-select-label');
        if (label) label.textContent = state.motion ? '动态' : '静态';
        const icon = sel.querySelector('.motion-select-icon');
        if (icon) icon.innerHTML = state.motion ? MOTION_ICON_PLAY : MOTION_ICON_PAUSE;
        sel.querySelectorAll('.motion-select-option').forEach(opt => {
          const isActive = (opt.dataset.motion === '1') === state.motion;

    // ===== Preview Doc Builder =====

    function getSourceStyleOverrides(entry) {
      return [

    function injectThemeStylesheet(html) {
      if (!html.includes('</head>')) return html;
      const link = `<link rel="stylesheet" href="../../themes/${THEME_ID}/assets/design-tokens.css">`;
      return html.replace('</head>', `${link}\n</head>`);

    function injectStyleOverrides(html, overrides) {
      if (!overrides || !html.includes('</style>')) return html;
      return html.replace('</style>', `${overrides}\n</style>`);
    }

    function buildSourceDoc(entry, previewDoc) {
      if (!entry.copyHtml) return previewDoc;
      const adapted = injectStyleOverrides(adaptComponentHtml(entry.copyHtml), getSourceStyleOverrides(entry));
      return injectThemeStylesheet(adapted);

    function sanitizeFilenamePart(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9\u4e00-\u9fa5-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function getDownloadFilename(entry) {
      const name = sanitizeFilenamePart(entry.name) || 'component';
      const suffix = sanitizeFilenamePart(entry.variant || entry.num) || String(entry.num);
      return `html-ppt-${name}-${suffix}${state.motion ? '-animated' : ''}.html`;
    }

    // ===== 统一尺寸契约 =====
    // 组件声明固有画布（entry.frame），容器做等比 contain-fit。
    // 生产 slot 默认不放大；taxonomy 审阅壳可显式传 previewScale=fill，
    // 让同一矢量/HTML 组件充分利用审阅画布，不改变导出尺寸合同。
    // vendored atlas 不可逐字节改动，非 600×600 的固有画布在此覆盖（键：name/variant 或 name）。
    const FRAME_OVERRIDES = {
      'process/wrapped': { width: 744, height: 600, fit: 'fixed' }
    };
    const DEFAULT_FRAME = { width: 600, height: 600, fit: 'fixed' };

    function resolveEntryFrame(entry) {
      const declared = entry && entry.frame;
      if (declared && declared.width > 0 && declared.height > 0) {
        return { fit: 'fixed', ...declared };
      }
      if (entry) {
        const override = FRAME_OVERRIDES[`${entry.name}/${entry.variant}`] || FRAME_OVERRIDES[entry.name];
        if (override) return { fit: 'fixed', ...override };
      }
      return { ...DEFAULT_FRAME };
    }

    // 统一 fit：iframe 按固有画布尺寸创建，transform 等比缩小适配容器
    function fitIframeToBox(iframe, box) {
      const frame = iframe._frame;
      if (!frame || !box) return;
      const containerW = box.offsetWidth || frame.width;
      const containerH = box.offsetHeight || frame.height;
      const allowPreviewUpscale = PREVIEW_PARAMS.get('previewScale') === 'fill';
      const scale = Math.min(
        containerW / frame.width,
        containerH / frame.height,
        allowPreviewUpscale ? Number.POSITIVE_INFINITY : 1
      );
      iframe.style.transform = `scale(${scale})`;
    }

    function createFramedIframe(frame) {
      const iframe = document.createElement('iframe');
      iframe._frame = frame;
      iframe.style.width = `${frame.width}px`;
      iframe.style.height = `${frame.height}px`;
      return iframe;
    }

    // load 后按内容自然尺寸回补 frame（消化 min-height 生长等未声明的溢出）
    function growFrameFromContent(iframe, box) {
      try {
        const card = iframe.contentDocument && iframe.contentDocument.querySelector('.swiss-card, .pi-card');
        if (!card) return;
        const frame = iframe._frame;
        const w = Math.ceil(card.offsetWidth);
        const h = Math.ceil(card.offsetHeight);
        if (w > frame.width || h > frame.height) {
          iframe._frame = { ...frame, width: Math.max(frame.width, w), height: Math.max(frame.height, h) };
          iframe.style.width = `${iframe._frame.width}px`;
          iframe.style.height = `${iframe._frame.height}px`;
          fitIframeToBox(iframe, box);
        }
      } catch (err) { /* srcdoc 同源，防御性兜底 */ }
    }

    function downloadSourceDoc(sourceDoc, filename) {
      const blob = new Blob([sourceDoc], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => { URL.revokeObjectURL(url); }, 1000);
    }

    function initSkillOffsiteConfirm() {

          <div class="offsite-modal-actions">

      function openModal() {

    // ===== Mind Map Connector Sync =====
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function getElementScale(el) {
      const transform = getComputedStyle(el).transform;
      if (!transform || transform === 'none') return 1;
      const matrixMatch = transform.match(/matrix\(([^)]+)\)/);
      if (matrixMatch) {
        const values = matrixMatch[1].split(',').map(v => Number.parseFloat(v.trim()));
        if (values.length >= 2) return Math.hypot(values[0], values[1]) || 1;
      }
      return 1;
    }

    function toLocalRect(el, containerRect, scale) {
      const rect = el.getBoundingClientRect();
      const left = (rect.left - containerRect.left) / scale;
      const top = (rect.top - containerRect.top) / scale;
      const width = rect.width / scale;
      const height = rect.height / scale;
      return { left, top, width, height, right: left + width, bottom: top + height, centerX: left + width / 2, centerY: top + height / 2 };
    }

    function createSvgOverlay(doc, mm, width, height) {
      let overlay = mm.querySelector(':scope > .mind-map-overlay');
      if (!overlay) {
        overlay = doc.createElementNS(SVG_NS, 'svg');
        overlay.setAttribute('class', 'mind-map-overlay');
        overlay.setAttribute('aria-hidden', 'true');
        mm.appendChild(overlay);
      }
      overlay.replaceChildren();
      overlay.setAttribute('viewBox', `0 0 ${width} ${height}`);
      return overlay;
    }

    function syncIframeMindMap(iframe) {
      const run = () => {
        if (!iframe.isConnected) return;
        const doc = iframe.contentDocument;
        if (!doc || doc.readyState !== 'complete') { requestAnimationFrame(run); return; }
        syncMindMapConnectors(doc);
      };
      requestAnimationFrame(run);
    }

    function appendLine(svg, x1, y1, x2, y2) {
      if (![x1, y1, x2, y2].every(Number.isFinite)) return;
      const line = svg.ownerDocument.createElementNS(SVG_NS, 'line');
      line.setAttribute('class', 'mind-map-line');
      line.setAttribute('x1', String(x1));
      line.setAttribute('y1', String(y1));
      line.setAttribute('x2', String(x2));
      line.setAttribute('y2', String(y2));
      svg.appendChild(line);
    }

    function syncMindMapConnectors(doc) {
      if (!doc) return;
      doc.querySelectorAll('.mind-map').forEach(mm => {
        const mmRect = mm.getBoundingClientRect();
        if (!mmRect.width || !mmRect.height) return;
        const scale = getElementScale(mm);
        const width = mmRect.width / scale;
        const height = mmRect.height / scale;
        const svg = createSvgOverlay(doc, mm, width, height);
        const rootNode = mm.querySelector(':scope > .root-node');
        const branches = mm.querySelector('.branches');
        if (!rootNode || !branches) return;

        const branchNodes = Array.from(branches.querySelectorAll(':scope > .branch'))
          .map(branch => {
            const node = branch.querySelector(':scope > .node');
            return node ? { branch, node, nodeRect: toLocalRect(node, mmRect, scale) } : null;
          })
          .filter(Boolean);
        if (!branchNodes.length) return;

        const rootRect = toLocalRect(rootNode, mmRect, scale);
        const branchesRect = toLocalRect(branches, mmRect, scale);

        if (mm.dataset.type === 'vertical') {
          const branchGap = 24;
          const branchLeft = Math.min(...branchNodes.map(item => item.nodeRect.left));
          const spineX = Math.max(rootRect.right + 20, branchLeft - branchGap);
          const spineTop = Math.min(...branchNodes.map(item => item.nodeRect.centerY));
          const spineBottom = Math.max(...branchNodes.map(item => item.nodeRect.centerY));
          appendLine(svg, rootRect.right, rootRect.centerY, spineX, rootRect.centerY);
          appendLine(svg, spineX, spineTop, spineX, spineBottom);
          branchNodes.forEach(({ branch, nodeRect }) => {
            appendLine(svg, spineX, nodeRect.centerY, nodeRect.left, nodeRect.centerY);
            const subBranches = branch.querySelector(':scope > .sub-branches');
            if (!subBranches) return;
            const subNodes = Array.from(subBranches.querySelectorAll(':scope > .sub-node'))
              .map(subNode => toLocalRect(subNode, mmRect, scale));
            if (!subNodes.length) return;
            const subGap = 24;
            const subLeft = Math.min(...subNodes.map(sub => sub.left));
            const subSpineX = Math.max(nodeRect.right + 18, subLeft - subGap);
            const subSpineTop = Math.min(nodeRect.centerY, ...subNodes.map(sub => sub.centerY));
            const subSpineBottom = Math.max(nodeRect.centerY, ...subNodes.map(sub => sub.centerY));
            appendLine(svg, nodeRect.right, nodeRect.centerY, subSpineX, nodeRect.centerY);
            appendLine(svg, subSpineX, subSpineTop, subSpineX, subSpineBottom);
            subNodes.forEach(subNodeRect => {
              appendLine(svg, subSpineX, subNodeRect.centerY, subNodeRect.left, subNodeRect.centerY);
            });
          });
        } else {
          const firstNodeRect = branchNodes[0].nodeRect;
          const lastNodeRect = branchNodes[branchNodes.length - 1].nodeRect;
          const spineY = branchesRect.top;
          appendLine(svg, rootRect.centerX, rootRect.bottom, rootRect.centerX, spineY);
          appendLine(svg, firstNodeRect.centerX, spineY, lastNodeRect.centerX, spineY);
          branchNodes.forEach(({ nodeRect }) => {
            appendLine(svg, nodeRect.centerX, spineY, nodeRect.centerX, nodeRect.top);
          });
        }

        mm.setAttribute('data-connectors-ready', 'true');
      });
    }

    // ===== Filtering =====
    // Unique entries — one card per entry (entry = layout + variant combo)
    function getUniqueEntries() {
      return entries;
    }

    function matchesFilter(entry) {
      if (state.activeGroup && entry.groupLabel !== state.activeGroup) return false;
      const query = normalizeSearchText(state.search);
      if (!query) return true;
      return normalizeSearchText(getSearchCorpus(entry)).includes(query);
    }

    function getFilteredEntries() {
      return getUniqueEntries().filter(matchesFilter);
    }

    // ===== Icon System =====
    function makeIcon(size, paths) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
    }
    // 7 visually distinct icons — one per group
    const ICON_PATHS = {
      '流程与时序': '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 01-9 9"/>',
      '层级与结构': '<circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/>',
      '对比与对照': '<rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/>',
      '文档与文本': '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
      '指标与数据': '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
      '证据与媒体': '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
      '关系与映射': '<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',
    };
    const DEFAULT_ICON_PATH = '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>';

    function renderFilterBar() {
      const groups = {};
      entries.forEach(e => { groups[e.groupLabel] = (groups[e.groupLabel] || 0) + 1; });

      let html = '';
      const totalCount = entries.length;
      html += `<button class="filter-btn${!state.activeGroup ? ' active' : ''}" data-filter="">
        全部 <span class="filter-count">${totalCount}</span></button>`;

      CAT_ORDER.forEach(cat => {
        if (!groups[cat]) return;
        const icon = makeIcon(14, ICON_PATHS[cat] || DEFAULT_ICON_PATH);
        html += `<button class="filter-btn${state.activeGroup === cat ? ' active' : ''}" data-filter="${esc(cat)}">
          ${icon}${esc(cat)} <span class="filter-count">${groups[cat]}</span></button>`;
      });
      filterBarEl.innerHTML = html;

      filterBarEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeGroup = btn.dataset.filter || null;
          state.page = 1;
          updateFilterHighlight();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderGrid();
        });
      });
    }

    function updateFilterHighlight() {
      filterBarEl.querySelectorAll('.filter-btn').forEach(btn => {
        const isActive = btn.dataset.filter === (state.activeGroup || '');
        btn.classList.toggle('active', isActive);
      });
    }

    // ===== Grid View =====
    function renderGrid() {
      const filtered = getFilteredEntries();
      if (filtered.length === 0) {
        gridViewEl.innerHTML = '<div class="empty-state">没有匹配的组件。</div>';
        paginationEl.style.display = 'none';
        return;
      }

      // Pagination
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (state.page > totalPages) state.page = totalPages;
      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      let html = '<div class="thumb-grid">';
      pageItems.forEach(entry => {
        const cardKey = getCardKey(entry);
        const displayLabel = esc(entry.label);
        const previewFrame = resolveEntryFrame(entry);
        html += `<div class="thumb-card" data-num="${entry.num}" data-card-key="${esc(cardKey)}">
          <div class="thumb-preview" data-num="${entry.num}" style="aspect-ratio:${previewFrame.width} / ${previewFrame.height}"></div>
          <div class="thumb-label">
            <span class="thumb-name">${displayLabel}</span>
          </div>
        </div>`;
      });
      html += '</div>';

      gridViewEl.innerHTML = html;

      // Render pagination
      renderPagination(totalPages);

      // Lazy-load iframes（统一尺寸契约：固有画布 + contain-fit）
      requestAnimationFrame(() => {
        gridViewEl.querySelectorAll('.thumb-preview[data-num]').forEach(el => {
          const num = parseInt(el.dataset.num);
          const entry = entries.find(e => e.num === num);
          if (!entry) return;
          const iframe = createFramedIframe(resolveEntryFrame(entry));
          iframe.loading = 'lazy';
          iframe.addEventListener('load', () => {
            syncMindMapConnectors(iframe.contentDocument);
            growFrameFromContent(iframe, el);
          });
          if (entry.echartsId) iframe.src = echartsFrameUrl(entry, 'grid');
          else iframe.srcdoc = buildPreviewDoc(entry);
          el.appendChild(iframe);
          fitIframeToBox(iframe, el);
          syncIframeMindMap(iframe);
        });
      });

      // Bind card clicks
      gridViewEl.querySelectorAll('.thumb-card').forEach(card => {
        card.addEventListener('click', () => {
          const num = parseInt(card.dataset.num);
          state.lastGridScrollTop = getPageScrollTop();
          state.lastGridCardKey = card.dataset.cardKey;
          state.detailOpenedFromGrid = true;
          commitHistory('replace', createSnapshot('grid', { cardKey: card.dataset.cardKey, scrollTop: getPageScrollTop() }));
          state.layout = num;
          state.pendingGridRestore = false;
          commitHistory('push', createSnapshot('detail', { cardKey: card.dataset.cardKey, componentId: getComponentIdByLayout(num), fromGrid: true }));
          render();
        });
      });
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        paginationEl.style.display = 'none';
        return;
      }
      paginationEl.style.display = 'flex';
      let html = `<button class="filter-btn" data-page="prev" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>`;
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="filter-btn${p === state.page ? ' active' : ''}" data-page="${p}">${p}</button>`;
      }
      html += `<button class="filter-btn" data-page="next" ${state.page >= totalPages ? 'disabled' : ''}>下一页</button>`;
      paginationEl.innerHTML = html;

      paginationEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.page;
          if (p === 'prev' && state.page > 1) state.page--;
          else if (p === 'next' && state.page < totalPages) state.page++;
          else if (p !== 'prev' && p !== 'next') state.page = parseInt(p);
          else return;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderGrid();
        });
      });
    }

    // ===== Detail View =====
    function renderDetail() {
      const entry = entries.find(e => e.num === state.layout);
      if (!entry) {
        state.layout = null;
        commitHistory('replace', createSnapshot('grid'));
        render();
        return;
      }

      const previewDoc = entry.echartsId ? '' : buildPreviewDoc(entry, 'detail');
      const sourceDoc = entry.echartsId ? entry.echartsSource : buildSourceDoc(entry, previewDoc);

      // Compute prev/next within current group filter
      const filtered = getFilteredEntries();
      const currentIdx = filtered.findIndex(e => e.num === state.layout);
      const prevEntry = currentIdx > 0 ? filtered[currentIdx - 1] : null;
      const nextEntry = currentIdx < filtered.length - 1 ? filtered[currentIdx + 1] : null;
      const prevHtml = prevEntry
        ? `<button class="detail-nav-btn" data-nav="prev" data-num="${prevEntry.num}" title="方向键 ←">&lt; 上一个</button>`
        : `<span class="detail-nav-spacer"></span>`;
      const nextHtml = nextEntry
        ? `<button class="detail-nav-btn" data-nav="next" data-num="${nextEntry.num}" title="方向键 →">下一个 &gt;</button>`
        : `<span class="detail-nav-spacer"></span>`;
      const navHtml = `<nav class="detail-nav">${prevHtml}${nextHtml}</nav>`;
      const sourceHtml = entry.source && entry.source.url
        ? `<div class="detail-source">参考来源：<a href="${esc(entry.source.url)}" target="_blank" rel="noopener noreferrer">${esc(entry.source.name || entry.source.label || '参考来源')}</a></div>`
        : (entry.source && (entry.source.name || entry.source.label)
          ? `<div class="detail-source">来源：${esc(entry.source.name || entry.source.label)}</div>`
          : '');

      detailViewEl.innerHTML = `
        <div class="detail-header">
          <h2 class="detail-title"><button class="detail-back" id="backBtn" title="返回" aria-label="返回目录"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>${esc(entry.label)}</h2>
        </div>
        <div class="detail-panel">
          <div class="detail-panel-header">
            <div class="view-tabs" role="tablist" aria-label="组件详情视图">
              <button class="view-tab${state.detailTab === 'source' ? '' : ' active'}" type="button" data-view-tab="preview" role="tab" aria-selected="${state.detailTab === 'source' ? 'false' : 'true'}" aria-controls="previewPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg><span>预览</span></button>
              <button class="view-tab${state.detailTab === 'source' ? ' active' : ''}" type="button" data-view-tab="source" role="tab" aria-selected="${state.detailTab === 'source' ? 'true' : 'false'}" aria-controls="sourcePanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg><span>源码</span></button>
            </div>
            <div class="code-actions">
              ${MOTION_SELECT_HTML}
              <button class="copy-btn" type="button" data-copy="html" aria-label="复制代码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>复制代码</span></button>
              <button class="download-btn" type="button" data-download="html" aria-label="下载文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>下载文件</span></button>
            </div>
          </div>
          <div class="detail-panel-body${state.detailTab === 'source' ? '' : ' active'}" data-view-panel="preview" id="previewPanel" role="tabpanel"${state.detailTab === 'source' ? ' hidden' : ''}>
            <div class="detail-preview" id="detailPreviewBox"></div>
          </div>
          <div class="detail-panel-body source-panel${state.detailTab === 'source' ? ' active' : ''}" data-view-panel="source" id="sourcePanel" role="tabpanel"${state.detailTab === 'source' ? '' : ' hidden'}>
            <pre id="htmlSourcePre" tabindex="0">${esc(sourceDoc)}</pre>
          </div>
        </div>
        ${sourceHtml}
        ${navHtml}`;

      // Insert detail iframe（统一尺寸契约：固有画布 + contain-fit + 面板随长宽比自适应）
      const previewBox = document.getElementById('detailPreviewBox');
      const previewPanel = document.getElementById('previewPanel');
      bindMotionSelects(detailViewEl);
      // 仅 Swiss Atlas 内容保留 overflow:visible 的呼吸边距（venn 等）；
      // Paper Ink Atlas 已由 adapter 收敛到固有画布，不能再额外缩小有效内容区。
      const frame = resolveEntryFrame(entry);
      const edge = THEME_ID === 'swiss' && !entry.paperInkNative ? 50 : 0;
      const canvas = { width: frame.width + edge * 2, height: frame.height + edge * 2 };
      const iframe = createFramedIframe(canvas);
      iframe.addEventListener('load', () => {
        syncMindMapConnectors(iframe.contentDocument);
        growFrameFromContent(iframe, previewBox);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => notifyParentComponentReady(entry));
        });
      });
      if (entry.echartsId) iframe.src = echartsFrameUrl(entry, 'detail');
      else iframe.srcdoc = previewDoc;
      // 面板高度按画布长宽比自适应，消灭固定面板高度造成的白边
      const panelW = previewBox.offsetWidth || canvas.width;
      const maxBodyH = Math.min(window.innerHeight * 0.84, 760);
      const bodyH = Math.round(Math.min(Math.max(panelW * canvas.height / canvas.width, 320), maxBodyH));
      previewPanel.style.height = `${bodyH}px`;
      previewBox.appendChild(iframe);
      fitIframeToBox(iframe, previewBox);
      previewBox.scrollTop = 0;
      syncIframeMindMap(iframe);

      // Back button
      document.getElementById('backBtn').addEventListener('click', () => {
        if (state.detailOpenedFromGrid) {
          const fallback = createSnapshot('grid', {
            cardKey: state.lastGridCardKey || getCurrentCardKey(),
            scrollTop: state.lastGridScrollTop
          });
          applySnapshot(fallback);
          state.detailOpenedFromGrid = false;
          commitHistory('replace', fallback);
          render();
          return;
        }
        const fallback = { view: 'grid', search: state.search, layout: null, cardKey: getCurrentCardKey(), scrollTop: 0, fromGrid: false };
        applySnapshot(fallback);
        state.detailOpenedFromGrid = false;
        commitHistory('replace', fallback);
        render();
      });

      detailViewEl.querySelectorAll('.view-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const nextView = btn.dataset.viewTab;
          state.detailTab = nextView;
          detailViewEl.querySelectorAll('.view-tab').forEach(tab => {
            const isActive = tab.dataset.viewTab === nextView;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-selected', String(isActive));
          });
          detailViewEl.querySelectorAll('.detail-panel-body').forEach(panel => {
            const isActive = panel.dataset.viewPanel === nextView;
            panel.classList.toggle('active', isActive);
            panel.hidden = !isActive;
          });
        });
      });

      // Copy buttons
      detailViewEl.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(sourceDoc).then(() => {
            btn.querySelector('span').textContent = '已复制';
            btn.classList.add('copied');
            setTimeout(() => { btn.querySelector('span').textContent = '复制代码'; btn.classList.remove('copied'); }, 1500);
          });
        });
      });

      detailViewEl.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          downloadSourceDoc(sourceDoc, getDownloadFilename(entry));
          btn.querySelector('span').textContent = '已下载';
          btn.classList.add('downloaded');
          setTimeout(() => { btn.querySelector('span').textContent = '下载文件'; btn.classList.remove('downloaded'); }, 1500);
        });
      });

      // Detail navigation (prev/next)
      detailViewEl.querySelectorAll('.detail-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const num = parseInt(btn.dataset.num);
          state.lastGridScrollTop = getPageScrollTop();
          state.lastGridCardKey = getCurrentCardKey();
          state.detailOpenedFromGrid = true;
          commitHistory('replace', createSnapshot('detail', { cardKey: getCurrentCardKey(), fromGrid: true }));
          state.layout = num;
          state.pendingGridRestore = false;
          commitHistory('push', createSnapshot('detail', { cardKey: getCardKey(entries.find(e => e.num === num)), componentId: getComponentIdByLayout(num), fromGrid: true }));
          render();
        });
      });

      renderFilterBar();
    }

    // ===== History Router =====
    function buildHash(snapshot) {
      if (snapshot.view === 'detail' && snapshot.layout) {
        const componentId = snapshot.componentId || getComponentIdByLayout(snapshot.layout);
        if (componentId) return '#/component/' + encodeURIComponent(componentId);
        return '#/layout/' + encodeURIComponent(snapshot.layout);
      }
      return '#/';
    }

    function createSnapshot(view, overrides = {}) {
      return Object.assign({
        view,
        search: state.search,
        layout: view === 'detail' ? state.layout : null,
        componentId: view === 'detail' ? getCurrentComponentId() : null,
        cardKey: view === 'detail' ? getCurrentCardKey() : null,
        scrollTop: 0,
        fromGrid: false
      }, overrides);
    }

    function commitHistory(mode, snapshot) {
      history[mode + 'State'](snapshot, '', location.search + buildHash(snapshot));
      notifyParentRoute(snapshot);
    }

    function notifyParentRoute(snapshot) {
      if (window.parent === window) return;
      const component = snapshot.view === 'detail'
        ? (snapshot.componentId || getComponentIdByLayout(snapshot.layout))
        : null;
      try {
        window.parent.postMessage({
          type: 'html-ppt-components-route',
          component: component || ''
        }, '*');
      } catch (err) {}
    }

    function notifyParentComponentReady(entry) {
      if (window.parent === window || !entry || !entry.componentId) return;
      const expectedComponent = PREVIEW_PARAMS.get('taxonomyExpected');
      try {
        window.parent.postMessage({
          type: 'html-ppt-components-ready',
          component: expectedComponent || entry.componentId
        }, '*');
      } catch (err) {}
    }

    function applySnapshot(snapshot) {
      state.search = snapshot.search || '';
      state.layout = snapshot.view === 'detail' ? (snapshot.layout || null) : null;
      state.restoreGridCardKey = snapshot.view === 'grid' ? (snapshot.cardKey || null) : null;
      state.restoreGridScrollTop = snapshot.view === 'grid' && Number.isFinite(snapshot.scrollTop) ? snapshot.scrollTop : 0;
      state.pendingGridRestore = snapshot.view === 'grid' && !!(snapshot.cardKey || snapshot.scrollTop > 0);
    }

    function findGridCardByKey(cardKey) {
      if (!cardKey) return null;
      return Array.from(gridViewEl.querySelectorAll('.thumb-card')).find(card => card.dataset.cardKey === cardKey) || null;
    }

    function snapshotFromHash() {
      const h = location.hash || '#/';
      const hashBody = h.replace('#/', '');
      if (!hashBody) return { view: 'grid', search: '', layout: null, cardKey: null, scrollTop: 0, fromGrid: false };
      const parts = hashBody.split('/');
      if (parts[0] === 'component' && parts[1]) {
        const componentId = decodeURIComponent(parts[1]);
        const entry = entriesByComponentId.get(componentId);
        if (entry) {
          return { view: 'detail', search: '', layout: entry.num, componentId: entry.componentId, cardKey: getCardKey(entry), scrollTop: 0, fromGrid: false };
        }
      }
      if (parts[0] === 'layout' && parts[1]) {
        const num = parseInt(decodeURIComponent(parts[1]));
        const entry = entries.find(e => e.num === num);
        if (entry) {
          return { view: 'detail', search: '', layout: num, componentId: entry.componentId, cardKey: getCardKey(entry), scrollTop: 0, fromGrid: false };
        }
      }
      return { view: 'grid', search: '', layout: null, cardKey: null, scrollTop: 0, fromGrid: false };
    }

    function getActiveSnapshot(fallbackState) {
      if (fallbackState && (fallbackState.view === 'grid' || fallbackState.view === 'detail')) return fallbackState;
      return snapshotFromHash();
    }

    // ===== Main Render =====
    function render() {
      if (state.layout) {
        // Detail view: hide grid, filter bar, header
        gridViewEl.classList.add('hidden');
        detailViewEl.classList.add('active');
        filterControlsEl.style.display = 'none';
        filterBarEl.style.display = 'none';
        searchBarEl.style.display = 'none';
        document.querySelector('.page-header').style.display = 'none';
        paginationEl.style.display = 'none';
        renderDetail();
        setPageScrollTop(0);
      } else {
        gridViewEl.classList.remove('hidden');
        detailViewEl.classList.remove('active');
        detailViewEl.innerHTML = '';
        filterControlsEl.style.display = '';
        filterBarEl.style.display = '';
        searchBarEl.style.display = '';
        componentSearchEl.value = state.search;
        document.querySelector('.page-header').style.display = '';
        paginationEl.style.display = '';
        renderFilterBar();
        renderGrid();
        if (state.pendingGridRestore) {
          requestAnimationFrame(() => {
            const targetCard = findGridCardByKey(state.restoreGridCardKey);
            if (targetCard) {
              targetCard.scrollIntoView({ block: 'center' });
            } else if (state.restoreGridScrollTop > 0) {
              setPageScrollTop(state.restoreGridScrollTop);
            } else {
              setPageScrollTop(0);
            }
            state.pendingGridRestore = false;
            state.restoreGridCardKey = null;
            state.restoreGridScrollTop = 0;
          });
        }
      }
      syncMotionToggleUI();
    }

    window.addEventListener('popstate', event => {
      const snapshot = getActiveSnapshot(event.state);
      applySnapshot(snapshot);
      state.detailOpenedFromGrid = false;
      render();
      notifyParentRoute(snapshot);
    });

    componentSearchEl.addEventListener('input', () => {
      state.search = componentSearchEl.value;
      state.page = 1;
      renderGrid();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && state.layout) {
        const backBtn = document.getElementById('backBtn');
        if (backBtn) backBtn.click();
      }
      if (state.layout && ['ArrowLeft', 'ArrowRight'].includes(e.key)) {
        const target = e.target;
        const isEditing = target instanceof Element && target.closest('input, textarea, select, [contenteditable="true"]');
        if (!isEditing) {
          const nav = document.querySelector(e.key === 'ArrowLeft' ? '[data-nav="prev"]' : '[data-nav="next"]');
          if (nav) {
            e.preventDefault();
            nav.click();
          }
        }
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
        const pre = e.target.closest('.source-panel pre');
        if (pre) {
          e.preventDefault();
          const range = document.createRange();
          range.selectNodeContents(pre);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
    });

    // Back to top button
    const backToTopBtn = document.getElementById('back-to-top');
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('scroll', () => {
      backToTopBtn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });

    // 窗口尺寸变化时按统一 contain-fit 规则重算所有可见 iframe
    let frameRefitTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(frameRefitTimer);
      frameRefitTimer = setTimeout(() => {
        gridViewEl.querySelectorAll('.thumb-preview iframe').forEach(iframe => {
          fitIframeToBox(iframe, iframe.parentElement);
          syncMindMapConnectors(iframe.contentDocument);
        });
        const detailIframe = document.querySelector('#detailPreviewBox iframe');
        if (detailIframe) {
          fitIframeToBox(detailIframe, detailIframe.parentElement);
          syncMindMapConnectors(detailIframe.contentDocument);
        }
      }, 120);
    });

    // ===== Init =====
    const initialSnapshot = snapshotFromHash();
    applySnapshot(initialSnapshot);
    state.detailOpenedFromGrid = false;
    commitHistory('replace', initialSnapshot);
    initSkillOffsiteConfirm();
    bindMotionSelects(document);
    syncMotionToggleUI();
    document.addEventListener('click', () => { closeMotionSelects(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeMotionSelects();
    });
    render();
  </script>
</body>
</html>
