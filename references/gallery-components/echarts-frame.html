<!DOCTYPE html>
<html lang="zh-CN" data-typography-mode="all-sans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECharts 组件预览框</title>
<script>
(function resolveFrameTheme() {
  'use strict';
  var params = new URLSearchParams(location.search);
  var requested = params.get('theme');
  var legacyStyle = params.get('style');
  var themeId = requested || (legacyStyle === 'swiss' ? 'swiss' : 'paper-ink');
  var supported = ['paper-ink', 'swiss'];
  window.WISE_PPT_ECHARTS_THEME = themeId;
  document.documentElement.dataset.theme = themeId;
  /* 画册预览 Swiss 的招牌观感：启用主题自带的 accent 变体（安全橙数据 ramp）。
     仅影响 Gallery iframe；deck 生产侧仍由 ?accent 显式开启。 */
  if (themeId === 'swiss') document.documentElement.classList.add('accent');
  window.WISE_PPT_ECHARTS_THEME_READY = new Promise(function (resolve) {
    if (!supported.includes(themeId)) {
      resolve({ error: '未知主题：' + themeId });
      return;
    }
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.dataset.wisePptThemeTokens = themeId;
    link.href = `../../themes/${themeId}/assets/design-tokens.css`;
    link.addEventListener('load', function () { resolve({ themeId: themeId }); }, { once: true });
    link.addEventListener('error', function () {
      resolve({ error: '主题 token 加载失败：' + themeId });
    }, { once: true });
    document.head.appendChild(link);
  });
})();
</script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: var(--wp-color-surface-canvas);
  }
  #chart { width: 100%; height: 100%; }
  #chart.frame-error {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--wp-color-metadata);
    font: 12px var(--wp-font-sans);
  }
</style>
</head>
<body>
<div id="chart" role="img"></div>
<script src="../../capabilities/vendors/echarts/echarts.min.js"></script>
<script src="../../themes/paper-ink/adapters/echarts.js"></script>
<script src="../../themes/swiss/adapters/echarts.js"></script>
<script src="./echarts-catalog-data.js"></script>
<script src="./echarts-theme-adapter.js"></script>
<script>
(function renderEchartsFrame() {
  'use strict';
  var params = new URLSearchParams(location.search);
  var componentId = params.get('id') || '';
  var isDetail = params.get('mode') === 'detail';
  var target = document.getElementById('chart');

  function fail(message) {
    target.classList.add('frame-error');
    target.textContent = 'ECharts 组件加载失败：' + message;
  }

  function cssToken(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function typeSize(role) {
    return Number.parseFloat(cssToken('--type-' + role));
  }

  var animated = params.get('motion') === '1';

  window.WISE_PPT_ECHARTS_THEME_READY.then(function (themeState) {
    if (themeState.error || !document.fonts || !document.fonts.ready) return themeState;
    return document.fonts.ready.then(function () { return themeState; });
  }).then(function (themeState) {
    if (themeState.error) {
      fail(themeState.error);
      return;
    }
    var data = window.WISE_PPT_ECHARTS_GALLERY_DATA;
    var previewAdapter = window.WiseEchartsThemeAdapter;
    var registry = window.WisePPTThemeAdapters || {};
    var themeAdapter = registry[themeState.themeId + '.echarts'];
    var entry = data && data.components.find(function (item) {
      return item.component_id === componentId;
    });
    if (!entry || !previewAdapter || !themeAdapter || !window.echarts) {
      fail(componentId || themeState.themeId);
      return;
    }

    var option = previewAdapter.previewOption(entry, {
      isDetail: isDetail,
      themeAdapter: themeAdapter,
      themeContext: { root: document.documentElement },
      typeSize: typeSize,
      animated: animated
    });
    var chart = echarts.init(target, null, { renderer: 'svg' });
    chart.setOption(option, true);
    target.setAttribute('aria-label', entry.name + '图表预览');
    window.addEventListener('resize', function () { chart.resize(); }, { passive: true });

    /* 官方动画示例的原生驱动（动态模式）：周期性数据/形态更新，触发 ECharts 原生 update 动画。
       这是 Gallery 预览行为，不进入 Theme 或 Runtime motion contract。 */
    if (animated && componentId === 'echarts.bar-dynamic-sort') {
      var src = entry.option.dataset.source.map(function (row) { return { year: row.year, product: row.product, value: row.value }; });
      window.setInterval(function () {
        for (var n = 0; n < 2; n++) {
          var row = src[Math.floor(Math.random() * src.length)];
          row.value += 5 + Math.round(Math.random() * 35);
          if (row.value > 220) row.value = 60 + Math.round(Math.random() * 30);
        }
        chart.setOption({ dataset: { dimensions: entry.option.dataset.dimensions, source: src } });
      }, 2800);
    }
    if (animated && componentId === 'echarts.scatter-to-bar-anim') {
      /* 官方"散点聚合柱状"demo：散点 ↔ 聚合柱（每组均值 x、y 求和），
         value×value 轴不变，universalTransition 触发原生形变动画。 */
      var rows = entry.option.dataset.source;
      var points = rows.map(function (r) { return [r.x, r.y]; });
      var groups = {};
      rows.forEach(function (r) { (groups[r.group] = groups[r.group] || []).push(r); });
      var bars = Object.keys(groups).map(function (g) {
        var arr = groups[g];
        var mx = arr.reduce(function (s, r) { return s + r.x; }, 0) / arr.length;
        var sy = arr.reduce(function (s, r) { return s + r.y; }, 0);
        return [Math.round(mx * 10) / 10, Math.round(sy * 10) / 10];
      });
      var asBar = false;
      window.setInterval(function () {
        asBar = !asBar;
        chart.setOption({ series: [{
          type: asBar ? 'bar' : 'scatter',
          data: asBar ? bars : points,
          encode: { x: 0, y: 1 },
          symbolSize: 14,
          barWidth: 28,
          universalTransition: true
        }] });
      }, 2400);
    }
  });
})();
</script>
</body>
</html>
