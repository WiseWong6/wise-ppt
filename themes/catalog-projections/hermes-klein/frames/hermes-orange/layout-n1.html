<div class="stage" data-block-id="gallery-primary" data-renderer-kind="svg" data-component-source="native" data-component-id="native.wise-ppt.convergence.multi-source.sources" data-content-ref="example.n1" data-catalog-source-marker="page-recipe">
  <div class="doc tl"><span class="doc-kicker">PPT 标题</span><span class="doc-title">页面标题</span></div>
  <div class="folio">页码 / 总页数 — BY @歪斯Wise</div>

  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      </marker>
    </defs>
    <g id="draw"></g>
  </svg>

  <div class="caption">系统设定与对话历史在合并点组装成含任务、上下文、工具、示例、格式和安全策略的提示词。</div>
</div>

<script src="../../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)', FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();

G = el('g', {transform:'translate(0 -75.7)'});


/* ============ 左侧两张源卡 ============ */
var LW = 470, LX = 220;
var HEADER = 104, ROW = 42;

var sources = [
  {
    no:'01', en:'SYSTEM', t:'系统设定', y:280, h:300,
    items:[
      ['角色设定', 'ROLE'],
      ['行为规则', 'RULES'],
      ['约束边界', 'CONSTRAINT'],
      ['风格语气', 'TONE']
    ]
  },
  {
    no:'02', en:'HISTORY', t:'对话历史', y:610, h:300,
    items:[
      ['历史轮次', 'TURNS'],
      ['用户意图', 'INTENT'],
      ['上下文槽', 'CONTEXT'],
      ['已确认项', 'CONFIRMED']
    ]
  }
];

sources.forEach(function(c){
  var x = LX, Y = c.y, W = LW, H = c.h;

  /* 序号（构造小字） */
  txt(x, Y-16, c.no, {'data-number-kind':'plain', 'data-number-role':'structural', 'data-number-part':'label', 'data-text-kind':'number', 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'var(--wp-color-primary)'});
  el('line', {x1:x+26, y1:Y-20, x2:x+90, y2:Y-20, stroke:INK, 'stroke-width':.6, opacity:.3});

  /* 卡体：双线框 */
  el('rect', {x:x, y:Y, width:W, height:H, fill:'none', stroke:INK80, 'stroke-width':1.4});
  el('rect', {x:x+5, y:Y+5, width:W-10, height:H-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});

  /* 卡头 */
  txt(x+32, Y+44, c.en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});
  txt(x+32, Y+88, c.t, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
  el('line', {'data-title-rule':1, x1:x+32, y1:Y+HEADER, x2:x+W-32, y2:Y+HEADER, stroke:FOCUS, 'stroke-width':2, opacity:1});
  el('line', {'data-title-subrule':1, x1:x+32, y1:Y+HEADER+4, x2:x+120, y2:Y+HEADER+4, stroke:FOCUS, 'stroke-width':1, opacity:1});

  /* 条目：圆点 + 中文 + 右侧 mono 字段码 */
  c.items.forEach(function(it, j){
    var y = Y + HEADER + 42 + j * ROW;
    el('circle', {cx:x+38, cy:y-7, r:3.4, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.8});
    el('circle', {cx:x+38, cy:y-7, r:1.1, fill:INK});
    txt(x+58, y, it[0], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
    txt(x+W-32, y-1, it[1], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'end', fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});
    if (j < c.items.length-1)
      el('line', {x1:x+32, y1:y+16, x2:x+W-32, y2:y+16, stroke:INK, 'stroke-width':.6, opacity:.22});
  });

  /* 卡底刻度脚 */
  for (var t = 0; t <= 8; t++) {
    var tx = x + 32 + t * (W - 64) / 8;
    el('line', {x1:tx, y1:Y+H-20, x2:tx, y2:Y+H-20+(t%4===0?8:5), stroke:INK, 'stroke-width':.6, opacity:.3});
  }
});

/* ============ 汇聚流 ============ */
var MX = 1020, MY = 555;   /* 合并点 */
var RX0 = 1200;            /* 右卡左缘 */

/* 两条贝塞尔细流弯入合并点 */
el('path', {d:'M '+(LX+LW+12)+' 430 C 860 430, 890 '+MY+', '+(MX-14)+' '+MY,
  fill:'none', stroke:INK80, 'stroke-width':1.2});
el('path', {d:'M '+(LX+LW+12)+' 760 C 860 760, 890 '+MY+', '+(MX-14)+' '+MY,
  fill:'none', stroke:INK80, 'stroke-width':1.2});

/* 流标签 */
txt(830, 402, 'SYSTEM', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'var(--ink-45)'});
txt(830, 800, 'HISTORY',  {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'var(--ink-45)'});

/* 合并点竖向构造虚线 */
el('line', {x1:MX, y1:MY-70, x2:MX, y2:MY+70, stroke:INK, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'3 5'});

/* 合并符号：双圈 + 实心核 */
el('circle', {cx:MX, cy:MY, r:11, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('circle', {cx:MX, cy:MY, r:15.5, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
el('circle', {cx:MX, cy:MY, r:2.6, fill:INK});
txt(MX, MY+34, 'MERGE', {id:'sample-focus', 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'var(--ink-45)'});

/* 合并后的粗干线（全页唯一强调线 2.6px） */
el('line', {x1:MX+16, y1:MY, x2:RX0-8, y2:MY, stroke:INK, 'stroke-width':2.6, 'marker-end':'url(#arrow)'});
el('line', {x1:MX+16, y1:MY-6, x2:MX+16, y2:MY+6, stroke:INK, 'stroke-width':.8, opacity:.5});

/* ============ 右侧结果大卡：组装后提示词 ============ */
var RY = 330, RW = 500, RH = 450;
var RHEADER = 118, RROW = 44;

el('rect', {id:'n1-focus-frame', x:RX0, y:RY, width:RW, height:RH, fill:'none', stroke:INK80, 'stroke-width':1.4});
el('rect', {x:RX0+5, y:RY+5, width:RW-10, height:RH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});

txt(RX0+32, RY+44, 'COMPOSED PROMPT', {id:'n1-focus-en', 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});
txt(RX0+32, RY+88, '组装后提示词', {id:'n1-focus-cn', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
el('line', {'data-title-rule':1, x1:RX0+32, y1:RY+RHEADER, x2:RX0+RW-32, y2:RY+RHEADER, stroke:FOCUS, 'stroke-width':2, opacity:1});
el('line', {'data-title-subrule':1, x1:RX0+32, y1:RY+RHEADER+4, x2:RX0+120, y2:RY+RHEADER+4, stroke:FOCUS, 'stroke-width':1, opacity:1});

var msgs = [
  ['任务指令', 'INSTRUCTION'],
  ['上下文片段', 'CONTEXT'],
  ['工具定义', 'TOOLS'],
  ['示例样本', 'EXAMPLES'],
  ['输出格式', 'FORMAT'],
  ['安全策略', 'SAFETY']
];
msgs.forEach(function(it, j){
  var y = RY + RHEADER + 40 + j * RROW;
  el('circle', {cx:RX0+38, cy:y-6, r:3.4, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.8});
  el('circle', {cx:RX0+38, cy:y-6, r:1.1, fill:INK});
  txt(RX0+58, y, it[0], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  txt(RX0+RW-32, y-1, it[1], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'end', fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});
  if (j < msgs.length-1)
    el('line', {x1:RX0+32, y1:y+15, x2:RX0+RW-32, y2:y+15, stroke:INK, 'stroke-width':.6, opacity:.22});
});

/* 卡底刻度脚 */
for (var t = 0; t <= 8; t++) {
  var tx2 = RX0 + 32 + t * (RW - 64) / 8;
  el('line', {x1:tx2, y1:RY+RH-20, x2:tx2, y2:RY+RH-20+(t%4===0?8:5), stroke:INK, 'stroke-width':.6, opacity:.3});
}

/* 输出箭头：送入大模型 */
var OY = RY + RH/2;
el('line', {x1:RX0+RW+12, y1:OY, x2:RX0+RW+72, y2:OY, stroke:INK80, 'stroke-width':1.2, 'marker-end':'url(#arrow)'});
el('line', {x1:RX0+RW+12, y1:OY-10, x2:RX0+RW+12, y2:OY+10, stroke:INK, 'stroke-width':.8, opacity:.5});
txt(RX0+RW+44, OY-20, 'TO LLM', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:'var(--ink-45)'});

stageFit();
</script>
