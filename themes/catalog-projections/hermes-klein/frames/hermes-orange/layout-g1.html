var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK45 = 'var(--ink-45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {

}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

txt(960, NY+46, 'MODEL NODE', {id:'sample-focus', 'font-family':MONO, 'font-size':'var(--type-subheading)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK});
txt(960, NY+84, 'LLM 调用节点', {id:'g1-focus-cn', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'letter-spacing':4, 'text-anchor':'middle', fill:INK});

/* ---------- 分支线：左输入 / 右输出 / 下参数 ---------- */
var LTX = 560, RTX = 1360;
el('line', {x1:NX, y1:520, x2:LTX, y2:520, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:NX+NW, y1:520, x2:RTX, y2:520, stroke:INK, 'stroke-width':.8, opacity:.5});
el('line', {x1:960, y1:NY+NH, x2:960, y2:700, stroke:INK, 'stroke-width':.8, opacity:.5});
[[LTX,520],[RTX,520],[960,700]].forEach(function(p){ el('circle', {cx:p[0], cy:p[1], r:2.4, fill:INK, opacity:.7}); });
txt((NX+LTX)/2, 506, 'IN',  {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
txt((NX+NW+RTX)/2, 506, 'OUT', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 字段行：mono 上行 + 中文 300/16 下行 */

  txt(x, y, en, {'font-family':MONO, 'font-size':'var(--type-body-small)', 'text-anchor':anchor, fill:INK});
  txt(x, y+26, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':anchor, fill:'var(--wp-adapter-pi-ink-60)'});
}

/* ---------- 左支 · 输入（右对齐） ---------- */
var inRows = [
  ['system_prompt',  '系统提示词与人设'],
  ['user_message',   '用户消息与意图'],
  ['context',        '上下文与检索片段'],
  ['tools',          '可调用工具声明']
];
txt(LTX, 268, '输 入', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'end', fill:INK});
txt(LTX, 296, 'INPUT', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
el('line', {x1:LTX, y1:320, x2:LTX, y2:800, stroke:INK, 'stroke-width':.8, opacity:.5});
inRows.forEach(function(r, j){
  var ry = 348 + j * 116;
  el('line', {x1:LTX, y1:ry, x2:LTX-18, y2:ry, stroke:INK, 'stroke-width':.8, opacity:.5});
  field(LTX-30, ry+6, r[0], r[1], 'end');
});

/* ---------- 右支 · 输出（左对齐） ---------- */
var outRows = [
  ['completion',       '生成文本与回复'],
  ['tool_calls',       '工具调用请求'],
  ['token_usage',      'Token 用量统计'],
  ['finish_reason',    '结束原因与状态'],
  ['logprobs',         '对数概率回传'],
  ['latency',          '首字与总耗时']
];
txt(RTX, 268, '输 出', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
txt(RTX, 296, 'OUTPUT', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK45});
el('line', {x1:RTX, y1:320, x2:RTX, y2:860, stroke:INK, 'stroke-width':.8, opacity:.5});
outRows.forEach(function(r, j){
  var ry = 348 + j * 100;
  el('line', {x1:RTX, y1:ry, x2:RTX+18, y2:ry, stroke:INK, 'stroke-width':.8, opacity:.5});
  field(RTX+30, ry+6, r[0], r[1], 'start');
});

/* ---------- 下支 · 参数（横轴均布） ---------- */
var paramRows = [
  ['temperature',      '采样温度'],
  ['top_p',            '核采样阈值'],
  ['max_tokens',       '最大生成长度'],
  ['frequency_penalty','频率惩罚'],
  ['stop',             '停止序列']
];
txt(984, 668, '参 数', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK});
txt(984, 696, 'PARAMS', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK45});

paramRows.forEach(function(r, j){

});
