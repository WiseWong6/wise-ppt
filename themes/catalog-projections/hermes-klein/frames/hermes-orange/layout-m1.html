  canvas.scene { position: absolute; inset: 0; z-index: 1; }

    font-family: var(--serif); font-size: var(--type-heading);

  }
  /* 方块刻字 */
  .boxtext {
    position: absolute; z-index: 3;

  }
  .boxtext .t1 {

    letter-spacing: .16em; text-indent: .16em;
    color: var(--xp-accent);
  }
  .boxtext .divi {
    width: 140px; height: 1px;
    background: color-mix(in srgb, var(--paper) 55%, transparent);
    margin: var(--space-6) 0 var(--space-5);
  }
  .boxtext .t2 {
    font-family: var(--mono); font-size: var(--type-meta);
    letter-spacing: .4em; text-indent: .4em;

<script src="../../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var HERO = {x:825, y:408, size:270};
var boxText = document.querySelector('.boxtext');
boxText.style.left = HERO.x + 'px';
boxText.style.top = HERO.y + 'px';
boxText.style.width = HERO.size + 'px';
boxText.style.height = HERO.size + 'px';

/* ============ 粒子黑方块（极密 + 毛糙边缘） ============ */
(function(){
  var ctx = document.getElementById('cv').getContext('2d', {willReadFrequently:true});
  var BX = HERO.x, BY = HERO.y, BS = HERO.size;

  // 极密实心填充
  for (var y = BY; y < BY + BS; y += 2.6) {
    for (var x = BX; x < BX + BS; x += 2.6) {
      var e = Math.min(x - BX, BX + BS - x, y - BY, BY + BS - y);
      if (e < 4 && PART.rand() < (4 - e) / 4 * .75) continue;
      PART.dot(ctx,
        x + (PART.rand() - .5) * 1.6,
        y + (PART.rand() - .5) * 1.6,
        1.5 + PART.rand() * .7,
        .75 + PART.rand() * .25);
    }
  }
  // 边缘向外毛糙散落
  for (var i = 0; i < 460; i++) {
    var side = (PART.rand() * 4) | 0, t = PART.rand() * BS;
    var d = Math.pow(PART.rand(), 2) * 11;
    var px, py;
    if (side === 0)      { px = BX + BS + d; py = BY + t; }
    else if (side === 1) { px = BX - d;      py = BY + t; }
    else if (side === 2) { px = BX + t;      py = BY + BS + d; }
    else                 { px = BX + t;      py = BY - d; }
    PART.dot(ctx, px, py, .6 + PART.rand() * 1.1, .1 + PART.rand() * .42 * (1 - d / 11));
  }
  // 氛围尘埃（极淡，避开文字区）
  PART.dust(ctx, 320, HERO.y+25, 1280, 440, 110, .1);
})();

/* ============ SVG 构造线 / 尺寸标注 / 剖面影 ============ */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var INK8 = 'var(--ink-80)';
  var G = document.getElementById('draw');
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    G.appendChild(e); return e;
  }
  function txt(x, y, str, attrs) {
    var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
    t.textContent = str; return t;
  }
  var MONO = 'var(--mono)';

G = el('g', {transform:'translate(0 0)'});
  var BX = HERO.x, BY = HERO.y, BS = HERO.size;

  // 构造框（虚线，比方块大一圈）
  el('rect', {x:BX-18, y:BY-18, width:BS+36, height:BS+36, fill:'none',
    stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'3 5'});
  // 构造框四角短刻度
  [[BX-18,BY-18],[BX+BS+18,BY-18],[BX-18,BY+BS+18],[BX+BS+18,BY+BS+18]].forEach(function(c){
    el('line', {x1:c[0]-7, y1:c[1], x2:c[0]+7, y2:c[1], stroke:INK8, 'stroke-width':.8, opacity:.5});
    el('line', {x1:c[0], y1:c[1]-7, x2:c[0], y2:c[1]+7, stroke:INK8, 'stroke-width':.8, opacity:.5});
  });

  // 左侧尺寸标注：270 px
  var dx = BX - 74;
  el('line', {x1:BX-30, y1:BY, x2:dx-10, y2:BY, stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 4'});
  el('line', {x1:BX-30, y1:BY+BS, x2:dx-10, y2:BY+BS, stroke:INK8, 'stroke-width':.6, opacity:.3, 'stroke-dasharray':'2 4'});
  el('line', {x1:dx, y1:BY, x2:dx, y2:BY+BS, stroke:INK8, 'stroke-width':1.2});
  el('line', {x1:dx-8, y1:BY, x2:dx+8, y2:BY, stroke:INK8, 'stroke-width':1.2});
  el('line', {x1:dx-8, y1:BY+BS, x2:dx+8, y2:BY+BS, stroke:INK8, 'stroke-width':1.2});
  txt(dx-16, BY+BS/2, '270 PX', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3,
    fill:'var(--wp-adapter-pi-ink-60)', 'text-anchor':'middle',
    transform:'rotate(-90 '+(dx-16)+' '+(BY+BS/2)+')'});

  // 底部剖面影（hatch）
  el('path', {d:'M '+BX+' '+(BY+BS+10)+' L '+(BX+BS)+' '+(BY+BS+10)+
    ' L '+(BX+BS-14)+' '+(BY+BS+21)+' L '+(BX-14)+' '+(BY+BS+21)+' Z', fill:'url(#hatch)'});
  el('line', {x1:BX-14, y1:BY+BS+21, x2:BX+BS-14, y2:BY+BS+21, stroke:INK8, 'stroke-width':1, opacity:.5});

  // 图注
  txt(BX+BS/2, BY+BS+62, 'FIG. M1 — PARTICLE MASS · DENSITY 1.0', {'font-family':MONO,
    'font-size':'var(--type-meta)', 'letter-spacing':4, 'text-anchor':'middle', fill:'var(--ink-45)'});
})();

stageFit();
</script>
