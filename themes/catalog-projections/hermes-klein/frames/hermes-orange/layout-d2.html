<script>
var NS = 'http://www.w3.org/2000/svg';
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}

var WORD = 'AGENT';
var FS = paperInkTypeSize('particle-sample');
var CATALOG_FONTS = document.documentElement.dataset.wiseCatalogFonts === 'true';
var SERIF_FACE = CATALOG_FONTS ? 'Han Serif Catalog' : 'Han Serif';
var MONO_FACE = CATALOG_FONTS ? 'Courier Prime Catalog' : 'Courier Prime';
var M1_INVERSE = getComputedStyle(document.documentElement).getPropertyValue('--xp-paper').trim() || '#f2efe9';
var FONT = '500 ' + FS + 'px "' + SERIF_FACE + '"';
var CX = 994, CY = 540;

function draw() {
  PART.reset();
  ctx.clearRect(0, 0, cv.width, cv.height);
  G.replaceChildren();
  var w = PART.measure(WORD, FONT);
  var x0 = CX - w / 2;
  var pts = PART.textPoints(WORD, x0, CY, FONT, 6);
  var minY = 1e9, maxY = -1e9;
  pts.forEach(function (p) { minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });

  var CH = '01*-.';
  ctx.font = paperInkTypeSize('micro-secondary') + 'px "' + MONO_FACE + '"';
  ctx.fillStyle = M1_INVERSE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  pts.forEach(function (p) {
    ctx.globalAlpha = .75 + PART.rand() * .25;
    ctx.fillText(CH[(PART.rand() * CH.length) | 0], p.x + (PART.rand() - .5) * 1.5, p.y + (PART.rand() - .5) * 1.5);
  });
  for (var k = 0; k < 56; k++) {
    ctx.globalAlpha = .32 + PART.rand() * .36;
    ctx.fillText(CH[(PART.rand() * CH.length) | 0], x0 + PART.rand() * w, minY - 2 + PART.gauss() * 7);
  }
  ctx.globalAlpha = 1;
  PART.dust(ctx, 140, 150, 1640, 700, 90, .12);

  var LX = x0 - 34, RX = x0 + w + 34;
  var TY = minY - 94, BY = maxY + 94;
  [[LX, TY], [RX, TY], [LX, BY], [RX, BY]].forEach(function (c) {
    el('line', {x1:c[0]-9, y1:c[1], x2:c[0]+9, y2:c[1], stroke:'var(--ink)', 'stroke-width':.6, opacity:.3});
    el('line', {x1:c[0], y1:c[1]-9, x2:c[0], y2:c[1]+9, stroke:'var(--ink)', 'stroke-width':.6, opacity:.3});
  });
  el('line', {x1:LX, y1:maxY+12, x2:RX, y2:maxY+12, stroke:'var(--ink)', 'stroke-width':.6, 'stroke-dasharray':'2 5', opacity:.3});
  var ax = LX - 46;
  el('line', {x1:ax, y1:minY, x2:ax, y2:maxY, stroke:'var(--ink)', 'stroke-width':.8, opacity:.55});
  el('line', {x1:ax-6, y1:minY, x2:ax+6, y2:minY, stroke:'var(--ink)', 'stroke-width':.8, opacity:.55});
  el('line', {x1:ax-6, y1:maxY, x2:ax+6, y2:maxY, stroke:'var(--ink)', 'stroke-width':.8, opacity:.55});
  el('line', {x1:ax, y1:minY, x2:LX, y2:minY, stroke:'var(--ink)', 'stroke-width':.6, 'stroke-dasharray':'2 4', opacity:.3});
  el('line', {x1:ax, y1:maxY, x2:LX, y2:maxY, stroke:'var(--ink)', 'stroke-width':.6, 'stroke-dasharray':'2 4', opacity:.3});
  var t = el('text', {x:ax-14, y:(minY+maxY)/2, 'text-anchor':'middle', 'font-family':MONO_FACE, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'var(--ink-45)', transform:'rotate(-90 '+(ax-14)+' '+((minY+maxY)/2)+')'});
  t.textContent = 'X-HEIGHT 240';
}

function start() {
  if (document.fonts && document.fonts.load) {
    document.fonts.load(FONT, WORD).then(function () { document.fonts.ready.then(draw); });
  } else draw();
}
start();
stageFit();
</script>
