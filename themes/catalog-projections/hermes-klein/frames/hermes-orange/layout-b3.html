<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)', FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();

G = el('g', {transform:'translate(0 -37.2)'});


/* ---------- 时间刻度尺（x340–1760，六个季度） ---------- */
var X0 = 340, X1 = 1760, QW = (X1 - X0) / 6;
var QLABELS = ['25Q3', '25Q4', '26Q1', '26Q2', '26Q3', '26Q4'];

/* 竖向虚线栅格（贯穿全图，先画沉底） */
for (var i = 0; i <= 6; i++) {
  var gx = X0 + i * QW;
  el('line', {x1:gx, y1:268, x2:gx, y2:820, stroke:INK, 'stroke-width':.6, opacity:.22, 'stroke-dasharray':'2 6'});
}

/* 尺脊：本页唯一强调线 */
el('line', {id:'sample-focus', x1:X0, y1:250, x2:X1, y2:250, stroke:INK, 'stroke-width':2});
for (var i = 0; i <= 6; i++) {
  var tx = X0 + i * QW;
  el('line', {x1:tx, y1:250, x2:tx, y2:264, stroke:INK80, 'stroke-width':1});
  if (i < 6) {
    var mx = tx + QW / 2;
    el('line', {x1:mx, y1:250, x2:mx, y2:257, stroke:INK, 'stroke-width':.5, opacity:.5});
    txt(tx + QW / 2, 236, QLABELS[i], {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  }
}

/* ---------- 泳道分隔线 ---------- */
[455, 625].forEach(function(y){
  el('line', {x1:X0, y1:y, x2:X1, y2:y, stroke:INK, 'stroke-width':.6, opacity:.2});
});

/* ---------- 泳道标签列（x150–300） ---------- */
var LANES = [
  {no:'L1', en:'MODEL',  cn:'模型层', cy:360},
  {no:'L2', en:'DATA',   cn:'数据层', cy:540},
  {no:'L3', en:'APPS',   cn:'应用层', cy:720}
];
LANES.forEach(function(L){
  txt(150, L.cy-8, L.no + ' · ' + L.en, {'data-lane-label':1, 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:FOCUS});
  txt(150, L.cy+22, L.cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
  el('line', {x1:296, y1:L.cy, x2:328, y2:L.cy, stroke:INK, 'stroke-width':.8, opacity:.4});
});

/* ---------- span 条与里程碑 ---------- */
function span(x1, x2, cy, en, cn, filled, cnDx) {
  el('rect', {x:x1, y:cy-18, width:x2-x1, height:36,
    fill: filled ? 'url(#hatch24)' : 'var(--paper-panel)', stroke:INK80, 'stroke-width':1.2});
  el('line', {x1:x1, y1:cy-28, x2:x1, y2:cy+28, stroke:INK, 'stroke-width':1, opacity:.7});
  el('line', {x1:x2, y1:cy-28, x2:x2, y2:cy+28, stroke:INK, 'stroke-width':1, opacity:.7});
  txt((x1+x2)/2, cy+5, en, {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
  txt(x1+2+(cnDx||0), cy-34, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
}
function milestone(x, cy, en, cn) {
  el('circle', {cx:x, cy:cy, r:8, fill:'var(--paper)', stroke:INK80, 'stroke-width':1.2});
  el('circle', {cx:x, cy:cy, r:3, fill:INK});
  el('circle', {cx:x, cy:cy, r:13, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(x, cy-30, en, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});
  txt(x, cy+46, cn, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', 'text-anchor':'middle', fill:INK70});
}
function q(n) { return X0 + n * QW; }   /* 季度边界 x（0–6） */

/* L1 模型层 */
span(q(0),   q(2),   360, 'V1 · BASE MODEL',  '基座模型 v1 上线', true);
span(q(2),   q(4),   360, 'V2 · FINE-TUNE',   '微调 v2 灰度', false);
milestone(q(4.5), 360, 'STRESS 10K', '万级语料压测');

/* L2 数据层 */
span(q(1),   q(3),   540, 'PIPELINE-2',       '第二条管线接入', false);
span(q(3),   q(6),   540, 'CLEANROOM CERT',   '清洗间认证', true, 90);
milestone(q(3), 540, 'FIRST PIPE', '首个数据管线交付');

/* L3 应用层 */
span(q(0),   q(3),   720, 'CORPUS BASE',      '语料底座', true);
span(q(4),   q(6),   720, 'MULTIMODAL',       '多模态融合', false);
milestone(q(3.5), 720, 'AUTO EVAL', '评测自动化');

/* ---------- 底部刻度注 ---------- */
txt(960, 856, 'AI PRODUCT · MODEL / DATA / APPS SWIMLANE ROADMAP — ALL DATA FICTIONAL',
  {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});

stageFit();
</script>
