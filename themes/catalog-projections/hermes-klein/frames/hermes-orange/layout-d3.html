var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
G = el('g', {transform:'translate(0 -22)'});

/* ===== 唯一一处极细装饰：大字上方的短横 + 小圆 + 十字准星 ===== */

/* 短横右端小圆（双圈+实心核的极简化） */

el('circle', {cx:1018, cy: 440, r:1.6, fill:'var(--xp-accent)', opacity:.9});
/* 署名行下方的十字准星（套准标记感） */
el('line', {x1:951, y1: 716, x2:969, y2: 716, stroke:INK, 'stroke-width':.7, opacity:.4});
el('line', {x1:960, y1: 707, x2:960, y2: 725, stroke:INK, 'stroke-width':.7, opacity:.4});

stageFit();
</script>
