<script>
/* ===== 连续雕刻纹理:确定性波纹 + 纸纤维,不依赖随机运行时 ===== */
(function(){
  var canvas = document.getElementById('texture');
  var ctx = canvas.getContext('2d');
  var INK = '25,25,23';

  /* 固定种子,保证 Gallery 缩略图与真实打开完全一致 */
  var seed = 0x5eed10;
  function rand(){
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(108, 96, 1704, 888);
  ctx.clip();
  ctx.lineCap = 'round';

  /* 纸纤维:方向一致但长度、密度和明暗有层次 */
  for (var i=0; i<2800; i++) {
    var x = 112 + rand()*1696;
    var y = 100 + rand()*880;
    var len = 5 + rand()*28;
    var lift = (rand()-.5)*2.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x+len, y+lift);
    ctx.strokeStyle = 'rgba('+INK+','+(0.022+rand()*0.04)+')';
    ctx.lineWidth = .45 + rand()*.45;
    ctx.stroke();
  }

  /* 主纹理:像铜版雕刻一样贯穿整页,主次线每五道形成节奏 */
  for (var row=0; row<92; row++) {
    var base = 118 + row*9.2;
    ctx.beginPath();
    for (var x2=112; x2<=1808; x2+=8) {
      var centerPull = Math.exp(-Math.pow((x2-960)/520, 2));
      var longWave = 17*Math.sin(x2*.0092 + row*.22);
      var shortWave = 5.5*Math.sin(x2*.026 - row*.37);
      var field = 23*centerPull*Math.sin(row*.31 + x2*.003);
      var y2 = base + longWave + shortWave + field;
      if (x2===112) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
    }
    var major = row%5===0;
    ctx.strokeStyle = 'rgba('+INK+','+(major?.17:.075)+')';
    ctx.lineWidth = major ? .9 : .52;
    ctx.stroke();
  }

  /* 两侧斜向密纹:中心仍保持呼吸,边缘增加可见的材料感 */
  ctx.strokeStyle = 'rgba('+INK+',.075)';
  ctx.lineWidth = .55;
  for (var h=0; h<34; h++) {
    ctx.beginPath();
    ctx.moveTo(112, 210+h*18);
    ctx.lineTo(430, 110+h*18);
    ctx.moveTo(1490, 110+h*18);
    ctx.lineTo(1808, 210+h*18);
    ctx.stroke();
  }

  ctx.restore();
})();

stageFit();
</script>
