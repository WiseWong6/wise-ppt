&quot;,&quot;role&quot;:&quot;outline&quot;},{&quot;selector&quot;:&quot;#c7-focus-hatch&quot;,&quot;role&quot;:&quot;texture&quot;}]" data-catalog-legacy-emphasis-foreground-members="[]" data-catalog-legacy-emphasis-ref="sample.c7.c7-focus" data-wise-catalog-fonts="true" data-surface-source="catalog-theme-recipes-v2" data-xp-recipe-id="klein-blue:c7" data-xp-surface-profile="data-evidence-board" data-xp-recipe-status="recipe-ready" data-xp-frame-kind="custom-redraw">

      </pattern>

<script src="../../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -24.2)'});


/* ---------- 数据（大模型综合 Benchmark 排行） ---------- */
var rows = [
  {name:'GLM-X',      code:'MODEL-01', v:428, bot:'lift', focus:true, contentRef:'sample.c7.ranking-bars'},
  {name:'GPT-X',      code:'MODEL-02', v:391, bot:'fork'},
  {name:'Claude-X',   code:'MODEL-03', v:355, bot:'tote'},
  {name:'Llama-X',    code:'MODEL-04', v:298},
  {name:'Gemini-X',   code:'MODEL-05', v:264},
  {name:'Mistral-X',  code:'MODEL-06', v:227},
  {name:'DeepSeek-X', code:'MODEL-07', v:196},
  {name:'Qwen-X',     code:'MODEL-08', v:168}
];
var BASE = 820, X0 = 200, X1 = 1720, SC = 1.08, BW = 64;

/* ---------- 左侧数值轴 + 横向构造栅格 ---------- */
[0,100,200,300,400].forEach(function(v){
  var y = BASE - v*SC;
  if (v > 0) el('line', {x1:X0, y1:y, x2:X1, y2:y, stroke:INK, 'stroke-width':.5, opacity:.12, 'stroke-dasharray':'2 6'});
  el('line', {x1:X0-8, y1:y, x2:X0, y2:y, stroke:INK, 'stroke-width':.9, opacity:.6});
  txt(X0-16, y+4, String(v), {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'end', fill:INK45});
});
el('line', {x1:X0, y1:300, x2:X0, y2:BASE, stroke:INK, 'stroke-width':1, opacity:.6});
txt(X0-16, 290, '综 合 分 · SCORE', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'end', fill:INK45});

/* ---------- 底部共享基线尺 ---------- */
el('line', {x1:X0, y1:BASE, x2:X1, y2:BASE, stroke:INK80, 'stroke-width':1.2});
rows.forEach(function(r, i){
  var cx = 300 + i*190;
  el('line', {x1:cx, y1:BASE, x2:cx, y2:BASE+10, stroke:INK, 'stroke-width':1, opacity:.7});
  if (i < rows.length-1)
    el('line', {x1:cx+95, y1:BASE, x2:cx+95, y2:BASE+6, stroke:INK, 'stroke-width':.5, opacity:.4});
});

/* ---------- 降序线稿柱 ---------- */
/* 样张焦点由数据显式指定，不按第一项或最大值推断。 */
rows.forEach(function(r, i){
  var cx = 300 + i*190;
  var h = r.v*SC, y = BASE - h;
  el('rect', {id:r.focus?'c7-focus-bar':'', x:cx-BW/2, y:y, width:BW, height:h,
    fill:r.focus ? 'url(#hatch30)' : 'none', stroke:INK80, 'stroke-width':1.2});
  txt(cx, y-14, String(r.v), {id:r.focus?'c7-focus-value':'', 'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':1, 'text-anchor':'middle', fill:INK});
  txt(cx, BASE+34, r.name, {id:r.focus?'c7-focus-name':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', 'text-anchor':'middle', fill:INK});
  txt(cx, BASE+56, r.code, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
});

/* ---------- Top3 垂挂标本缩略框（微场景：三种头像线稿） ---------- */
function drawAvatar(bx, by, kind) {
  var S = {stroke:INK80, 'stroke-width':1.1, fill:'none'};
  if (kind === 'lift') {          /* 圆脸头像：圆头 + 肩膀弧 */
    el('circle', Object.assign({cx:bx, cy:by-14, r:14}, S));
    el('path', Object.assign({d:'M '+(bx-22)+' '+(by+14)+' Q '+bx+' '+(by-6)+' '+(bx+22)+' '+(by+14)}, S));
  } else if (kind === 'fork') {   /* 戴帽头像：帽檐 + 圆脸 */
    el('ellipse', Object.assign({cx:bx, cy:by-10, rx:13, ry:14}, S));
    el('line', Object.assign({x1:bx-18, y1:by-18, x2:bx+18, y2:by-18}, S));
    el('path', Object.assign({d:'M '+(bx-20)+' '+(by+14)+' Q '+bx+' '+(by-2)+' '+(bx+20)+' '+(by+14)}, S));
  } else {                        /* 方框眼镜头像：圆脸 + 眼镜框 */
    el('circle', Object.assign({cx:bx, cy:by-14, r:14}, S));
    el('rect', Object.assign({x:bx-12, y:by-18, width:10, height:7}, S));
    el('rect', Object.assign({x:bx+2, y:by-18, width:10, height:7}, S));
    el('line', Object.assign({x1:bx-2, y1:by-15, x2:bx+2, y2:by-15}, S));
    el('path', Object.assign({d:'M '+(bx-22)+' '+(by+14)+' Q '+bx+' '+(by-6)+' '+(bx+22)+' '+(by+14)}, S));
  }
}

var FW = 182, FH = 118, FY = 180;
rows.slice(0,3).forEach(function(r, i){
  var cx = 300 + i*190, fx = cx - FW/2;
  /* 垂挂虚线：终点收在柱顶数值上方（数值 bbox 顶 ≈ 柱顶-27），过短则不画 */
  var ly2 = BASE - r.v*SC - 40;
  if (ly2 - (FY+FH) >= 8)
    el('line', {x1:cx, y1:FY+FH, x2:cx, y2:ly2, stroke:INK, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  el('circle', {cx:cx, cy:FY+FH+5, r:2.2, fill:INK, opacity:.6});
  /* 双线框 */
  el('rect', {x:fx, y:FY, width:FW, height:FH, fill:'var(--paper-panel)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:fx+5, y:FY+5, width:FW-10, height:FH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.3});
  /* 排名徽章 + 领域标签 */
  txt(fx+14, FY+24, '0'+(i+1), {'data-number-kind':'plain', 'data-number-role':'structural', 'data-number-part':'label', 'data-text-kind':'number', 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:INK});
  txt(fx+FW-14, FY+24, ['REASONING','CODING','MATH'][i] || 'MODEL', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':1, 'text-anchor':'end', fill:INK45});
  drawAvatar(cx, FY+64, r.bot);
  txt(cx, FY+FH-19, 'SAMPLE · '+r.code, {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'middle', fill:INK45});
});

stageFit();
</script>
