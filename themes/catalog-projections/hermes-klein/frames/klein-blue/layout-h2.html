<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -13.7)'});


/* ---------- 主角：嵌套变焦框（AI 观察粒度逐层拉远） ---------- */
var CX = 780, CY = 520;
var levels = [
  {no:'01', en:'CALL',    cn:'单轮调用', note:'（这一次请求）',     half:74,  dash:null,   w:1.4, op:.9, focus:true},
  {no:'02', en:'SESSION', cn:'单次会话', note:'（这一段对话）',     half:138, dash:null,   w:1.2, op:.7},
  {no:'03', en:'TASK',    cn:'任务过程', note:'（这一整轮执行）',   half:202, dash:'6 4',  w:1.1, op:.6},
  {no:'04', en:'OUTCOME', cn:'业务结果', note:'（最终的产出影响）', half:266, dash:'3 6',  w:1.1, op:.5}
];

/* 构造线不擦除：十字基准（超出最外框） */
el('line', {x1:CX-320, y1:CY, x2:CX+320, y2:CY, stroke:INK, 'stroke-width':.5, opacity:.22, 'stroke-dasharray':'2 6'});
el('line', {x1:CX, y1:CY-320, x2:CX, y2:CY+320, stroke:INK, 'stroke-width':.5, opacity:.22, 'stroke-dasharray':'2 6'});
/* 四角套准标记（最外框外） */
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(s){
  var mx = CX + s[0]*296, my = CY + s[1]*296;
  el('line', {x1:mx-9, y1:my, x2:mx+9, y2:my, stroke:INK, 'stroke-width':.8, opacity:.4});
  el('line', {x1:mx, y1:my-9, x2:mx, y2:my+9, stroke:INK, 'stroke-width':.8, opacity:.4});
});

/* 四层框（外→内画，内层压上层；最内层 hatch 核 = 最细粒度） */
levels.slice().reverse().forEach(function(L){
  var x = CX-L.half, y = CY-L.half, s = L.half*2;
  el('rect', {id:L.focus?'h2-focus-frame':'h2-level-'+L.en, x:x, y:y, width:s, height:s, fill: L.en==='CALL' ? 'url(#hatch16)' : 'none',
    stroke:INK, 'stroke-width':L.w, opacity:L.op, 'stroke-dasharray':L.dash || 'none'});
});
/* 内核观察点：双圈 + 实心核 */
el('circle', {cx:CX, cy:CY, r:3, fill:INK});
el('circle', {cx:CX, cy:CY, r:8, fill:'none', stroke:INK, 'stroke-width':.8, opacity:.6});

/* ---------- 右侧标签栏（外→内 = 上→下，肘形引线不交叉） ---------- */
var rail = [
  {L:levels[3], ly:280},   /* OUTCOME 最外 → 最上 */
  {L:levels[2], ly:430},   /* TASK */
  {L:levels[1], ly:580},   /* SESSION */
  {L:levels[0], ly:730}    /* CALL 最内 → 最下 */
];
rail.forEach(function(r){
  var L = r.L;
  var fx = CX + L.half, fy = CY - L.half;      /* 各框右上角 */
  var ex = 1160, lx = 1210;
  el('circle', {cx:fx, cy:fy, r:5, fill:'none', stroke:INK80, 'stroke-width':1});
  el('circle', {cx:fx, cy:fy, r:1.8, fill:INK});
  el('path', {d:'M '+fx+' '+fy+' L '+(fx+70)+' '+fy+' L '+ex+' '+r.ly, fill:'none',
    stroke:INK, 'stroke-width':.7, opacity:.45, 'stroke-dasharray':'3 5'});
  el('circle', {cx:ex, cy:r.ly, r:2.4, fill:INK, opacity:.6});
  el('line', {x1:ex, y1:r.ly, x2:lx-10, y2:r.ly, stroke:INK, 'stroke-width':.7, opacity:.45});
  txt(lx, r.ly-2,  L.no + ' · ' + L.en, {id:L.focus?'h2-focus-code':'', 'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':2, fill:INK});
  txt(lx, r.ly+32, L.cn, {id:L.focus?'h2-focus-cn':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  txt(lx, r.ly+60, L.note, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:INK70});
});

stageFit();
</script>
