<script>
  const catalog=window.WISE_PPT_NATIVE_COMPONENT_DATA;
  const entry=catalog&&catalog.entries.find(item=>item.num===107);
  if(!entry)throw new Error('缺少 native.wise-ppt.107.interlocking-gears');
  const style=document.createElement('style');
  /* 样张是静帧:只注入组件静态样式,不拼 componentMotionCss(入场动效),
     静止态即标称几何,AI 参考与门禁量测不再依赖截图时机。 */
  style.textContent=catalog.componentCss||'';
  document.head.appendChild(style);
  const host=document.getElementById('gears-host');
  host.innerHTML=entry.snippet;
  const content={
    module_1:'内容',
    module_1_desc:'知识与任务',
    module_2:'模型',
    module_2_desc:'推理与执行',
    module_3:'评测',
    module_3_desc:'反馈与校准',
    system_result:'稳定交付'
  };
  Object.entries(content).forEach(([field,value])=>{
    const node=host.querySelector(`[data-field="${field}"]`);
    if(node)node.textContent=value;
  });
  const result=host.querySelector('[data-field="system_result"]');
  if(result){
    result.id='r5-focus-cn';
    const group=result.parentElement;
    const en=group&&group.querySelector('text:not([data-field])');
    const line=group&&group.querySelector('line');
    const arrow=group&&group.querySelector('path');
    if(en)en.id='r5-focus-en';
    if(line)line.id='r5-focus-line';
    if(arrow)arrow.id='r5-focus-arrow';
  }
  stageFit();
</script>
