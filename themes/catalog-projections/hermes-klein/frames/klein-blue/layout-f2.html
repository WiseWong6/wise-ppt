<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)', FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();

G = el('g', {transform:'translate(0 -53.7)'});


/* ============ 左区：一次 Agent 任务的环节树 ============ */
var RX = 180, RY = 250, RW = 640, RH = 64;
el('rect', {x:RX, y:RY, width:RW, height:RH, fill:'url(#hatch)', stroke:INK80, 'stroke-width':1.4});
txt(RX+RW/2-96, RY+40, 'TASK RUN', {'data-task-run-label':1, 'font-family':MONO, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:FOCUS});
txt(RX+RW/2-30, RY+40, '一次 Agent 执行', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});

var spans = [
  {t:'意图接入', m:'INTENT · PARSE'},
  {t:'任务拆解', m:'PLAN ×6'},
  {t:'工具选择', m:'TOOL · MATCH'},
  {t:'执行调用', m:'CALL · TRACE'},
  {t:'结果校验', m:'CHECK · GUARD'},
  {t:'记忆更新', m:'MEM · WRITE'}
];
var SY = 346, SH = 48, SGAP = 16, SX = 260, SW = 560;
var ticks = ['4MS', '18MS', '42MS', '9MS', '310MS', '26MS'];
spans.forEach(function(sp, i){
  var y = SY + i * (SH + SGAP);
  /* 竖干连接线 + 落点圆点 */
  el('line', {x1:RX+40, y1:RY+RH, x2:RX+40, y2:y+SH/2, stroke:INK, 'stroke-width':.8, opacity:.55});
  el('line', {x1:RX+40, y1:y+SH/2, x2:SX, y2:y+SH/2, stroke:INK, 'stroke-width':.8, opacity:.55});
  el('circle', {cx:RX+40, cy:y+SH/2, r:2.4, fill:INK, opacity:.7});
  /* 双线环节框 */
  el('rect', {x:SX, y:y, width:SW, height:SH, fill:'none', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:SX+4, y:y+4, width:SW-8, height:SH-8, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
  txt(SX+22, y+SH/2+8, sp.t, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
  txt(SX+SW-18, y+SH/2+6, sp.m, {'font-family':MONO, 'font-size':'var(--type-meta)', 'text-anchor':'end', fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});
  /* 右侧耗时刻度 */
  txt(SX+SW+26, y+SH/2+6, ticks[i], {'font-family':MONO, 'font-size':'var(--type-meta)', fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});
});
/* 尾部虚线输出框 */
var OY = SY + spans.length * (SH + SGAP) + 6;
el('line', {x1:RX+40, y1:OY-6, x2:RX+40, y2:OY+22, stroke:INK, 'stroke-width':.8, opacity:.55});
el('line', {x1:RX+40, y1:OY+22, x2:SX, y2:OY+22, stroke:INK, 'stroke-width':.8, opacity:.55});
el('rect', {id:'f2-focus-frame', x:SX, y:OY-8, width:SW, height:60, fill:'none', stroke:INK80, 'stroke-width':1.2, 'stroke-dasharray':'7 5'});
txt(SX+22, OY+30, '任务完成', {id:'sample-focus', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
txt(SX+SW-18, OY+26, 'OUTPUT', {'font-family':MONO, 'font-size':'var(--type-meta)', 'text-anchor':'end', fill:'color-mix(in srgb, var(--ink) 50%, transparent)'});

/* ============ 右区：字段规格单 ============ */
var CX = 1130, CW = 620, CY0 = 250, CH = 620;
el('rect', {id:'f2-spec-card', x:CX, y:CY0, width:CW, height:CH, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('rect', {x:CX+5, y:CY0+5, width:CW-10, height:CH-10, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
txt(CX+30, CY0+48, '每个环节的核心要素', {id:'f2-spec-title', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});
el('line', {x1:CX+30, y1:CY0+66, x2:CX+CW-30, y2:CY0+66, stroke:INK, 'stroke-width':.8, opacity:.5});

var fields = [
  ['TASK_ID',  '任务编号与来源'],
  ['TOOL',     '调用的工具与模型'],
  ['TRACE',    '推理路径与步骤'],
  ['TOKEN',    'Token 预算与耗时'],
  ['ETA',      '预计完成与重试策略'],
  ['HANDOVER', '异常阻塞人工确认点']
];
fields.forEach(function(f, i){
  var y = CY0 + 104 + i * 70;
  txt(CX+30, y, f[0], {'font-family':MONO, 'font-size':'var(--type-body-small)', fill:INK});
  txt(CX+200, y, f[1], {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:'var(--ink-70)'});
  if (i < fields.length-1) el('line', {x1:CX+30, y1:y+24, x2:CX+CW-30, y2:y+24, stroke:INK, 'stroke-width':.6, opacity:.25});
});
/* 异常行（虚线框单独强调） */
var ey = CY0 + 104 + 6 * 70;
el('rect', {x:CX+20, y:ey-30, width:CW-40, height:46, fill:'none', stroke:INK, 'stroke-width':1, 'stroke-dasharray':'5 4'});
txt(CX+30, ey, 'ALARM', {'font-family':MONO, 'font-size':'var(--type-body-small)', fill:INK});
txt(CX+200, ey, '阻塞与异常（自动上报）', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', fill:INK});

stageFit();
</script>
