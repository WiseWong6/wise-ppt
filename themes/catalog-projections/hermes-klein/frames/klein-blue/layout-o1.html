<script src="../../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
var INK45 = 'var(--ink-45)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -37.7)'});


/* ---------- 连续漏斗：一个大倒三角，两侧边一路收为塔尖 ---------- */
var topY = 240, botY = 770;          /* 漏斗顶 / 塔尖（收为点） */
var cX = 660;                        /* 漏斗中轴 */
var topW = 720;                      /* 顶宽 */
function wAt(y) { return topW * (botY - y) / (botY - topY); }

/* 外轮廓：顶线 + 两条连续侧边 */
el('line', {x1:cX-topW/2, y1:topY, x2:cX+topW/2, y2:topY, stroke:INK80, 'stroke-width':1.4});
var focusW = wAt(600);
el('line', {x1:cX-topW/2, y1:topY, x2:cX-focusW/2, y2:600, stroke:INK80, 'stroke-width':1.4});
el('line', {id:'o1-focus-side-left', x1:cX-focusW/2, y1:600, x2:cX, y2:botY, stroke:INK80, 'stroke-width':1.4});
el('line', {x1:cX+topW/2, y1:topY, x2:cX+focusW/2, y2:600, stroke:INK80, 'stroke-width':1.4});
el('line', {id:'o1-focus-side-right', x1:cX+focusW/2, y1:600, x2:cX, y2:botY, stroke:INK80, 'stroke-width':1.4});

/* 两条横向分隔线切出三层 */
[440, 600].forEach(function(sy){
  var w = wAt(sy);
  el('line', {id:sy === 600 ? 'o1-focus-divider' : '', x1:cX-w/2, y1:sy, x2:cX+w/2, y2:sy, stroke:INK, 'stroke-width':.9, opacity:.55});
});

/* 顶部刻度尺 */
for (var i = 0; i <= 20; i++) {
  var tx = cX - topW/2 + i * (topW/20);
  el('line', {x1:tx, y1:topY, x2:tx, y2:topY - (i%5===0?12:6), stroke:INK, 'stroke-width':.6, opacity:.35});
}

var layers = [
  {y0:topY, y1:440, n:'≈ 1,200,000', tag:'CORPUS',  t:'语料库', en:'CHUNKS',
   notes:['文档切片','向量化入库','语义召回','混合检索']},
  {y0:440,  y1:600, n:'≈ 8,600',     tag:'RECALL',  t:'召回',   en:'CANDIDATES',
   notes:['向量召回','关键词匹配','相关度过滤','去重合并']},
  {y0:600,  y1:740, n:'≈ 48',        tag:'RERANK',  t:'重排',   en:'TOP-K', focus:true, contentRef:'sample.o1.funnel-stages',
   notes:['交叉编码重排','业务规则加权','截断 Top-K','拼装上下文']}
];

layers.forEach(function(L, i){
  var midY = (L.y0 + L.y1)/2;
  /* 层名 */
  txt(cX, midY-4, L.t, {id:L.focus?'o1-focus-label':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:INK});
  txt(cX, midY+26, L.en, {id:L.focus?'o1-focus-top-k':'', 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  /* 左侧：虚线引出 mono 数量 */
  var lw = wAt(midY);
  el('line', {x1:cX-lw/2-16, y1:midY, x2:cX-lw/2-30, y2:midY, stroke:INK, 'stroke-width':.6, 'stroke-dasharray':'3 4', opacity:.5});
  txt(cX-lw/2-46, midY-4, L.n, {id:L.focus?'o1-focus-number':'', 'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'end', fill:INK});
  txt(cX-lw/2-46, midY+22, L.tag, {id:L.focus?'o1-focus-tag':'', 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'end', fill:INK45});
  /* 右侧：实线引出字段注记 */
  el('line', {x1:cX+lw/2+16, y1:midY, x2:cX+lw/2+70, y2:midY, stroke:INK, 'stroke-width':.6, opacity:.5});
  L.notes.forEach(function(n, j){
    txt(cX+lw/2+86, midY - 45 + j*30, n, {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:'var(--ink-70)'});
  });
});

/* 底部收口：塔尖墨点 → 双线小框（出口） */
el('line', {x1:cX, y1:botY, x2:cX, y2:botY+30, stroke:INK, 'stroke-width':1.2});
el('circle', {cx:cX, cy:botY+38, r:3.5, fill:INK});
el('rect', {x:cX-70, y:botY+46, width:140, height:44, fill:'none', stroke:INK80, 'stroke-width':1.2});
el('rect', {x:cX-66, y:botY+50, width:132, height:36, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
txt(cX, botY+74, 'TO LLM', {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK});

/* ---------- 右侧规格单：召回片段清单（标本面板） ---------- */
(function(){
  var x = 1380, y = 330, w = 400;
  el('rect', {x:x, y:y, width:w, height:330, fill:'var(--paper-panel)', stroke:INK80, 'stroke-width':1.2});
  el('rect', {x:x+5, y:y+5, width:w-10, height:320, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.35});
  txt(x+26, y+42, 'RETRIEVED', {'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':2, fill:INK});
  el('line', {x1:x+26, y1:y+56, x2:x+90, y2:y+56, stroke:INK, 'stroke-width':1});
  txt(x+26, y+88, '本次查询 · 召回 48 片段', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body-small)', fill:'var(--ink-55)'});
  var rows = [
    ['CHK #04217', 'API 文档',  'score .92'],
    ['CHK #04188', 'FAQ',      'score .89'],
    ['CHK #04155', '产品手册', 'score .86'],
    ['CHK #04102', '博客',     'score .82'],
    ['CHK #04071', '工单',     'score .78']
  ];
  rows.forEach(function(r, i){
    var ry = y + 128 + i * 38;
    txt(x+26, ry, r[0], {'font-family':MONO, 'font-size':'var(--type-body-small)', fill:INK});
    txt(x+w-120, ry, r[1], {'font-family':MONO, 'font-size':'var(--type-body-small)', 'text-anchor':'end', fill:'var(--ink-70)'});
    txt(x+w-26, ry, r[2], {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'text-anchor':'end', fill:INK45});
    if (i < rows.length-1) el('line', {x1:x+26, y1:ry+14, x2:x+w-26, y2:ry+14, stroke:INK, 'stroke-width':.5, 'stroke-dasharray':'2 5', opacity:.25});
  });
})();

stageFit();
</script>
