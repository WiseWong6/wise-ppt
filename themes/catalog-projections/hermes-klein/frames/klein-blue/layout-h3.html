<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--xp-ink)', INK45 = 'rgba(26,26,26,.45)', INK55 = 'rgba(26,26,26,.55)', INK80 = 'rgba(26,26,26,.8)';
var TOP = 'var(--xp-top)', PAPER = 'var(--xp-paper)', ACCENT = 'var(--xp-accent)';
var MONO = 'var(--mono)', SANS = 'var(--sans)', OSWALD = "'Oswald Replica', 'Arial Narrow', sans-serif", SERIF = 'var(--xp-serif)';
var G = document.getElementById('draw');
function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); (parent || G).appendChild(e); return e; }
function txt(x, y, str, attrs, parent) { var t = el('text', Object.assign({ x: x, y: y, fill: INK }, attrs || {}), parent); t.textContent = str; return t; }

/* 基线坐标：layout-h3.html（paper-ink.nested.architecture-stack），全部保留。 */
G = el('g', { transform: 'translate(0 2.3)' });
var BT = 240, BH = 132, BB = BT + BH * 4;

/* —— 整表 = 一整块白前景，橙色硬影只在整表外缘（右+下）；层间用细线分 —— */
el('rect', { x: 150, y: BT, width: 1620, height: BB - BT, fill: TOP, stroke: INK, 'stroke-width': 1.3, filter: 'url(#xp-hard)' });
[BT + BH, BT + BH * 2, BT + BH * 3].forEach(function (y) {
  el('line', { x1: 150, y1: y, x2: 1770, y2: y, stroke: INK, 'stroke-width': .6, opacity: .3 });
});
el('line', { x1: 310, y1: BT, x2: 310, y2: BB, stroke: INK, 'stroke-width': .6, opacity: .3 });

function nodeDot(cx, cy, parent) {
  el('circle', { cx: cx, cy: cy, r: 5, fill: 'none', stroke: INK80, 'stroke-width': 1 }, parent);
  el('circle', { cx: cx, cy: cy, r: 1.8, fill: INK }, parent);
}
function gSocket(cx, cy, parent) {
  el('rect', { x: cx - 30, y: cy - 22, width: 60, height: 36, rx: 8, ry: 8, fill: 'none', stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('path', { d: 'M ' + (cx - 8) + ' ' + (cy + 14) + ' L ' + (cx - 14) + ' ' + (cy + 26) + ' L ' + (cx + 2) + ' ' + (cy + 14), fill: 'none', stroke: INK80, 'stroke-width': 1.2, 'stroke-linejoin': 'round' }, parent);
  [-12, 0, 12].forEach(function (dx) { el('circle', { cx: cx + dx, cy: cy - 4, r: 2.2, fill: INK }, parent); });
}
function gPlug(cx, cy, parent) {
  el('rect', { x: cx - 26, y: cy - 22, width: 52, height: 44, rx: 3, ry: 3, fill: 'none', stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('line', { x1: cx - 26, y1: cy - 10, x2: cx + 26, y2: cy - 10, stroke: INK, 'stroke-width': .7, opacity: .45 }, parent);
  el('circle', { cx: cx - 20, cy: cy - 16, r: 1.8, fill: INK }, parent);
  el('circle', { cx: cx - 13, cy: cy - 16, r: 1.8, fill: 'none', stroke: INK, 'stroke-width': .7, opacity: .5 }, parent);
  [-6, 8].forEach(function (dy) { [-12, 6].forEach(function (dx) { el('rect', { x: cx + dx, y: cy + dy, width: 12, height: 10, fill: 'none', stroke: INK, 'stroke-width': .8, opacity: .7 }, parent); }); });
}
function gAntenna(cx, cy, parent) {
  el('line', { x1: cx, y1: cy + 24, x2: cx, y2: cy, stroke: INK80, 'stroke-width': 1.3 }, parent);
  el('line', { x1: cx, y1: cy, x2: cx - 22, y2: cy - 14, stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('line', { x1: cx, y1: cy, x2: cx, y2: cy - 18, stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('line', { x1: cx, y1: cy, x2: cx + 22, y2: cy - 14, stroke: INK80, 'stroke-width': 1.2 }, parent);
  nodeDot(cx, cy + 26, parent); nodeDot(cx - 24, cy - 15, parent); nodeDot(cx, cy - 20, parent); nodeDot(cx + 24, cy - 15, parent);
}
function gGear(cx, cy, parent) {
  el('circle', { cx: cx, cy: cy, r: 22, fill: 'none', stroke: INK80, 'stroke-width': 1.3 }, parent);
  el('circle', { cx: cx, cy: cy, r: 7, fill: 'none', stroke: INK80, 'stroke-width': 1.1 }, parent);
  for (var a = 0; a < 8; a++) { var t = a * Math.PI / 4; el('line', { x1: cx + Math.cos(t) * 22, y1: cy + Math.sin(t) * 22, x2: cx + Math.cos(t) * 29, y2: cy + Math.sin(t) * 29, stroke: INK80, 'stroke-width': 1.6 }, parent); }
}
function gDial(cx, cy, parent) {
  el('rect', { x: cx - 28, y: cy - 20, width: 26, height: 34, fill: 'none', stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('line', { x1: cx - 23, y1: cy - 12, x2: cx - 7, y2: cy - 12, stroke: INK, 'stroke-width': .8, opacity: .6 }, parent);
  el('line', { x1: cx - 23, y1: cy - 5, x2: cx - 7, y2: cy - 5, stroke: INK, 'stroke-width': .8, opacity: .6 }, parent);
  el('line', { x1: cx - 23, y1: cy + 2, x2: cx - 12, y2: cy + 2, stroke: INK, 'stroke-width': .8, opacity: .6 }, parent);
  el('circle', { cx: cx + 12, cy: cy - 2, r: 11, fill: 'none', stroke: INK80, 'stroke-width': 1.3 }, parent);
  el('line', { x1: cx + 20, y1: cy + 6, x2: cx + 28, y2: cy + 14, stroke: INK80, 'stroke-width': 1.8, 'stroke-linecap': 'round' }, parent);
}
function gRoute(cx, cy, parent) {
  nodeDot(cx, cy, parent);
  [[-26, -14], [26, -14], [-26, 16], [26, 16]].forEach(function (p) {
    el('line', { x1: cx, y1: cy, x2: cx + p[0], y2: cy + p[1], stroke: INK80, 'stroke-width': 1.1 }, parent);
    nodeDot(cx + p[0], cy + p[1], parent);
  });
  el('line', { x1: cx - 26, y1: cy - 14, x2: cx + 26, y2: cy - 14, stroke: INK, 'stroke-width': .6, opacity: .35, 'stroke-dasharray': '3 4' }, parent);
  el('line', { x1: cx - 26, y1: cy + 16, x2: cx + 26, y2: cy + 16, stroke: INK, 'stroke-width': .6, opacity: .35, 'stroke-dasharray': '3 4' }, parent);
}
function gCylinder(cx, cy, w, h, parent) {
  el('ellipse', { cx: cx, cy: cy - h / 2, rx: w / 2, ry: 8, fill: 'none', stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('line', { x1: cx - w / 2, y1: cy - h / 2, x2: cx - w / 2, y2: cy + h / 2, stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('line', { x1: cx + w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2, stroke: INK80, 'stroke-width': 1.2 }, parent);
  el('path', { d: 'M ' + (cx - w / 2) + ' ' + (cy + h / 2) + ' A ' + (w / 2) + ' 8 0 0 0 ' + (cx + w / 2) + ' ' + (cy + h / 2), fill: 'none', stroke: INK80, 'stroke-width': 1.2 }, parent);
}
function gDisks(cx, cy, parent) {
  el('path', { d: 'M ' + (cx - 2) + ' ' + (cy - 18) + ' C ' + (cx - 14) + ' ' + (cy - 22) + ', ' + (cx - 30) + ' ' + (cy - 20) + ', ' + (cx - 30) + ' ' + (cy - 14) + ' L ' + (cx - 30) + ' ' + (cy + 16) + ' C ' + (cx - 30) + ' ' + (cy + 22) + ', ' + (cx - 14) + ' ' + (cy + 24) + ', ' + (cx - 2) + ' ' + (cy + 20), fill: 'none', stroke: INK80, 'stroke-width': 1.2, 'stroke-linejoin': 'round' }, parent);
  el('path', { d: 'M ' + (cx + 2) + ' ' + (cy - 18) + ' C ' + (cx + 14) + ' ' + (cy - 22) + ', ' + (cx + 30) + ' ' + (cy - 20) + ', ' + (cx + 30) + ' ' + (cy - 14) + ' L ' + (cx + 30) + ' ' + (cy + 16) + ' C ' + (cx + 30) + ' ' + (cy + 22) + ', ' + (cx + 14) + ' ' + (cy + 24) + ', ' + (cx + 2) + ' ' + (cy + 20), fill: 'none', stroke: INK80, 'stroke-width': 1.2, 'stroke-linejoin': 'round' }, parent);
  el('line', { x1: cx, y1: cy - 18, x2: cx, y2: cy + 20, stroke: INK80, 'stroke-width': 1, opacity: .5 }, parent);
  [-20, -10, 0, 10].forEach(function (dy) {
    el('line', { x1: cx - 25, y1: cy + dy, x2: cx - 7, y2: cy + dy, stroke: INK, 'stroke-width': .6, opacity: .5 }, parent);
    el('line', { x1: cx + 7, y1: cy + dy, x2: cx + 25, y2: cy + dy, stroke: INK, 'stroke-width': .6, opacity: .5 }, parent);
  });
}
function gChip(cx, cy, parent) {
  var r = 22;
  el('path', { d: 'M ' + (cx + r) + ' ' + (cy - r * .4) + ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx - r * .7) + ' ' + (cy - r * .7), fill: 'none', stroke: INK80, 'stroke-width': 1.4 }, parent);
  el('path', { d: 'M ' + (cx - r) + ' ' + (cy + r * .4) + ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx + r * .7) + ' ' + (cy + r * .7), fill: 'none', stroke: INK80, 'stroke-width': 1.4 }, parent);
  el('path', { d: 'M ' + (cx + r) + ' ' + (cy - r * .4) + ' L ' + (cx + r + 5) + ' ' + (cy - r * .4 - 6) + ' L ' + (cx + r - 6) + ' ' + (cy - r * .4 - 3), fill: 'none', stroke: INK80, 'stroke-width': 1.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, parent);
  el('path', { d: 'M ' + (cx - r) + ' ' + (cy + r * .4) + ' L ' + (cx - r - 5) + ' ' + (cy + r * .4 + 6) + ' L ' + (cx - r + 6) + ' ' + (cy + r * .4 + 3), fill: 'none', stroke: INK80, 'stroke-width': 1.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, parent);
}
function gScope(cx, cy, parent) {
  var s = 14, gap = 4;
  for (var row = 0; row < 3; row++) for (var col = 0; col < 3; col++) {
    var x = cx - (s * 3 + gap * 2) / 2 + col * (s + gap), y = cy - (s * 3 + gap * 2) / 2 + row * (s + gap);
    var lit = (row + col) % 2 === 0;
    el('rect', { x: x, y: y, width: s, height: s, fill: 'none', stroke: INK80, 'stroke-width': 1.1, opacity: lit ? 1 : .5 }, parent);
    if (lit) el('rect', { x: x + 3, y: y + 3, width: s - 6, height: s - 6, fill: 'none', stroke: INK, 'stroke-width': .6, opacity: .5 }, parent);
  }
}
function gCluster(cx, cy, parent) {
  var s = 20, gap = 7;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (p, i) {
    var x = cx + p[0] * (s / 2 + gap / 2) - s / 2, y = cy + p[1] * (s / 2 + gap / 2) - s / 2;
    el('rect', { x: x, y: y, width: s, height: s, fill: 'none', stroke: INK80, 'stroke-width': 1.1, opacity: i === 3 ? .45 : 1, 'stroke-dasharray': i === 3 ? '3 3' : 'none' }, parent);
  });
  el('line', { x1: cx - s - gap / 2 + 10, y1: cy, x2: cx + s + gap / 2 - 10, y2: cy, stroke: INK, 'stroke-width': .7, opacity: .4 }, parent);
  el('line', { x1: cx, y1: cy - s - gap / 2 + 10, x2: cx, y2: cy + s + gap / 2 - 10, stroke: INK, 'stroke-width': .7, opacity: .4 }, parent);
}

/* —— 层定义：四层等权，L2 / MODEL 不承担强调 —— */
var layers = [
  { no: 'L1', cn: '应用层', en: 'APPLICATION', items: [
    { g: gSocket, en: 'CHAT', cn: '对话界面' },
    { g: gPlug, en: 'ASSIST', cn: '助手面板' },
    { g: gAntenna, en: 'API HUB', cn: '开放接口' } ] },
  { no: 'L2', cn: '模型层', en: 'MODEL', items: [
    { g: gGear, en: 'LLM', cn: '大语言模型' },
    { g: gDial, en: 'RAG', cn: '检索增强' },
    { g: gRoute, en: 'AGENT', cn: '智能体' } ] },
  { no: 'L3', cn: '数据层', en: 'DATA', items: [
    { g: function (cx, cy, p) { gCylinder(cx, cy, 46, 44, p); }, en: 'VEC DB', cn: '向量库' },
    { g: gDisks, en: 'KNOWLEDGE', cn: '知识库' },
    { g: gChip, en: 'FEEDBACK', cn: '反馈管线' } ] },
  { no: 'L4', cn: '基础层', en: 'INFRA', items: [
    { g: gScope, en: 'GPU POOL', cn: '算力集群' },
    { g: gAntenna, en: 'GATEWAY', cn: '网关' },
    { g: gCluster, en: 'MONITOR', cn: '监控告警' } ] }
];

var IXS = [620, 1065, 1510];
layers.forEach(function (L, r) {
  var midY = BT + r * BH + BH / 2;
  /* 左列层标是结构元数据，全部保持墨色；焦点只由整块表面表达。 */
  txt(160, midY - 16, L.no, { 'font-family': MONO, 'font-weight': 700, 'font-size': 'var(--type-body)', 'letter-spacing': 2, fill: INK });
  txt(160, midY + 12, L.cn, { 'font-family': SANS, 'font-weight': 300, 'font-size': 'var(--type-body)', fill: INK });
  txt(160, midY + 34, L.en, { 'font-family': OSWALD, 'font-weight': 700, 'font-size': 'var(--type-micro-secondary)', 'letter-spacing': 2, fill: INK45 });
  el('line', { x1: 160, y1: midY + 48, x2: 230, y2: midY + 48, stroke: INK, 'stroke-width': .6, opacity: .3 });
  /* 带内能力件等权；层次只由图元自身的线宽和墨色浓淡表达。 */
  var zone = el('g', {});
  L.items.forEach(function (it, i) {
    var cx = IXS[i];
    it.g(cx - 70, midY, zone);
    txt(cx - 16, midY - 4, it.en, { 'font-family': MONO, 'font-weight': 700, 'font-size': 'var(--type-meta)', 'letter-spacing': 1.5, fill: INK55 }, zone);
    txt(cx - 16, midY + 22, it.cn, { 'font-family': SANS, 'font-weight': 300, 'font-size': 'var(--type-body-small)', fill: INK }, zone);
  });
});

stageFit();
