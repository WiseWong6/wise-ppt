<script>
var NS = 'http://www.w3.org/2000/svg';
var INK80 = 'var(--ink-80)';
var INK = 'var(--ink)';
var PAPER = 'var(--paper)';
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

/* ===== 全幅画墙:三排微倾卡片铺满画布,再蒙纸色雾压成底纹 ===== */
var cards = [
  /* 后排:大画幅,探出画布上下缘 */
  {x:-70,  y:-90,  w:430, h:560, r:-5,  art:'portrait'},
  {x:420,  y:-130, w:400, h:540, r:4,   art:'scene-room'},
  {x:880,  y:-80,  w:430, h:570, r:-3,  art:'billboard'},
  {x:1370, y:-120, w:410, h:550, r:6,   art:'portrait-b'},
  {x:1740, y:-70,  w:280, h:520, r:-4,  art:'scene-path'},
  {x:-90,  y:560,  w:380, h:560, r:5,   art:'scene-path'},
  {x:340,  y:610,  w:430, h:540, r:-6,  art:'billboard'},
  {x:830,  y:650,  w:400, h:530, r:3,   art:'portrait'},
  {x:1290, y:600,  w:430, h:560, r:-5,  art:'scene-room'},
  {x:1760, y:640,  w:260, h:540, r:4,   art:'portrait-b'}
];

/* 三种小画稿:人像 / 场景 / 立牌,全部线稿 */
function drawPortrait(cx, cy, s) {
  el('circle', {cx:cx, cy:cy-28*s, r:34*s, fill:'none', stroke:INK, 'stroke-width':1.1, opacity:.6});
  el('circle', {cx:cx-12*s, cy:cy-32*s, r:3.2*s, fill:INK, opacity:.62});
  el('circle', {cx:cx+12*s, cy:cy-32*s, r:3.2*s, fill:INK, opacity:.62});
  el('path', {d:'M '+(cx-18*s)+' '+(cy-16*s)+' Q '+cx+' '+(cy-6*s)+' '+(cx+18*s)+' '+(cy-16*s),
    fill:'none', stroke:INK, 'stroke-width':.9, opacity:.5});
  el('path', {d:'M '+(cx-46*s)+' '+(cy+62*s)+' Q '+cx+' '+(cy+8*s)+' '+(cx+46*s)+' '+(cy+62*s),
    fill:'none', stroke:INK, 'stroke-width':1.1, opacity:.6});
}
function drawScene(cx, cy, s) {
  el('rect', {x:cx-52*s, y:cy-14*s, width:70*s, height:52*s, rx:4*s, fill:'none', stroke:INK, 'stroke-width':1, opacity:.58});
  el('rect', {x:cx+26*s, y:cy+6*s, width:34*s, height:32*s, rx:3*s, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.5});
  el('line', {x1:cx-44*s, y1:cy+38*s, x2:cx+10*s, y2:cy+38*s, stroke:INK, 'stroke-width':.8, opacity:.4});
  el('circle', {cx:cx+58*s, cy:cy-34*s, r:14*s, fill:'none', stroke:INK, 'stroke-width':.9, opacity:.5});
  el('path', {d:'M '+(cx-30*s)+' '+(cy+58*s)+' L '+(cx+6*s)+' '+(cy+58*s)+' L '+(cx+44*s)+' '+(cy+80*s),
    fill:'none', stroke:INK, 'stroke-width':1, opacity:.5});
}
function drawBillboard(cx, cy, s) {
  el('rect', {x:cx-58*s, y:cy-52*s, width:116*s, height:74*s, rx:6*s, fill:'rgba(255,255,255,.1)', stroke:INK, 'stroke-width':1.1, opacity:.62});
  el('line', {x1:cx-40*s, y1:cy-30*s, x2:cx+40*s, y2:cy-30*s, stroke:INK, 'stroke-width':.9, opacity:.46});
  el('line', {x1:cx-40*s, y1:cy-12*s, x2:cx+22*s, y2:cy-12*s, stroke:INK, 'stroke-width':.8, opacity:.34});
  el('line', {x1:cx, y1:cy+22*s, x2:cx, y2:cy+58*s, stroke:INK, 'stroke-width':1.3, opacity:.55});
  el('line', {x1:cx-34*s, y1:cy+58*s, x2:cx+34*s, y2:cy+58*s, stroke:INK, 'stroke-width':1.1, opacity:.5});
}

cards.forEach(function(c, i){
  var g = el('g', {transform:'rotate('+c.r+' '+(c.x+c.w/2)+' '+(c.y+c.h/2)+')'});
  /* 卡纸 */
  g.appendChild((function(){
    var rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', c.x); rect.setAttribute('y', c.y);
    rect.setAttribute('width', c.w); rect.setAttribute('height', c.h);
    rect.setAttribute('rx', 12);
    rect.setAttribute('fill', i % 3 === 0 ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.06)');
    rect.setAttribute('stroke', INK80); rect.setAttribute('stroke-width', 1.25);
    rect.setAttribute('opacity', .8);
    return rect;
  })());
  var inner = document.createElementNS(NS, 'rect');
  inner.setAttribute('x', c.x+10); inner.setAttribute('y', c.y+10);
  inner.setAttribute('width', c.w-20); inner.setAttribute('height', c.h-20);
  inner.setAttribute('rx', 8);
  inner.setAttribute('fill', 'none'); inner.setAttribute('stroke', INK);
  inner.setAttribute('stroke-width', .5); inner.setAttribute('opacity', .22);
  g.appendChild(inner);

  var cx = c.x + c.w/2, cy = c.y + c.h/2 - 14, s = Math.min(c.w, c.h) / 190;
  if (c.art === 'portrait') drawPortrait(cx, cy, s);
  else if (c.art === 'portrait-b') { drawPortrait(cx, cy-16*s, s*.86); drawScene(cx+6*s, cy+58*s, s*.6); }
  else if (c.art === 'scene-room') drawScene(cx, cy, s);
  else drawBillboard(cx, cy, s);

  /* 卡片底注 mono */
  var label = document.createElementNS(NS, 'text');
  label.setAttribute('x', c.x + 22); label.setAttribute('y', c.y + c.h - 24);
  label.setAttribute('font-family', MONO); label.setAttribute('font-size', 15);
  label.setAttribute('letter-spacing', 2.5); label.setAttribute('fill', INK);
  label.setAttribute('opacity', .4);
  label.textContent = 'PLATE ' + (i + 1 < 10 ? '0' : '') + (i + 1);
  g.appendChild(label);
  G.appendChild(g);
});

/* 纸色雾:把画墙压成底纹,标题区更亮 */
el('rect', {x:0, y:0, width:1920, height:1080, fill:PAPER, opacity:.66});
el('rect', {x:0, y:0, width:860, height:1080, fill:PAPER, opacity:.42});

/* 雾上细字号页脚注记,保持画墙的"档案感" */
txt(176, 986, 'GALLERY WALL — TEN PLATES, ONE RELEASE', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, fill:INK, opacity:.42});

stageFit();
</script>
