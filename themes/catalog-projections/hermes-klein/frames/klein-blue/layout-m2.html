<script>
(function(){
  var ctx = document.getElementById('px').getContext('2d');
  var ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--xp-accent').trim();
  function focusDot(x, y, r, a) {
    ctx.globalAlpha = a;
    ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ---------- 四周纸白静点氛围（避开中央主角与 caption 区） ---------- */
  PART.dust(ctx, 120, 140, 1680, 150, 85, .22);
  PART.dust(ctx, 120, 320, 560, 420, 72, .20);
  PART.dust(ctx, 1240, 320, 560, 420, 72, .20);
  PART.dust(ctx, 120, 730, 1680, 90, 56, .18);

  /* ---------- 主环：尺度放大约 1.6 倍，维持原粒子间距与让位角度 ---------- */
  var CX = 960, CY = 503.8, R = 138, N = 36, GAP_INDEX = 8, GAP_OFFSET = 56;
  for (var i = 0; i < N; i++) {
    if (i === GAP_INDEX) continue;               // 缺口：让位的那一粒不在环上
    var an = -Math.PI / 2 + i / N * 6.2832;
    var px = CX + Math.cos(an) * R + (PART.rand() - .5) * 1.4;
    var py = CY + Math.sin(an) * R + (PART.rand() - .5) * 1.4;
    focusDot(px, py, 2.4 + PART.rand(), .88 + PART.rand() * .11);
  }
  // 让位的一粒：在缺口外侧偏开一步
  var gapAngle = -Math.PI / 2 + GAP_INDEX / N * 6.2832;
  var gx = CX + Math.cos(gapAngle) * (R + GAP_OFFSET);
  var gy = CY + Math.sin(gapAngle) * (R + GAP_OFFSET);
  focusDot(gx, gy, 3.2, .98);
  // 环心一粒静止核
  focusDot(CX, CY, 3, .96);
})();

/* ---------- 细线制图标记：让位轨迹（虚线） + 构造环 ---------- */
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var ACCENT_STROKE = 'var(--xp-accent)';
  var G = document.getElementById('draw');
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    G.appendChild(e); return e;
  }
  var CX = 960, CY = 503.8, R = 138, N = 36, GAP_INDEX = 8, GAP_OFFSET = 56;
  var gapAngle = -Math.PI / 2 + GAP_INDEX / N * 6.2832;
  var ix = CX + Math.cos(gapAngle) * R,  iy = CY + Math.sin(gapAngle) * R;
  var ox = CX + Math.cos(gapAngle) * (R + GAP_OFFSET), oy = CY + Math.sin(gapAngle) * (R + GAP_OFFSET);

  // 构造环（虚线基准，不擦除）
  el('circle', {cx:CX, cy:CY, r:R+18, fill:'none',
    stroke:ACCENT_STROKE, 'stroke-width':.7, opacity:.38, 'stroke-dasharray':'2 7'});
  // 让位轨迹：缺口 → 外偏点，虚线 + 中点小圆点
  el('line', {x1:ix, y1:iy, x2:ox, y2:oy, stroke:ACCENT_STROKE,
    'stroke-width':.8, opacity:.62, 'stroke-dasharray':'3 5'});
  el('circle', {cx:(ix+ox)/2, cy:(iy+oy)/2, r:2.8, fill:ACCENT_STROKE, opacity:.9});
})();

stageFit();
</script>
