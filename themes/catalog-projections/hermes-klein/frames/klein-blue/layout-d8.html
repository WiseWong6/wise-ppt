<script>
var NS = 'http://www.w3.org/2000/svg';
var INK80 = 'var(--ink-80)';
var INK = 'var(--ink)';
var TOP = 'var(--xp-top)';
var ACCENT = 'var(--xp-accent)';
var G = document.getElementById('draw');
function el(tag, attrs) {

}

/* ===== 左侧 Agent 工程工作台:主机、双屏、工具舱与评测回路组成一个完整主体 ===== */
(function(){

  el('ellipse', {cx:X+342, cy:Y+285, rx:344, ry:286, fill:'none', stroke:INK,
    'stroke-width':.65, opacity:.16, 'stroke-dasharray':'3 9'});
  el('path', {d:'M '+(X+34)+' '+(Y+240)+' A 320 266 0 0 1 '+(X+520)+' '+(Y+48), fill:'none', stroke:INK,
    'stroke-width':1.05, opacity:.4, 'stroke-linecap':'round'});
  el('path', {d:'M '+(X+644)+' '+(Y+286)+' A 320 266 0 0 1 '+(X+178)+' '+(Y+532), fill:'none', stroke:INK,
    'stroke-width':1.05, opacity:.4, 'stroke-linecap':'round'});

  /* 主屏:双线框+顶栏+左导航+三个内部工程区 */
  el('rect', {x:X+98, y:Y+70, width:472, height:300, fill:'none',
    stroke:INK80, 'stroke-width':1.3});

  [0,1,2].forEach(function(i){
    el('circle', {cx:X+122+i*18, cy:Y+94, r:3, fill:i===2?INK:'none', stroke:INK, 'stroke-width':.65, opacity:.58});

  el('circle', {cx:X+542, cy:Y+94, r:7, fill:'none', stroke:INK, 'stroke-width':.8, opacity:.55});
  el('circle', {cx:X+542, cy:Y+94, r:2.2, fill:INK, opacity:.7});
  el('line', {x1:X+174, y1:Y+118, x2:X+174, y2:Y+370, stroke:INK, 'stroke-width':.8, opacity:.46});
  [0,1,2,3,4].forEach(function(i){
    el('rect', {x:X+122, y:Y+144+i*42, width:28, height:20, fill:'none', stroke:INK,

  /* 左上任务链 */
  el('rect', {x:X+202, y:Y+146, width:204, height:78, fill:'none', stroke:INK,

  });

  /* 回路上的节点和套准线 */
  [
    {x:X+34,y:Y+240},{x:X+180,y:Y+56},{x:X+520,y:Y+48},
    {x:X+644,y:Y+286},{x:X+496,y:Y+510},{x:X+178,y:Y+532}
  ].forEach(function(n, i){
    el('circle', {cx:n.x, cy:n.y, r:i%2?5:7, fill:TOP, stroke:INK, 'stroke-width':.85, opacity:.65});
    el('circle', {cx:n.x, cy:n.y, r:1.8, fill:INK, opacity:.7});
  });
})();

stageFit();
