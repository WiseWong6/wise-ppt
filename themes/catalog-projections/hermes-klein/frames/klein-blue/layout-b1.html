<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK80 = 'var(--ink-80)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -50.7)'});


/* ---------- 主轴 + 刻度齿 ---------- */
var AXIS = 560;
el('line', {x1:200, y1:AXIS, x2:1720, y2:AXIS, stroke:INK80, 'stroke-width':1.2});
for (var tx = 200, i = 0; tx <= 1720; tx += 38, i++) {
  var major = (i % 5 === 0);
  el('line', {x1:tx, y1:AXIS, x2:tx, y2:AXIS + (major?12:7), stroke:INK, 'stroke-width': major?1:.5, opacity: major?.4:.25});
}

/* ---------- 节点：大语言模型演进 ---------- */
var nodes = [
  {x: 280, y: 2018, name:'GPT-1',       org:'预训练雏形',      note:'1.17 亿参数 · 证明可行性', hot:false},
  {x: 548, y: 2019, name:'GPT-2',       org:'规模跃迁',        note:'',                        hot:false},
  {x: 816, y: 2020, name:'GPT-3',       org:'涌现能力',        note:'',                        hot:false},
  {x:1084, y: 2022, name:'ChatGPT',     org:'对话破圈',        note:'',                        hot:false},
  {x:1352, y: 2023, name:'GPT-4',       org:'多模态',          note:'推理 · 多模态 · 月活破亿', hot:true},
  {x:1620, y: 2025, name:'o1 / o3',     org:'推理模型',        note:'思维链 · 自我反思',        hot:false}
];

nodes.forEach(function(n){
  if (n.hot) {
    el('circle', {id:'b1-hot-dot', cx:n.x, cy:AXIS, r:5, fill:INK});
    el('circle', {id:'b1-hot-ring-1', cx:n.x, cy:AXIS, r:16, fill:'none', stroke:INK, 'stroke-width':1.4});
    el('circle', {id:'b1-hot-ring-2', cx:n.x, cy:AXIS, r:20, fill:'none', stroke:INK, 'stroke-width':.6, opacity:.4});
  } else {
    el('circle', {cx:n.x, cy:AXIS, r:9, fill:'var(--paper)', stroke:INK80, 'stroke-width':1.2});
    el('circle', {cx:n.x, cy:AXIS, r:3, fill:INK});
  }
  /* 上方：年份 / 名称 / 机构三段 + 短引线 */
  txt(n.x, AXIS-104, String(n.y), {id:n.hot?'b1-hot-year':'', 'font-family':MONO, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:INK});
  txt(n.x, AXIS-66, n.name, {id:n.hot?'b1-hot-name':'', 'data-model-name':1, 'font-family':MONO, 'font-size':'var(--type-body-small)', 'letter-spacing':1, 'text-anchor':'middle', fill:FOCUS});
  txt(n.x, AXIS-42, n.org, {id:n.hot?'b1-hot-org':'', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-meta)', 'text-anchor':'middle', fill:'var(--ink-45)'});
  el('line', {x1:n.x, y1:AXIS-28, x2:n.x, y2:AXIS-12, stroke:INK, 'stroke-width':.6, opacity:.4});
  /* 下方注释 */
  if (n.note) {
    txt(n.x, AXIS+52, n.note, {id:n.hot?'b1-hot-note':'', 'font-family':SANS, 'font-weight': n.hot?400:300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:n.hot?INK:'var(--wp-adapter-pi-ink-60)'});
    if (n.hot) el('line', {id:'b1-hot-underline', x1:n.x-120, y1:AXIS+66, x2:n.x+120, y2:AXIS+66, stroke:INK, 'stroke-width':1.2, opacity:.8});
  }
});

/* 高亮叙事：手绘弧线标记 */
el('path', {id:'b1-hot-arc-1', d:'M 1276 646 Q 1352 700 1428 646', fill:'none', stroke:INK, 'stroke-width':.8, opacity:.35});
el('path', {id:'b1-hot-arc-2', d:'M 1284 654 Q 1352 702 1420 654', fill:'none', stroke:INK, 'stroke-width':.6, opacity:.2});

stageFit();
</script>
