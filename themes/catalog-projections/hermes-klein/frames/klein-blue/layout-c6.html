<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK70 = 'var(--ink-70)';
var INK45 = 'var(--ink-45)';
var DIVIDER = 'var(--wp-color-divider)';
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (parent || G).appendChild(e); return e;
}
function txt(x, y, str, attrs, parent) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}), parent);
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)';

G = el('g', {transform:'translate(0 -7.2)'});

/* ---------- 引子 ---------- */
txt(960, 316, '上线 18 个月 · AI 产品成效总账', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:INK70});
txt(960, 350, 'AI IMPACT · 2026 H1', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK45});

/* ---------- 主角：通栏大数字横带（x120–1800，y380–640，4 格均分） ---------- */
var cells = [
  {num:'1.28',  unit:'M',  label:'日均调用量', en:'DAILY CALLS'},
  {num:'94.2',  unit:'%',  label:'任务完成率', en:'TASK SUCCESS', focus:true},
  {num:'280',   unit:'ms', label:'平均延迟',   en:'AVG LATENCY'},
  {num:'86,400',unit:'人', label:'覆盖用户数', en:'ACTIVE USERS'}
];
cells.forEach(function(C, i){
  var cx = 120 + 420*i + 210;
  /* 主角判定：第二项任务完成率是全页唯一焦点，编号、数值、中英文标签共同构成完整焦点。 */
  var sampleFocus = Boolean(C.focus);
  /* 格编号 */
  txt(cx, 408, 'No.0' + (i+1), {id:sampleFocus?'c6-focus-index':'', 'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill: INK45});
  /* 超大数字 + 降级单位 */
  /* 数值与单位属于同一个居中文本块；混合字号由 SVG 自己量宽，避免按字符数估宽造成偏移。 */
  var metric = el('text', {x:cx, y:532, 'text-anchor':'middle'});
  var number = el('tspan', {id:sampleFocus?'sample-focus':'c6-kpi-'+i, 'font-family':MONO, 'font-size':'var(--type-display)', fill:INK}, metric);
  number.textContent = C.num;
  var unit = el('tspan', {id:sampleFocus?'c6-focus-unit':'', dx:16, 'data-text-kind':'label', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', fill:INK70}, metric);
  unit.textContent = C.unit;
  /* 中文标签 + mono EN */
  txt(cx, 600, C.label, {id:sampleFocus?'c6-focus-label':'', 'data-text-kind':'label', 'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-subheading)', 'text-anchor':'middle', fill:INK});
  txt(cx, 632, C.en, {id:sampleFocus?'c6-focus-en':'', 'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill: INK45});
});
/* 格间 0.6px 竖线分隔（无外框） */
[540, 960, 1380].forEach(function(x, i){
  el('line', {id:i===0?'c6-divider':'', x1:x, y1:402, x2:x, y2:636, stroke:DIVIDER, 'stroke-width':.6});
});

/* ---------- 底部 mono 口号行（竖线分隔） ---------- */
var words = ['RETRIEVE', 'REASON', 'GENERATE', 'DELIVER'];
var wx = [762, 908, 1048, 1170];
var sx = [832, 984, 1112];
words.forEach(function(wd, i){
  txt(wx[i], 732, wd, {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':3, 'text-anchor':'middle', fill:INK70});
});
sx.forEach(function(x){
  el('line', {x1:x, y1:718, x2:x, y2:736, stroke:DIVIDER, 'stroke-width':.8});
});

stageFit();
