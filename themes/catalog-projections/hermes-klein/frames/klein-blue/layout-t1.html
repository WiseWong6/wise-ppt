     终点=整页唯一墨块（终端块语言）；轴与构造线保持墨色。 */
  :root {
    --xp-paper: #f2efe9;
    --xp-outside: #e5e2dc;
    --xp-recessed: #e4dfd5;
    --xp-top: #ffffff;
    --xp-ink: #1a1a1a;

    --xp-serif: 'Han Serif Catalog', 'Han Serif', serif;
    --wp-color-surface-canvas: var(--xp-paper);
    --wp-color-surface-recessed: var(--xp-recessed);
    --wp-color-primary: var(--xp-ink);
    --wp-color-functional: var(--xp-ink);
    --wp-color-body: rgba(26, 26, 26, 0.72);
    --wp-color-metadata: rgba(26, 26, 26, 0.45);
    --wp-color-divider: rgba(26, 26, 26, 0.2);
    --wp-color-construction: rgba(26, 26, 26, 0.12);
    --wp-color-focus: var(--xp-accent);
    --wp-private-identity-accent: var(--xp-ink);
  }
  body { background: var(--xp-outside); }

  /* 左上两行标题与左下角页码署名：橙色 Oswald 粗体小标。 */

    font-size: var(--type-body-small);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--xp-accent);
  }

  /* 底部论点：宋体粗，字号沿用生产规格 */
  #v3-t1 .caption { font-family: var(--xp-serif); font-weight: 700; }
  #t1-focus { color: var(--xp-accent); }


  #v3-t1 .scene { position: absolute; inset: 0; z-index: 1; transform: translateY(-62px); }

<script src="../../../../../themes/packages/paper-ink/assets/particles.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--xp-ink)', INK70 = 'rgba(26,26,26,.7)', INK45 = 'rgba(26,26,26,.45)';
var PAPER = 'var(--xp-paper)', RECESSED = 'var(--xp-recessed)', TOP = 'var(--xp-top)', ACCENT = 'var(--xp-accent)';
var SANS = 'var(--sans)', MONO = 'var(--mono)', OSWALD = "'Oswald Replica', 'Arial Narrow', sans-serif", SERIF = 'var(--xp-serif)';
var G = document.getElementById('t1-workflow');
function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); }); (parent || G).appendChild(n); return n; }
function txt(text, x, y, attrs, parent) { var n = el('text', Object.assign({ x: x, y: y, fill: INK, 'font-family': SANS, 'font-weight': 300 }, attrs || {}), parent); n.textContent = text; return n; }
function line(x1, y1, x2, y2, attrs, parent) { return el('line', Object.assign({ x1: x1, y1: y1, x2: x2, y2: y2, stroke: INK, 'stroke-width': 1.1 }, attrs || {}), parent); }

/* 基线坐标：layout-t1.html（paper-ink.flow.five-step-production），全部保留。 */
G.setAttribute('transform', 'translate(42 0)');
var C = [250, 580, 910, 1240, 1570], BY = 580;

/* —— 轴线与箭头：结构线保持墨色 —— */
var axis = el('g', { 'data-layout-role': 'axis' });
line(190, BY, 1730, BY, { stroke: INK45, 'stroke-width': 1 }, axis);
C.forEach(function (x) {
  line(x, BY - 9, x, BY + 9, { stroke: INK, 'stroke-width': 1.2 }, axis);
  el('circle', { cx: x, cy: BY, r: 3.6, fill: INK }, axis);
});
for (var i = 0; i < C.length - 1; i++) {
  var a = C[i] + 88, b = C[i + 1] - 88;
  line(a, BY, b, BY, { stroke: 'rgba(26,26,26,.8)', 'stroke-width': 1.25 }, axis);
  el('path', { d: 'M ' + (b - 11) + ' ' + (BY - 6) + ' L ' + b + ' ' + BY + ' L ' + (b - 11) + ' ' + (BY + 6), fill: 'none', stroke: 'rgba(26,26,26,.8)', 'stroke-width': 1.25 }, axis);
}

/* —— 工件：白前景线稿 + 承托灰；唯一墨块=终点生成物（终端块语言）—— */
var artifacts = el('g', { 'data-layout-role': 'artifacts' });

var doc = el('g', { transform: 'translate(0 -3)' }, artifacts);
el('path', { d: 'M 188 330 L 276 330 L 312 366 L 312 496 L 188 496 Z', fill: TOP, stroke: INK, 'stroke-width': 1.3, filter: 'url(#xp-hard)' }, doc);
el('path', { d: 'M 276 330 L 276 366 L 312 366', fill: 'none', stroke: INK, 'stroke-width': 1 }, doc);
[390, 418, 446].forEach(function (y, j) { line(212, y, j === 1 ? 282 : 268, y, { stroke: INK45, 'stroke-width': 1.1 }, doc); });
el('rect', { x: 292, y: 346, width: 14, height: 14, fill: ACCENT }, doc);

var structure = el('g', { transform: 'translate(0 14)' }, artifacts);
[0, 1, 2].forEach(function (j) {
  var x = 518 + j * 18, y = 354 - j * 14;
  el('rect', { x: x, y: y, width: 100, height: 112, fill: j === 0 ? RECESSED : (j === 1 ? PAPER : TOP), stroke: j === 2 ? INK : INK45, 'stroke-width': j === 2 ? 1.3 : 1 }, structure);
  line(x + 18, y + 28, x + 72, y + 28, { stroke: j === 2 ? INK70 : INK45, 'stroke-width': 1 }, structure);
  line(x + 18, y + 56, x + 62, y + 56, { stroke: j === 2 ? INK70 : INK45, 'stroke-width': 1 }, structure);
});

var judge = el('g', {}, artifacts); /* 中心已在 410 */
el('circle', { cx: 910, cy: 410, r: 82, fill: TOP, stroke: INK, 'stroke-width': 1.3 }, judge);
for (var deg = 0; deg < 360; deg += 30) {
  var rad = deg * Math.PI / 180;
  line(910 + Math.cos(rad) * 60, 410 + Math.sin(rad) * 60, 910 + Math.cos(rad) * 73, 410 + Math.sin(rad) * 73, { stroke: INK45, 'stroke-width': 1 }, judge);
}
line(910, 410, 954, 378, { stroke: ACCENT, 'stroke-width': 3 }, judge);
el('circle', { cx: 910, cy: 410, r: 5, fill: ACCENT }, judge);

var compose = el('g', { transform: 'translate(0 5)' }, artifacts);
[[1168, 344, 74, 54], [1252, 344, 58, 54], [1168, 408, 58, 58], [1236, 408, 74, 58]].forEach(function (r, j) {
  el('rect', { x: r[0], y: r[1], width: r[2], height: r[3], fill: j === 1 || j === 3 ? TOP : RECESSED, stroke: j === 1 || j === 3 ? INK : INK45, 'stroke-width': j === 1 || j === 3 ? 1.2 : 1 }, compose);
});

var deck = el('g', { transform: 'translate(0 9)' }, artifacts);
el('rect', { x: 1492, y: 338, width: 156, height: 126, fill: INK, stroke: INK, 'stroke-width': 1.3, style: 'filter: drop-shadow(8px 10px 10px rgba(26,26,26,.16))' }, deck);
el('rect', { x: 1492, y: 338, width: 6, height: 126, fill: ACCENT }, deck);
el('rect', { x: 1506, y: 348, width: 132, height: 106, fill: TOP, stroke: TOP, 'stroke-width': 1 }, deck);
line(1524, 376, 1620, 376, { stroke: INK45, 'stroke-width': 1.2 }, deck);
line(1524, 404, 1594, 404, { stroke: INK45, 'stroke-width': 1.2 }, deck);
el('circle', { cx: 1530, cy: 430, r: 4, fill: ACCENT }, deck);

/* —— 步骤：Oswald 橙色大数字（参考工作流卡）+ Oswald 英文名；中文保持细体 —— */
var steps = [['01', 'ANALYSE', '先理解内容', 'RAW MATERIAL'], ['02', 'STRUCTURE', '梳理叙事', 'NARRATIVE'], ['03', 'JUDGE', '判断版式', 'LAYOUT'], ['04', 'COMPOSE', '组合组件', 'COMPONENTS'], ['05', 'DELIVER', '生成网页 PPT', 'PLAYBACK']];
steps.forEach(function (s, j) {
  var x = C[j], item = el('g', { 'data-repeat-unit': 'workflow-step', 'data-bind-index': j });
  txt(s[0], x, BY + 84, { 'font-family': OSWALD, 'font-weight': 700, 'font-size': '48px', 'text-anchor': 'middle', fill: ACCENT }, item);
  txt(s[1], x, BY + 122, { 'font-family': OSWALD, 'font-weight': 700, 'font-size': 'var(--type-label)', 'letter-spacing': 2, 'text-anchor': 'middle', fill: INK70 }, item);
  txt(s[2], x, BY + 152, { 'font-size': 'var(--type-body-small)', 'text-anchor': 'middle', fill: INK70 }, item);
  txt(s[3], x, 806, { 'font-family': MONO, 'font-weight': 700, 'font-size': 'var(--type-meta)', 'letter-spacing': 1.8, 'text-anchor': 'middle', fill: INK45 }, item);
});
stageFit();
</script>
