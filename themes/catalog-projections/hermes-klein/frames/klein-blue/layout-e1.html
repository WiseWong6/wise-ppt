<script>
var NS = 'http://www.w3.org/2000/svg';
var INK = 'var(--ink)';
var INK45 = 'var(--ink-45)';
var FUNCTIONAL = 'var(--wp-color-functional)';
var DIVIDER = 'var(--wp-color-divider)';
var CONSTRUCTION = 'var(--wp-color-construction)';
/* accent 触发：读 URL 加类 + 染色常量（详见 design-tokens.md §2） */
if (location.search.indexOf('accent') >= 0) document.documentElement.classList.add('accent');
var ACCENT = document.documentElement.classList.contains('accent');
var FOCUS = getComputedStyle(document.documentElement).getPropertyValue('--wp-color-focus').trim();
var G = document.getElementById('draw');
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  G.appendChild(e); return e;
}
function txt(x, y, str, attrs) {
  var t = el('text', Object.assign({x:x, y:y}, attrs||{}));
  t.textContent = str; return t;
}
var MONO = 'var(--mono)', SANS = 'var(--sans)', OSWALD = "'Oswald Replica', 'Arial Narrow', sans-serif";

G = el('g', {transform:'translate(0 -32.7)'});

/* ---------- 双面板（520×560 双线框 + 顶部页签） ---------- */
var PY = 270, PH = 560, PW = 520;
var LX = 300, RX = 1100;                 /* 面板左缘；中心 560 / 1360 */
[LX, RX].forEach(function(px){
  el('rect', {id:px===LX?'e1-functional-frame':'', x:px, y:PY, width:PW, height:PH, fill:'var(--paper-panel)', stroke:FUNCTIONAL, 'stroke-width':1.3});
  el('rect', {id:px===LX?'e1-divider-frame':'', x:px+5, y:PY+5, width:PW-10, height:PH-10, fill:'none', stroke:DIVIDER, 'stroke-width':.6});
});
el('rect', {x:560-160, y:248, width:320, height:44, fill:'var(--paper)', stroke:FUNCTIONAL, 'stroke-width':1.2});
txt(486, 277, '传统软件', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-label)', fill:INK});
txt(555, 277, 'CLASSIC SOFTWARE', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'var(--wp-adapter-pi-ink-60)'});
el('rect', {x:1360-160, y:248, width:320, height:44, fill:'var(--paper)', stroke:FUNCTIONAL, 'stroke-width':1.2});
txt(1276, 277, 'Agent', {id:'e1-blue-agent-title', 'data-text-kind':'label', 'font-family':OSWALD, 'font-weight':700, 'font-size':'20px', 'letter-spacing':2, style:'font-weight:700 !important', fill:FOCUS});
txt(1353, 277, 'AGENTIC', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, fill:'var(--wp-adapter-pi-ink-60)'});

txt(560, 420, '错了中断', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-emphasis)', 'letter-spacing':4, 'text-anchor':'middle', fill:INK});

(function(){
  var x0 = 390, x1 = 730, y0 = 540;

  [y0, y0+52, y0+104].forEach(function(ay){
    for (var i = 0; i < 8; i++) {
      el('line', {x1:x0+i*46, y1:ay, x2:x0+i*46+26, y2:ay, stroke:CONSTRUCTION, 'stroke-width':1});
    }
  });
  /* 拣货员的折返虚线路径 */
  el('path', {d:'M '+(x0+12)+' '+(y0-26)+' L '+(x0+12)+' '+(y0+26)+' L '+(x0+104)+' '+(y0+26)

    fill:'none', stroke:FUNCTIONAL, 'stroke-width':1.1, 'stroke-dasharray':'5 5'});
  el('circle', {cx:x0+12, cy:y0-26, r:3, fill:'none', stroke:FUNCTIONAL, 'stroke-width':1.2});
  el('circle', {cx:x0+320, cy:y0+130, r:2.4, fill:FUNCTIONAL});

})();
txt(560, 806, '报错即停，等人工介入', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:'var(--wp-adapter-pi-ink-60)'});

el('path', {id:'e1-focus-check', d:'M 1452 404 L 1464 418 L 1488 388', fill:'none', stroke:FUNCTIONAL, 'stroke-width':3.5, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
txt(1360, 462, 'SELF-HEALING RELAY', {'font-family':MONO, 'font-size':'var(--type-meta)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});

/* 小图形：Agent 自愈接力直线送达目标 */
(function(){
  var y = 620, x0 = 1190, x1 = 1530;
  /* 起点：出错的 Agent 节点 */
  el('circle', {cx:x0, cy:y+34, r:16, fill:'none', stroke:FUNCTIONAL, 'stroke-width':1.2});
  el('circle', {cx:x0, cy:y+34, r:2.4, fill:FUNCTIONAL});
  el('rect', {x:x0-26, y:y-14, width:52, height:34, fill:'none', stroke:FUNCTIONAL, 'stroke-width':1.2});
  el('line', {x1:x0-26, y1:y+3, x2:x0+26, y2:y+3, stroke:DIVIDER, 'stroke-width':.6});
  /* 直线路径（实线开放箭头） */
  el('line', {x1:x0+40, y1:y+34, x2:x1-40, y2:y+34, stroke:FUNCTIONAL, 'stroke-width':1.4});
  el('path', {d:'M '+(x1-56)+' '+(y+26)+' L '+(x1-40)+' '+(y+34)+' L '+(x1-56)+' '+(y+42), fill:'none', stroke:FUNCTIONAL, 'stroke-width':1.4, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  /* 终点：工位（双圈+实心核） */
  el('circle', {cx:x1, cy:y+34, r:12, fill:'none', stroke:FUNCTIONAL, 'stroke-width':1.2});
  el('circle', {cx:x1, cy:y+34, r:16, fill:'none', stroke:DIVIDER, 'stroke-width':.6});
  el('circle', {cx:x1, cy:y+34, r:2.4, fill:FUNCTIONAL});
  txt(x1, y+78, 'STATION', {'font-family':MONO, 'font-size':'var(--type-micro-secondary)', 'letter-spacing':2, 'text-anchor':'middle', fill:INK45});
  /* 耗时标注 */
  txt(1360, y+146, '3 MIN · SELF-RECOVERY', {'font-family':MONO, 'font-size':'var(--type-label)', 'letter-spacing':2, 'text-anchor':'middle', fill:'var(--ink-70)'});
})();
txt(1360, 806, 'Agent 自己重试、自己修复', {'font-family':SANS, 'font-weight':300, 'font-size':'var(--type-body)', 'text-anchor':'middle', fill:'var(--wp-adapter-pi-ink-60)'});

/* ---------- 中央 VS 双圈徽章 + 构造引线 ---------- */
el('circle', {id:'e1-blue-vs-disc', cx:960, cy:460, r:34, fill:FOCUS, stroke:FUNCTIONAL, 'stroke-width':1.2});
el('circle', {id:'e1-blue-vs-ring', cx:960, cy:460, r:40, fill:'none', stroke:DIVIDER, 'stroke-width':.6});
txt(960, 460, 'VS', {id:'e1-blue-vs-label', 'data-text-kind':'label', 'font-family':OSWALD, 'font-weight':700, 'font-style':'italic', 'font-size':'var(--type-body)', 'letter-spacing':0, 'text-anchor':'middle', 'dominant-baseline':'central', style:'font-weight:700 !important', fill:'var(--paper)'});
el('line', {id:'e1-construction-line', x1:LX+PW+14, y1:460, x2:960-46, y2:460, stroke:CONSTRUCTION, 'stroke-width':.6, 'stroke-dasharray':'2 5'});
el('line', {x1:960+46, y1:460, x2:RX-14, y2:460, stroke:CONSTRUCTION, 'stroke-width':.6, 'stroke-dasharray':'2 5'});

stageFit();
